<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>考点刷题</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 40%, #fdf2f8 100%);
    background-attachment: fixed;
    color: #1f2937;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    color: #fff;
    padding: 18px 16px 14px; text-align: center;
    font-size: 17px; font-weight: 700;
    letter-spacing: .5px;
    box-shadow: 0 4px 20px rgba(99,102,241,.35);
    position: sticky; top: 0; z-index: 10;
  }
  .progress-bar {
    height: 6px; background: rgba(255,255,255,.25);
    margin-top: 12px; border-radius: 3px; overflow: hidden;
  }
  .progress-bar span {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #a5b4fc, #f0abfc);
    border-radius: 3px;
    transition: width .4s ease;
  }
  nav {
    display: flex; gap: 6px;
    padding: 10px 16px 0;
    position: sticky; top: 88px; z-index: 9;
  }
  nav button {
    flex: 1; border: none;
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(8px);
    padding: 10px 4px; font-size: 13px; font-weight: 600;
    color: #6b7280; font-family: inherit;
    border-radius: 999px;
    transition: all .2s ease;
    cursor: pointer;
  }
  nav button.active {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    box-shadow: 0 4px 12px rgba(99,102,241,.35);
  }
  main { flex: 1; padding: 16px; display: flex; flex-direction: column; }
  .card {
    background: #fff; border-radius: 20px;
    box-shadow: 0 8px 30px rgba(99,102,241,.10), 0 2px 8px rgba(0,0,0,.04);
    padding: 26px 20px; margin-bottom: 14px;
    flex: 1; display: flex; flex-direction: column;
    border: 1px solid rgba(255,255,255,.8);
  }
  .tag {
    display: inline-block; font-size: 12px; font-weight: 600;
    color: #6366f1; background: linear-gradient(135deg,#eef2ff,#f5f3ff);
    padding: 4px 12px; border-radius: 999px;
    margin-bottom: 16px; align-self: flex-start;
  }
  .question {
    font-size: 19px; font-weight: 700;
    line-height: 1.6; color: #111827;
  }
  .answer {
    margin-top: 20px; padding-top: 18px;
    border-top: 1px dashed #e5e7eb;
    font-size: 16px; line-height: 1.8; color: #374151;
    white-space: pre-wrap; display: none;
  }
  .answer.show { display: block; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .hint {
    margin-top: 16px; font-size: 14px; color: #9ca3af;
    text-align: center;
  }
  .actions { display: flex; gap: 10px; }
  button {
    border: none; border-radius: 14px;
    padding: 15px 8px; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: transform .12s, box-shadow .2s;
    font-family: inherit;
  }
  button:active { transform: scale(.97); }
  .btn-show { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; flex: 1; box-shadow: 0 6px 16px rgba(99,102,241,.35); }
  .btn-known { background: linear-gradient(135deg, #10b981, #059669); color: #fff; flex: 1; box-shadow: 0 6px 16px rgba(16,185,129,.30); }
  .btn-unknown { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; flex: 1; box-shadow: 0 6px 16px rgba(245,158,11,.30); }
  .btn-prev { background: #e5e7eb; color: #374151; flex: 0 0 90px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  footer {
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(229,231,235,.8);
    padding: 12px 16px; font-size: 13px; color: #6b7280;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; bottom: 0;
  }
  .stat b { color: #4f46e5; font-weight: 700; }
  .stat .ok { color: #10b981; }
  .stat .no { color: #f59e0b; }
  .reset { color: #ef4444; font-size: 13px; background: none; border: none; padding: 4px; flex: none; width: auto; font-weight: 600; }
  .list-view { display: none; }
  .list-view.show { display: block; }
  .list-item {
    background: #fff; border-radius: 14px;
    padding: 16px 18px; margin-bottom: 10px;
    box-shadow: 0 4px 14px rgba(99,102,241,.08);
    cursor: pointer; transition: transform .15s ease;
    border: 1px solid rgba(255,255,255,.8);
  }
  .list-item:active { transform: scale(.99); }
  .list-item .li-q { font-size: 15px; font-weight: 700; color: #111827; line-height: 1.55; }
  .list-item .li-a { margin-top: 10px; font-size: 14px; color: #6b7280; line-height: 1.7; white-space: pre-wrap; display: none; }
  .list-item.open .li-a { display: block; }
  .list-item .li-tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; margin-bottom: 8px; }
  .list-item .li-tag.wrong { background: #fef3c7; color: #b45309; }
  .list-item .li-tag.ok { background: #d1fae5; color: #047857; }
  .empty { text-align: center; color: #9ca3af; padding: 50px 20px; font-size: 15px; }
  #pet { position: fixed; right: 16px; bottom: 70px; z-index: 999; cursor: pointer; user-select: none; -webkit-user-select: none; filter: drop-shadow(0 6px 12px rgba(99,102,241,.35)); transition: transform .2s; }
  .home { padding: 20px 16px; }
  .home h2 { font-size: 18px; color: #4f46e5; margin: 0 0 16px; text-align: center; }
  .subject-card {
    background: #fff; border-radius: 18px;
    padding: 22px 20px; margin-bottom: 14px;
    box-shadow: 0 8px 24px rgba(99,102,241,.10);
    cursor: pointer; transition: transform .15s ease;
    display: flex; justify-content: space-between; align-items: center;
    border: 1px solid rgba(255,255,255,.8);
  }
  .subject-card:active { transform: scale(.98); }
  .subject-card .sc-name { font-size: 17px; font-weight: 700; color: #111827; }
  .subject-card .sc-info { font-size: 13px; color: #9ca3af; margin-top: 4px; }
  .subject-card .sc-arrow { font-size: 22px; color: #a5b4fc; }
</style>
</head>
<body>
<header id="header"><span id="headerTitle">考点刷题</span><div class="progress-bar"><span id="progress"></span></div></header>
<nav id="nav" style="display:none;">
  <button id="navQuiz" class="active">刷题</button>
  <button id="navWrong">错题集</button>
  <button id="navAll">全部题目</button>
</nav>
<main>
  <div id="homeView" class="home"><h2>选择科目</h2><div id="subjectList"></div></div>
  <div id="quizView" style="display:none;">
    <div class="card" id="card">
      <span class="tag" id="tag">第 1 题</span>
      <div class="question" id="question">加载中...</div>
      <div class="answer" id="answer"></div>
      <div class="hint" id="hint">先自己回想一下，再点「显示答案」</div>
    </div>
    <div class="actions" id="actions">
      <button class="btn-prev" id="btnPrev">← 上一个</button>
      <button class="btn-show" id="btnShow">显示答案</button>
    </div>
    <div class="actions" id="actionsAfter" style="display:none; margin-top:10px;">
      <button class="btn-prev" id="btnPrev2">← 上一个</button>
      <button class="btn-unknown" id="btnUnknown">不熟，再来</button>
      <button class="btn-known" id="btnKnown">会了，下一题</button>
    </div>
  </div>
  <div id="wrongView" class="list-view"><div id="wrongList"></div></div>
  <div id="allView" class="list-view"><div id="allList"></div></div>
</main>
<footer>
  <div class="stat">已掌握 <b class="ok" id="knownCount">0</b> · 待复习 <b class="no" id="unknownCount">0</b></div>
  <button class="reset" id="btnReset">重置进度</button>
</footer>
<div id="pet">
  <svg width="72" height="72" viewBox="0 0 100 100">
    <ellipse cx="50" cy="78" rx="26" ry="8" fill="rgba(99,102,241,.15)"/>
    <ellipse cx="50" cy="52" rx="28" ry="30" fill="#a5b4fc"/>
    <ellipse cx="50" cy="58" rx="20" ry="20" fill="#e0e7ff"/>
    <circle cx="40" cy="46" r="4.5" fill="#1f2937"/>
    <circle cx="60" cy="46" r="4.5" fill="#1f2937"/>
    <circle cx="41.5" cy="44.5" r="1.6" fill="#fff"/>
    <circle cx="61.5" cy="44.5" r="1.6" fill="#fff"/>
    <ellipse cx="50" cy="58" rx="3" ry="2" fill="#f472b6"/>
    <path d="M44 64 Q50 69 56 64" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="30" cy="56" r="3" fill="#fbcfe8" opacity=".8"/>
    <circle cx="70" cy="56" r="3" fill="#fbcfe8" opacity=".8"/>
  </svg>
  <div id="petMsg" style="position:absolute;right:80px;bottom:20px;background:#fff;color:#4f46e5;font-size:13px;font-weight:600;padding:8px 12px;border-radius:12px;box-shadow:0 4px 14px rgba(99,102,241,.25);white-space:nowrap;display:none;"></div>
</div><script>
/* ============ 题库 ============ */
const SUBJECTS = [
  {
    id: 'dev',
    name: '发展心理学',
    questions: [
      { q: "发展心理学的研究对象是什么？", a: "发展心理学是研究个体毕生心理发展的特点和规律的心理学分支科学。人的心身在生命进程中表现出量和质两方面的变化，且与年龄联系紧密，既表现出连续性，又表现出发展的阶段性，形成年龄特征。" },
      { q: "发展心理学研究心理发展的年龄特征，包括哪两个主要部分和四个有关方面？", a: "两个主要部分：\n（1）人的认知发展的年龄特征，包括感觉、知觉、记忆、思维、想象等，思维发展的年龄特征研究是其中最主要的一环；\n（2）社会性发展的年龄特征，包括兴趣、动机、情感、价值观、自我意识、能力、性格等，性格发展的年龄特征研究是其中最主要的一环。\n四个有关方面：\n（1）心理发展的社会生活条件和教育条件；\n（2）生理因素的发展；\n（3）动作和活动的发展；\n（4）言语的发展。" },
      { q: "什么是年龄特征？", a: "人的心理和身体的发展在生命进程中表现出连续性和阶段性，因而个体在不同年龄阶段将表现出特定的特征。" },
      { q: "什么是种系心理发展？", a: "种系心理发展是指从动物到人类的心理演变过程，包括动物心理的进化过程和人类心理的进化过程。前者研究的是动物心理学（比较心理学），后者研究的是民族心理学（主要是原始人类心理学）和个体发展心理学。" },
      { q: "促进人类动物祖先演变到人类有哪三个前提条件？", a: "一是直立行走和手的发展；二是使用工具和制造工具；三是因交往需要产生语言。" },
      { q: "人类心理的特点有哪些？", a: "（1）有意识的心理；\n（2）社会性的心理；\n（3）有语言功能的心理。" },
      { q: "什么是个体心理发展？", a: "个体心理发展是指人的个体从受精卵开始到出生、成熟直至衰老的整个生命中，心理发生和发展的过程。" },
      { q: "广义和狭义的发展心理学分别是什么？", a: "广义的发展心理学是研究种系和个体心理发生与发展的科学。狭义的发展心理学是个体发展心理学。" },
      { q: "个体心理发展的过程是什么？", a: "个体心理发展的过程是一个社会化的过程。社会化是个体掌握和积极再现社会经验、社会联系和社会关系的过程。" },
      { q: "关于个体心理发展与种系心理发展关系的理论，谁最具代表性？", a: "霍尔的复演论最具代表性。" },
      { q: "发展心理学的研究主要涉及哪两个问题？", a: "一个是有关心理发展原理或规律的理论问题；另一个是个体发展各年龄阶段的心理特征问题。" },
      { q: "发展心理学的理论研究涉及哪三个问题？", a: "（1）遗传和环境的作用问题；（2）外因与内因问题；（3）不断发展和发展阶段的关系问题。" },
      { q: "发展的连续性和阶段性中，渐进论和阶段论分别是什么？", a: "渐进论认为心理发展是量的积累过程；阶段论认为心理发展是非连续过程，会发生质变。" },
      { q: "科学儿童心理学是如何诞生的？", a: "普莱尔的《儿童心理》（1882年出版）是第一部科学的、系统的儿童心理学著作。" },
      { q: "儿童心理学的演变经历了哪几个时期？", a: "（1）准备时期；（2）形成时期；（3）分化和发展时期；（4）演变和增新时期。" },
      { q: "霍尔、荣格、霍林沃思分别有什么贡献？", a: "霍尔扩大到青春期；荣格最早研究成年期；霍林沃思1927年出版《发展心理学概论》。" },
      { q: "弗洛伊德的人格基本结构包括哪三部分？", a: "本我、自我、超我。" },
      { q: "什么是本我、自我和超我？", a: "本我遵循快乐原则；自我遵循现实原则；超我遵循道德原则。" },
      { q: "弗洛伊德的心理发展阶段说分为哪五个阶段？", a: "口唇期、肛门期、性器期、潜伏期、青春期。" },
      { q: "埃里克森人格发展八阶段分别是什么？", a: "婴儿期、儿童早期、学前期、学龄期、青年期、成年早期、成年中期、老年期。" },
      { q: "华生的主要观点是什么？", a: "否认遗传的作用，夸大环境和教育的作用。" },
      { q: "斯金纳的主要观点是什么？", a: "区分应答性行为和操作性行为，强调强化控制原理。" },
      { q: "什么是观察学习？", a: "通过观察他人所表现的行为及其结果而进行的学习。" },
      { q: "维果茨基的文化—历史发展理论是什么？", a: "解释人类心理本质上与动物不同的高级心理机能。" },
      { q: "什么是最近发展区？", a: "儿童现有发展水平与在成人帮助下可能达到的发展水平之间的差异。" },
      { q: "皮亚杰心理学的理论核心是什么？", a: "发生认识论。" },
      { q: "皮亚杰认为支配心理发展的因素有哪四个？", a: "成熟、物理因素、社会环境、平衡。" },
      { q: "皮亚杰心理发展的四个阶段是什么？", a: "感知运动阶段、前运算阶段、具体运算阶段、形式运算阶段。" },
      { q: "什么是客体永久性？", a: "儿童理解了物体是作为独立实体而存在的。" },
      { q: "布朗芬布伦纳的生态系统理论包括哪几个系统？", a: "微观系统、中间系统、外层系统、宏观系统、时间系统。" },
      { q: "发展心理学研究的功能有哪些？", a: "描述、解释、预测、控制。" },
      { q: "什么是横断研究设计？", a: "在某一特定的时间，同时对不同年龄的被试进行比较的研究设计。" },
      { q: "什么是纵向研究设计？", a: "对同一研究对象在不同的年龄或阶段进行长期反复观测的研究设计。" },
      { q: "什么是聚合交叉设计？", a: "将横断研究设计和纵向研究设计融合在一起的研究设计。" },
      { q: "什么是微观发生学设计？", a: "在短时间内重复给被试呈现一个诱发变化的刺激或提供学习的机会，观测个体发生变化的过程。" },
      { q: "胎儿宫内发育分为哪几个阶段？", a: "胚芽期、胚胎期、胎儿期。" },
      { q: "胎儿期心理卫生的种类有哪些？", a: "音乐胎教、抚摸胎教、言语胎教、光照胎教。" },
      { q: "婴儿大脑形态的发展表现在哪些方面？", a: "脑重与头围、大脑皮质。" },
      { q: "婴儿大脑的功能发展表现在哪些方面？", a: "脑电、皮质中枢、大脑单侧化。" },
      { q: "婴儿动作发展的规律有哪些？", a: "整分原则、头尾原则、大小原则、近远原则。" },
      { q: "影响动作发展的因素有哪些？", a: "成熟、学习与教育、营养与健康、环境因素。" },
      { q: "什么是视崖实验？", a: "吉布森和沃克用来证明婴儿深度知觉的心理学实验。" },
      { q: "什么是习惯化与去习惯化？", a: "习惯化是对重复刺激兴趣下降；去习惯化是刺激变化后重新感兴趣。" },
      { q: "言语发展的理论有哪些？", a: "先天论、后天论、认知学说、相互作用论。" },
      { q: "婴儿言语发展阶段有哪些？", a: "前言语阶段、言语的发生、单词句时期、简单句时期、复合句时期。" },
      { q: "气质的类型有哪些？", a: "四类型说、巴甫洛夫类型说、托马斯和切斯三类型说、巴斯活动特性说、卡根抑制—非抑制说、布雷泽尔顿三类型说。" },
      { q: "什么是拟合优度模型？", a: "托马斯和切斯提出，气质类型形成关键在于父母的教养方式是否与儿童的气质特点相符合。" },
      { q: "自我意识情绪主要包括哪几种？", a: "尴尬、自豪、羞耻、内疚。" },
      { q: "婴儿情绪社会化表现在哪些方面？", a: "社会性微笑、陌生人焦虑、分离焦虑、情绪的社会性参照。" },
      { q: "什么是依恋？其发展阶段有哪些？", a: "依恋是婴儿与主要抚养者之间最初的社会性联结。发展阶段：无差别社会反应阶段、有差别社会反应阶段、特殊情感联结阶段、目标调整的伙伴关系阶段。" },
      { q: "婴儿依恋的类型有哪些？", a: "安全型、回避型、反抗型、混乱型。" },
      { q: "婴儿早期同伴交往经历哪几个发展阶段？", a: "以客体为中心阶段、简单交往阶段、互补性交往阶段。" },
      { q: "婴儿自我认知发展分为哪几个阶段？", a: "主体我的发展（5~8个月、9~12个月、12~15个月）、客体我的发展（15~18个月、18~24个月）。" },
      { q: "早期的游戏理论有哪些？", a: "复演说、精力过剩说、机能快乐说、生活准备说、笑乐放松说、成熟说、能量匮乏论、元交际理论。" },
      { q: "游戏的特点有哪些？", a: "社会性、想象与现实的独特结合、主动参与伴有愉悦体验。" },

const $ = id => document.getElementById(id);

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const s = JSON.parse(raw); if (s && typeof s === 'object') return s; }
  } catch (e) {}
  return {};
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
function getSubjectState(id) { if (!state[id]) state[id] = { known: [], unknown: [] }; return state[id]; }
function total() { return currentSubject ? currentSubject.questions.length : 0; }
function updateProgress() {
  if (!currentSubject) return;
  const s = getSubjectState(currentSubject.id);
  const known = s.known.length;
  $('knownCount').textContent = known;
  $('unknownCount').textContent = total() - known;
  $('progress').style.width = (known / total() * 100) + '%';
}
function pickQuestion() {
  const s = getSubjectState(currentSubject.id);
  let pool = s.unknown.slice();
  if (pool.length === 0) { pool = currentSubject.questions.map((_, i) => i); s.unknown = pool.slice(); s.known = []; }
  if (pool.length > 1 && current !== null) pool = pool.filter(i => i !== current);
  return pool[Math.floor(Math.random() * pool.length)];
}
function renderQuestion() {
  current = pickQuestion(); answerShown = false; history.push(current);
  const s = getSubjectState(currentSubject.id);
  s.unknown = s.unknown.filter(i => i !== current); saveState();
  const item = currentSubject.questions[current];
  $('tag').textContent = `第 ${current + 1} 题 / 共 ${total()} 题`;
  $('question').textContent = item.q;
  $('answer').textContent = item.a;
  $('answer').classList.remove('show');
  $('hint').style.display = 'block';
  $('actions').style.display = 'flex';
  $('actionsAfter').style.display = 'none';
  $('btnPrev').disabled = history.length <= 1;
  updateProgress();
}
function showAnswer() {
  if (answerShown) return; answerShown = true;
  $('answer').classList.add('show'); $('hint').style.display = 'none';
  $('actions').style.display = 'none'; $('actionsAfter').style.display = 'flex';
}
function markKnown() {
  const s = getSubjectState(currentSubject.id);
  if (!s.known.includes(current)) s.known.push(current);
  s.unknown = s.unknown.filter(i => i !== current);
  saveState(); renderQuestion();
}
function markUnknown() {
  const s = getSubjectState(currentSubject.id);
  if (!s.unknown.includes(current)) s.unknown.push(current);
  s.known = s.known.filter(i => i !== current);
  saveState(); renderQuestion();
}

  $('question').textContent = item.q;
  $('answer').textContent = item.a;
  $('answer').classList.remove('show');
  $('hint').style.display = 'block';
  $('actions').style.display = 'flex';
  $('actionsAfter').style.display = 'none';
  $('btnPrev').disabled = history.length <= 1;
}
function resetProgress() {
  if (!confirm('确定要重置当前科目的进度吗？')) return;
  state[currentSubject.id] = { known: [], unknown: [] }; history = []; saveState(); renderQuestion();
}
function switchView(view) {
  $('quizView').style.display = view === 'quiz' ? 'block' : 'none';
  $('wrongView').classList.toggle('show', view === 'wrong');
  $('allView').classList.toggle('show', view === 'all');
  $('navQuiz').classList.toggle('active', view === 'quiz');
  $('navWrong').classList.toggle('active', view === 'wrong');
  $('navAll').classList.toggle('active', view === 'all');
  if (view === 'wrong') renderList('wrong');
  if (view === 'all') renderList('all');
}
function renderList(type) {
  const container = type === 'wrong' ? $('wrongList') : $('allList');
  const s = getSubjectState(currentSubject.id);
  let items = [];
  if (type === 'wrong') items = s.unknown.map(i => ({ index: i, item: currentSubject.questions[i] }));
  else items = currentSubject.questions.map((item, i) => ({ index: i, item }));
  if (items.length === 0) { container.innerHTML = '<div class="empty">暂时没有错题，继续加油！</div>'; return; }
  container.innerHTML = items.map(({ index, item }) => {
    const isKnown = s.known.includes(index);
    const tag = isKnown ? '<span class="li-tag ok">已掌握</span>' : '<span class="li-tag wrong">不熟</span>';
    return `<div class="list-item" data-i="${index}">${tag}<div class="li-q">${item.q}</div><div class="li-a">${item.a}</div></div>`;
  }).join('');
}
function showHome() {
  currentSubject = null; history = [];
  $('homeView').style.display = 'block';
  $('quizView').style.display = 'none';
  $('wrongView').classList.remove('show');
  $('allView').classList.remove('show');
  $('nav').style.display = 'none';
  $('headerTitle').textContent = '考点刷题';
  $('progress').style.width = '0%';
  $('knownCount').textContent = '0';
  $('unknownCount').textContent = '0';
  const list = $('subjectList');
  list.innerHTML = SUBJECTS.map(sub => {
    const s = getSubjectState(sub.id);
    const known = s.known.length;
    return `<div class="subject-card" data-id="${sub.id}"><div><div class="sc-name">${sub.name}</div><div class="sc-info">已掌握 ${known} / ${sub.questions.length}</div></div><div class="sc-arrow">›</div></div>`;
  }).join('');
}
function enterSubject(id) {
  currentSubject = SUBJECTS.find(s => s.id === id); history = [];
  $('homeView').style.display = 'none';
  $('nav').style.display = 'flex';
  $('headerTitle').textContent = currentSubject.name;
  const s = getSubjectState(id);
  if (s.unknown.length === 0 && s.known.length === 0) { s.unknown = currentSubject.questions.map((_, i) => i); saveState(); }
  switchView('quiz'); renderQuestion();
}
document.addEventListener('click', (e) => {
  const card = e.target.closest('.subject-card');
  if (card) { enterSubject(card.dataset.id); return; }
  const li = e.target.closest('.list-item');
  if (li) li.classList.toggle('open');
});
$('header').addEventListener('click', (e) => { if (e.target.id === 'headerTitle' && currentSubject) showHome(); });
$('btnShow').addEventListener('click', showAnswer);
$('btnKnown').addEventListener('click', markKnown);
$('btnUnknown').addEventListener('click', markUnknown);
$('btnPrev').addEventListener('click', goPrev);
$('btnPrev2').addEventListener('click', goPrev);
$('btnReset').addEventListener('click', resetProgress);
$('navQuiz').addEventListener('click', () => switchView('quiz'));
$('navWrong').addEventListener('click', () => switchView('wrong'));
$('navAll').addEventListener('click', () => switchView('all'));
showHome();

/* ============ 宠物 ============ */
(function(){
  const pet = document.getElementById('pet');
  const msg = document.getElementById('petMsg');
  const lines = ["加油，你可以的！","再记一遍就记住啦～","别急，慢慢来","你已经很棒了！","坚持就是胜利！","这道题快拿下了！"];
  let timer;
  let breath = 0, dir = 1;
  setInterval(() => {
    breath += dir * 0.15;
    if (breath > 1) { breath = 1; dir = -1; }
    if (breath < 0) { breath = 0; dir = 1; }
    pet.style.transform = `scale(${1 + breath * 0.03})`;
  }, 50);
  pet.addEventListener('click', () => {
    msg.textContent = lines[Math.floor(Math.random()*lines.length)];
    msg.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(() => msg.style.display = 'none', 1800);
  });
  function react(type) {
    if (type === 'yes') {
      pet.animate([{ transform: 'scale(1)' },{ transform: 'scale(1.15) rotate(-6deg)' },{ transform: 'scale(1) rotate(0)' }], { duration: 400 });
      msg.textContent = "真棒！✅"; msg.style.display = 'block';
      clearTimeout(timer); timer = setTimeout(() => msg.style.display = 'none', 1200);
    } else {
      pet.animate([{ transform: 'rotate(0)' },{ transform: 'rotate(8deg)' },{ transform: 'rotate(-8deg)' },{ transform: 'rotate(0)' }], { duration: 400 });
      msg.textContent = "没关系，再记一遍～"; msg.style.display = 'block';
      clearTimeout(timer); timer = setTimeout(() => msg.style.display = 'none', 1400);
    }
  }
  document.addEventListener('click', (e) => {
    if (e.target.id === 'btnKnown') react('yes');
    if (e.target.id === 'btnUnknown') react('no');
  });
})();
</script>
