<script>
/* ============ 题库：从PDF整理的简答题 ============ */
const QUESTIONS = [
  // ========== 第一章 绪论 ==========
  { q: "发展心理学的研究对象是什么？", a: "发展心理学是研究个体毕生心理发展的特点和规律的心理学分支科学。人的心身在生命进程中表现出量和质两方面的变化，且与年龄联系紧密，既表现出连续性，又表现出发展的阶段性，形成年龄特征。" },
  { q: "发展心理学研究心理发展的年龄特征，包括哪两个主要部分和四个有关方面？", a: "两个主要部分：\n（1）人的认知发展的年龄特征，包括感觉、知觉、记忆、思维、想象等，思维发展的年龄特征研究是其中最主要的一环；\n（2）社会性发展的年龄特征，包括兴趣、动机、情感、价值观、自我意识、能力、性格等，性格发展的年龄特征研究是其中最主要的一环。\n四个有关方面：\n（1）心理发展的社会生活条件和教育条件；\n（2）生理因素的发展；\n（3）动作和活动的发展；\n（4）言语的发展。" },
  { q: "什么是年龄特征？", a: "人的心理和身体的发展在生命进程中表现出连续性和阶段性，因而个体在不同年龄阶段将表现出特定的特征。" },
  { q: "什么是种系心理发展？", a: "种系心理发展是指从动物到人类的心理演变过程，包括动物心理的进化过程和人类心理的进化过程。前者研究的是动物心理学（比较心理学），后者研究的是民族心理学（主要是原始人类心理学）和个体发展心理学。" },
  { q: "促进人类动物祖先演变到人类有哪三个前提条件？", a: "一是直立行走和手的发展；二是使用工具和制造工具；三是因交往需要产生语言。" },
  { q: "人类心理的特点有哪些？", a: "（1）有意识的心理；\n（2）社会性的心理；\n（3）有语言功能的心理。" },
  { q: "什么是个体心理发展？", a: "个体心理发展是指人的个体从受精卵开始到出生、成熟直至衰老的整个生命中，心理发生和发展的过程。" },
  { q: "广义和狭义的发展心理学分别是什么？", a: "广义的发展心理学是研究种系和个体心理发生与发展的科学。狭义的发展心理学是个体发展心理学。" },
  { q: "个体心理发展的过程是什么？", a: "个体心理发展的过程是一个社会化的过程。社会化是个体掌握和积极再现社会经验、社会联系和社会关系的过程。通过社会化，个体获得在社会中进行正常活动所必需的品质、价值观、信念以及社会所赞许的行为方式。" },
  { q: "关于个体心理发展与种系心理发展关系的理论，谁最具代表性？其观点是什么？", a: "霍尔的复演论最具代表性。他认为，应该把个体心理发展看作一系列或多或少复演种系进化历史过程。从种系进化史的角度看，在个体生活的早期所表现出来的遗传特征比以后表现出来的遗传特征古老，因此前者不如后者稳定和强大。" },
  { q: "发展心理学的研究主要涉及哪两个问题？", a: "一个是有关心理发展原理或规律的理论问题；另一个是个体发展各年龄阶段的心理特征问题。" },
  { q: "在人类心理发展的基本原理或规律问题上，各种心理学派别之间的争论可以归纳为哪五点？", a: "（1）人类心理和行为是先天的还是后天的；\n（2）人类对于环境是主动的还是被动的；\n（3）人类心理发展是分阶段的还是连续的，是量变还是量变和质变的统一；\n（4）人类心理发展是普遍的还是特殊的，是多样的还是固定的；\n（5）发展的终点是开放的（发展变化能持续下去）还是有最终目标的。" },
  { q: "发展心理学的理论研究涉及哪三个问题？", a: "（1）关于遗传和环境（含教育）在心理发展上的作用问题；\n（2）关于心理发展的外因与内因问题；\n（3）关于心理不断发展和发展阶段的关系问题。" },
  { q: "关于遗传和环境在心理发展上的作用问题，正确的观点是什么？", a: "先天遗传给心理发展提供了可能性，后天环境将这种可能性变为现实性，两者缺一不可。因此，发展心理学既要研究人类心理的先天要素，也要研究自然环境、社会环境等文化背景与人类心理发展的交互作用。" },
  { q: "关于心理发展的外因与内因问题，正确的观点是什么？", a: "在人类心理发展上，外因和内因都要重视。人类身心发展是主动的，外因要通过内因才起作用。我们既要讲发展，又要强调内外因之间的关系和作用。" },
  { q: "关于心理不断发展和发展阶段的关系问题，正确的观点是什么？", a: "人类的心理既是不断发展的，又是有阶段性的。应将心理发展的连续性和阶段性统一起来，将相对主义的开放和理想化的终点统一起来，才能既科学地解释生命全程的心理持续发展趋势，又探讨不同年龄阶段心理发展的特征。" },
  { q: "发展的连续性和阶段性中，渐进论和阶段论分别是什么？", a: "渐进论认为，心理发展是一个量的积累的过程，是渐进式的、连续变化的过程，如行为主义、社会学习理论、信息加工理论。\n阶段论认为，心理发展是一个非连续的过程，有时候发展是平坦的，有时候又会发生质变，前后两个阶段表现出截然不同的心理特征。如皮亚杰的发生认识论、精神分析理论等，这些理论都是比较强调生物成熟因素对于心理发展具有重要影响。" },
  { q: "心理发展是阶段性和连续性的统一，如何理解？", a: "（1）心理发展速度的变化：心理并不是匀速发展的，有发展的快速期和进展较为缓慢的平稳期。由于发展速度上的这种不平衡，心理进展的连续性就被快速期中断，称为不连续的进程。也就是说，以发展的快速期作为分界点，发展的进程呈现出一个个不同的阶段。\n（2）阶段性与连续性的统一：心理的发展包含着量变和质变的矛盾运动过程。在心理发展的快速期，起主导作用的心理过程或心理特征发生急骤的更替，这就是一种质的飞跃，表现为阶段的划分。每一种心理过程或心理特征都不是在瞬间产生的，在质的飞跃之前有量的逐步积累；在新的心理过程或心理特征形成之后，还要继续发展积累新质，准备新的飞跃；即使在发展的快速期，也不是将前后发展进程截然分割，快速期本身也有一段发展过程，也包含着一定的渐变。所以说，在心理发展的任何时刻都体现着质变和量变的统一关系，都表现为阶段性与连续性的统一。" },
  { q: "科学儿童心理学是如何诞生的？", a: "科学儿童心理学产生于19世纪后半期。德国生理学家和实验心理学家普莱尔是儿童心理学的创始人。普莱尔的《儿童心理》（1882年出版）是第一部科学的、系统的儿童心理学著作。" },
  { q: "儿童心理学的演变经历了哪几个时期？", a: "（1）准备时期（19世纪后期之前）：在近代社会发展、近代自然科学发展、近代教育发展的推动下，经过许多科学家对儿童研究的促进，19世纪后期诞生了科学的儿童心理学。\n（2）形成时期（1882年至第一次世界大战）：在欧洲和美国出现一批心理学家，开始用观察和实验方法来研究儿童心理发展。\n（3）分化和发展时期（两次世界大战之间）：由于整个心理学的发展，儿童心理学研究工作和著作在数量和质量上都有了飞速发展，儿童心理学达到比较成熟的阶段。\n（4）演变和增新时期（第二次世界大战以后）：主要表现在两个方面，一是理论观点的演变，二是在具体研究工作上的演变。" },
  { q: "从儿童发展到个体毕生全程发展的研究，霍尔、荣格、霍林沃思分别有什么贡献？", a: "霍尔将儿童心理学研究的年龄范围扩大到青春期，即儿童心理学研究儿童从出生到成熟各个阶段心理发展的特征。\n荣格是最早对成年期心理发展进行研究的心理学家。\n美国心理学家霍林沃思最先提出要追求人的心理发展全貌，并于1927年出版了《发展心理学概论》一书，这是世界上第一部发展心理学著作。" },
  { q: "发展心理学研究体制的进展体现在哪些方面？", a: "（1）发展心理学研究体制的横向整体化变化：主要涉及发展心理学研究的广度与范围问题。主要体现出两个特点：①新的交叉学科不断出现；②发展心理学的研究范围向人生的两极延伸。\n（2）发展心理学研究体制的纵向整体化变化：是指发展心理学研究重点的变化，主要体现在人们逐渐把着眼点转向发展心理学的应用方面。" },
  { q: "发展心理学研究方法的进展体现在哪些方面？", a: "（1）系统科学原理成为发展心理学研究的方法论基础；\n（2）发展心理学研究思路的生态化取向；\n（3）重视纵向（或聚合交叉）的研究；\n（4）研究方式的跨学科和跨文化特点；\n（5）研究方法的综合化与研究手段的现代化；\n（6）研究结果的数量化特征。" },
  { q: "发展心理学理论的发展体现在哪里？", a: "当代发展心理学不仅日益关注气质和情绪等基本的心理学维度，而且日益关注高级的元认知过程，包括儿童对自己及他人的思维、情感和信念的知识，以及儿童对自身的认知及对社会行为的监控和调节。" },
  { q: "发展心理学的价值是什么？", a: "（1）从人类存在的角度说，“认识自己”是其永恒的追求；\n（2）从人类本能的角度说，“发展自己”是其根本需求；\n（3）大量的现实问题需要发展心理学家去解决。" },
  { q: "发展心理学的不稳定因素有哪些？", a: "（1）过分追求数量化和抽象化的倾向；\n（2）研究的内容过分琐碎，仅凭研究者的个人兴趣；\n（3）缺乏理论的整合，只有零散的材料。" },
  { q: "发展心理学的未来走向有哪些？", a: "1. 发展心理学研究中思维方式的变革：\n（1）实现以“学科”为导向的研究模式向以“问题”为导向的研究模式的转变；\n（2）从以实体为中心的研究思路过渡到以系统为中心的研究思路；\n（3）从对心理现象的唯一性确证过渡到对多样性和不确定性的接受与容忍；\n（4）在考察心理现象的因果关系时，由直接的单一线性联系过渡到多维线性联系或非线性联系。\n2. 发展心理学研究方法的趋势：注重掌握最新的研究方法，如脑—基因—行为等多种手段相结合的研究思路等；现场研究又重新受到重视。\n3. 发展心理学研究内容的趋势：研究选题的应用性倾向越来越明显。\n4. 发展心理学研究中更大范围的整体化趋势。" },

  // ========== 第二章 发展心理学理论 ==========
  { q: "弗洛伊德的人格基本结构包括哪三部分？", a: "本我、自我、超我。" },
  { q: "什么是本我？", a: "本我是人格中的生物成分，遵循快乐原则。它是原始的、本能的，在人格深处最难以接近的部分，其基本机能是寻求能满足机体需求的对象，提供能量和动力。本我及其初级过程思维关注的是获得满足，而不管满足的途径是否实际或是否为环境所允许。在心理发展过程中，年龄越小，本我的作用越大。" },
  { q: "什么是自我？", a: "自我是人格的心理成分，遵循现实原则。它是从本我中分化、发展出来的，在现实的基础上满足个体的需要。自我能支配行动，思考过去的经验，计划未来的行动，弗洛伊德称这种合理的思维为二级过程思维。" },
  { q: "什么是超我？", a: "超我是人格中的社会成分，遵循道德原则。它包括良心和自我理想。良心是超我中的惩罚性、消极性和批判性的部分；自我理想是个体为之奋斗的部分。" },
  { q: "本我、自我与超我的关系是什么？", a: "弗洛伊德把自我与本我的关系比作骑士与马的关系，马提供能量，而骑士则指导马朝着他想去的方向前行。因此自我并不妨碍本我，而是帮助本我最终获得快乐的满足。\n超我和自我都是人格的控制系统。自我控制的是本我盲目的激情，以保持机体免受损害；超我有是非标准，力图使本我延迟得到满足，甚至完全不能获得满足。" },
  { q: "弗洛伊德的心理发展阶段说分为哪五个阶段？", a: "（1）口唇期（0~1岁）；（2）肛门期（1~3岁）；（3）性器期（3~6岁）；（4）潜伏期（6~11岁）；（5）青春期（11岁或13岁开始）。" },
  { q: "埃里克森的心理发展观与弗洛伊德有什么区别？", a: "埃里克森既考虑到生物学的影响，也考虑到文化和社会因素。他认为在人格发展中，逐渐形成的自我在个人与周围环境的交互作用中起着主导和整合的作用。他以人格特征为标准把个体一生划分为8个阶段，同时指出了每一个阶段的主要发展任务。" },
  { q: "埃里克森人格发展八阶段分别是什么？", a: "（1）婴儿期（0~2岁）：发展信任感，克服不信任感；\n（2）儿童早期（2~4岁）：获得自主感，克服羞怯感和疑虑感；\n（3）学前期（4~7岁）：获得主动感，克服内疚感；\n（4）学龄期（7~12岁）：获得勤奋感，克服自卑感；\n（5）青年期（12~18岁）：建立同一感，防止同一感混乱；\n（6）成年早期（18~25岁）：获得亲密感，避免孤独感；\n（7）成年中期（25~50岁）：获得繁殖感，避免停滞感；\n（8）老年期（50岁以后）：获得完善感，避免失望和厌倦感。" },
  { q: "什么是合法延缓期？", a: "埃里克森提出了“合法延缓期”的概念，也称为心理的延缓偿付期，他认为这时的青年自觉没有能力持久地承担义务，感到要做出的决断太多太快，因此在做出最后决断之前要进入一种“暂停”的时期，用以延缓承担的义务，以避免同一性提前完结的内心需要。" },
  { q: "弗洛伊德和埃里克森的观点比较。", a: "（1）弗洛伊德强调本能的作用，将人格发展局限在母亲—儿童—父亲这个狭隘的三角关系中，特别强调早期经验在人格发展中的重要作用；而埃里克森更强调自我的作用，将人格的发展置于更广阔的社会背景之上，重视社会文化对人格发展的影响。\n（2）弗洛伊德对人格阶段的划分只到青春期，埃里克森则将人格阶段扩大至个体的一生。\n（3）埃里克森理论是对弗洛伊德理论的继承、扩展与修订。" },
  { q: "华生的发展心理学理论主要观点是什么？", a: "华生认为，心理的本质是行为，人的各种心理现象是行为的组成因素，并且都可用客观的刺激—反应公式来论证。华生是名副其实的环境决定论者，这种论断主要体现在两个方面：\n1. 否认遗传的作用；\n2. 夸大环境和教育的作用。" },
  { q: "斯金纳的发展心理学理论主要观点是什么？", a: "与华生的刺激—反应心理学的不同点在于，斯金纳区分出应答性行为和操作性行为。\n1. 行为的强化控制原理：塑造、强化与消退、及时强化。\n2. 儿童行为的实际控制：育婴箱、行为矫正、教学机器和教学程序。" },
  { q: "什么是观察学习？", a: "观察学习是指通过观察他人（榜样）所表现的行为及其结果而进行的学习。相较刺激—反应学习来说，观察学习的学习者可以不必直接做出反应，也不需要亲自体验强化，只通过观察他人在一定环境中的行为，并观察他人接受一定的强化就能完成学习。班杜拉认为，观察学习表现为注意过程、保持过程、运动复现过程和动机过程。强化可以是直接强化，也可以是替代强化，还可以是自我强化。" },
  { q: "社会学习在社会化过程中的作用有哪些？", a: "（1）攻击性；（2）性别化；（3）自我强化；（4）亲社会行为。" },
  { q: "维果茨基的文化—历史发展理论是什么？", a: "维果茨基创立了文化—历史发展理论，用以解释人类心理本质上与动物不同的那些高级的心理机能。他认为工具的使用使人适应自然的方式变为物质生产的间接方式，而不再像动物一样用身体的直接方式来适应自然。在人的工具生产中凝结着人类的间接经验，即社会文化知识经验，这就说明制约人类的心理发展规律的不再是生物进化规律，而是社会历史发展规律。" },
  { q: "维果茨基认为发展的实质是什么？", a: "维果茨基认为，心理的发展指的是一个人的心理（从出生到成年）在环境与教育的影响下，在低级的心理机能的基础上，逐渐向高级的心理机能的转化过程。" },
  { q: "什么是高级心理机能？", a: "是在同周围人的交往过程中产生和发展起来的，受人类文化历史所制约。人使用物质工具进行劳动操作，使自己脱离了动物世界。同时使用符号、语言等精神工具进行精神生产，使其心理机能发生质的变化，上升到高级阶段，具有随意性、主动性。" },
  { q: "心理机能由低级向高级发展的标志有哪些？", a: "（1）心理活动的随意机能；\n（2）心理活动的抽象概括机能；\n（3）各心理机能之间的关系不断变化、组合，形成间接的、以符号或词为中介的心理结构；\n（4）心理活动的个性化。" },
  { q: "心理机能由低级向高级发展的原因有哪些？", a: "（1）高级心理机能起源于文化历史的发展，是受社会规律所制约的；\n（2）从个体发展来看，儿童在与成人交往的过程中通过掌握高级的心理机能的工具——语言、符号这一中介环节，使其在低级的心理机能的基础上形成了各种新质的心理机能；\n（3）高级的心理机能是不断内化的结果。" },
  { q: "什么是最近发展区？", a: "维果茨基认为，至少要确定两种发展的水平。第一种是现有发展水平，即儿童独立活动时达到的解决问题的水平；第二种是在有指导的情况下可以达到的解决问题的水平，也就是通过教学所获得的潜力。\n“最近发展区”是指儿童现有发展水平与在成人帮助下可能达到的发展水平之间的差异，即儿童凭借成人的帮助能达到的解决问题的水平与在独立活动中达到的解决问题的水平之间的差异。教学创造着“最近发展区”，表明儿童发展的可能性。" },
  { q: "维果茨基关于教学与发展的关系提出了哪三个重要问题？", a: "（1）最近发展区；（2）教学应当走在发展的前面；（3）学习的最佳期限。" },
  { q: "皮亚杰心理学的理论核心是什么？", a: "皮亚杰心理学的理论核心是“发生认识论”，他认为心理、智力、思维不是起源于先天的成熟或后天的经验，应当是主体的动作，而动作的本质是主体对客体的适应。主体通过动作达到对客体的适应是心理发展的真正原因。" },
  { q: "皮亚杰认为支配心理发展的因素有哪四个？", a: "（1）成熟；（2）物理因素；（3）社会环境；（4）平衡。" },
  { q: "什么是图式？", a: "图式是心理发展结构的核心概念，是指动作的结构或组织，这些动作在相同或类似环境中由于不断重复而得到迁移或概括。图式最先来自遗传，之后在适应环境的过程中不断改变和丰富，也就是说，低级的动作图式经过同化、顺应、平衡而逐步构成新的图式。" },
  { q: "什么是同化？", a: "同化是指把环境因素纳入机体已有的图式或结构之中，以加强和丰富主体的动作。它只是数量上的变化，不能引起图式的改变或创新。" },
  { q: "什么是顺应？", a: "顺应是指改变主体动作以适应客观变化。它是质量上的变化，促进创立新图式或调整原有图式。" },
  { q: "皮亚杰关于发展阶段的观点有哪些？", a: "1. 心理发展过程是连续的，但由于各种发展因素的相互作用，儿童心理发展具有阶段性。\n2. 各阶段都有它独特的结构，标志着一定阶段的年龄特征。由于各种因素如环境、教育等的差异，阶段可以提前或推迟，但先后次序不变。\n3. 各阶段的出现，从低到高有一定的次序，且有一定的交叉。\n4. 每个阶段都是形成下一个阶段的必要条件。前一阶段的结构是构成后一阶段的结构的基础，但前后两个阶段有质的差异。\n5. 在心理发展过程中，两个阶段之间不是截然划分的，而是有一定的交叉。\n6. 心理发展的一个新水平是许多因素融合而成的新结构，各种发展因素由没有系统的联系逐步组成整体。" },
  { q: "皮亚杰心理发展的四个阶段是什么？", a: "（1）感知运动阶段（0~2岁）；（2）前运算阶段（2~7岁）；（3）具体运算阶段（7~12岁）；（4）形式运算阶段（12~15岁）。" },
  { q: "什么是客体永久性？", a: "客体永久性是指儿童理解了物体是作为独立实体而存在的，即使个体不能知觉到物体的存在，它们仍然是存在的。" },
  { q: "格塞尔的成熟势力说的主要观点是什么？", a: "美国心理学家格塞尔利用双生子爬楼梯的实验证明：儿童的学习取决于生理上的成熟，成熟之前的学习与训练难有显著的效果。格塞尔认为，成熟是通过从一种发展水平向另一种发展水平突然转变而实现的，发展的本质是结构性的。儿童在成熟之前，处于学习的准备状态。" },
  { q: "什么是双生子爬楼梯实验？", a: "格塞尔让一对同卵双胞胎在不同时间学爬楼梯，其中一个在出生的第48周开始，另一个在第53周开始，结果在第55周时发现两人的爬楼梯水平一样好。将试验领域推广至其他年龄段和其他事例，得出了相似结论，即任何一项训练或教育内容针对某个特定的受训对象，都存在一个“最佳教育期”。" },
  { q: "布朗芬布伦纳的生态系统理论包括哪几个系统？", a: "（1）微观系统；（2）中间系统；（3）外层系统；（4）宏观系统；（5）时间系统。" },

  // ========== 第三章 发展心理学研究方法 ==========
  { q: "发展心理学研究的功能有哪些？", a: "（1）描述：描述研究对象的特点和发展状况是发展心理学研究最基本的目的。\n（2）解释：对发展心理现象的活动过程与特点的形成原因、发展变化以及相互关系等做出说明。\n（3）预测：根据研究形成的某一科学理论，通过一系列的逻辑推理，对研究对象以后的发展变化和在特定情境中的反应做出推断。\n（4）控制：根据科学理论操纵某些变量的决定条件或创设一定的情境，使研究对象产生理论预期的改变或发展。这是发展心理学研究的最高目标。" },
  { q: "发展心理学研究的特殊性有哪些？", a: "（1）年龄是一个特殊的自变量；\n（2）研究对象的年龄跨度大。" },
  { q: "发展心理学研究的原则有哪些？", a: "（1）客观性原则；（2）特殊性原则；（3）教育性原则；（4）生态化原则。" },
  { q: "什么是横断研究设计？其优缺点是什么？", a: "横断研究设计是在某一特定的时间，同时对不同年龄的被试进行比较的研究设计。\n优点：（1）能够在短时间内发现同一年龄或不同年龄群体发展的相似性和差异性，确定发展的年龄特征；（2）由于能够同时对几个年龄群体进行调查测量，获得的信息量大，经济且费时短。\n缺点：（1）横断研究设计所关注的年龄效应可能会与代替效应（同辈效应）相混淆；（2）由于在横断研究设计中每个人只在某个时间点上接受测查，因而无法获得个体发展趋势或发展变化的数据资料。" },
  { q: "什么是纵向研究设计？其优缺点是什么？", a: "纵向研究设计也叫追踪研究设计，是对同一研究对象在不同的年龄或阶段进行长期反复观测的研究设计。\n优点：能系统地、详尽地了解心理发展的连续过程和从量变到质变的规律。\n缺点：（1）随着研究时间的延续，部分被试可能会因各种原因退出研究，从而造成样本的流失；（2）反复测查可能影响被试的发展，影响被试的情绪，从而影响到某些数据的可靠性；（3）花费大而且耗时，长期追踪要经历时代、社会、环境的变化，这通常会造成变量的增多。" },
  { q: "什么是聚合交叉设计？其优缺点是什么？", a: "聚合交叉设计是将横断研究设计和纵向研究设计融合在一起的研究设计。研究者选择不同年龄的群体为研究对象，在短时期内重复观察这些对象。\n优点：（1）既具有纵向研究设计系统、详尽的特点，又具有横断研究设计能够进行大面积测查的特点；（2）采用了动态和静态相结合的原则，缩短了长期追踪的研究时间。\n缺点：存在理论是否可推广到其他群体的问题。" },
  { q: "什么是微观发生学设计？其优缺点是什么？", a: "微观发生学设计是通过在短时间内重复给被试呈现一个诱发变化的刺激或提供学习的机会，观测个体发生变化的过程的研究设计。\n优点：（1）它关注研究对象一系列行为发生的细节，观测一段时间内的快速变化，使得研究者能够直接观测发展变化的过程；（2）能够在研究的年龄范围内追踪特定行为的个体发展轨迹，有助于确定从一种行为模式到另一种行为模式的转折点；（3）能够观察到个体的内部差异；（4）能够确定变化最有可能发生的条件，有助于探索发展变化的原因。\n缺点：（1）需要对被试进行逐个观察、逐点记录，耗时费力，因此被试的数量有限；（2）它只适用于动机强的被试；（3）某些情况下，研究者仍旧难以分清被试已具备的能力和变化后的能力。" },
  { q: "双生子研究的优缺点是什么？", a: "优点：①同卵双生子具有相同的基因，他们之间的任何差异都可以归结为环境因素的作用；②异卵双生子基因不同，但在环境上有许多相似性，因此也提供了环境控制的可能性。\n缺点：①只孤立地考虑遗传和环境因素的影响，未考虑到两者动态的交互作用；②不能人为制造在不同生长环境下的双生子，因此较难寻找到合适的被试。" },
  { q: "发展心理学研究方法的新趋势有哪些？", a: "（1）多层面和多学科研究相互整合；（2）多变量统计方法大量使用；（3）新的数据收集手段广泛使用；（4）训练研究和教育实验越来越受重视。" },

  // ========== 第四章 胎儿的生理和心理发展 ==========
  { q: "胎儿宫内发育分为哪几个阶段？", a: "斯滕伯格将个体出生前的发育期划分为胚芽期（0~2周）、胚胎期（3~8周）和胎儿期（8~40周）。" },
  { q: "胎儿生理和心理发展的影响因素有哪些？", a: "（1）遗传因素；（2）表观遗传；（3）环境因素；（4）母体因素；（5）父源因素。" },
  { q: "胎儿期心理卫生的种类有哪些？", a: "主要有音乐胎教、抚摸胎教、言语胎教、光照胎教。" },

  // ========== 第五章 婴儿的心理发展 ==========
  { q: "婴儿大脑形态的发展表现在哪些方面？", a: "（1）脑重与头围：婴儿大脑从胚胎时期开始发育，出生时已重达350~400克，是成人脑重的25%；在36个月时，婴儿的脑重接近于成人脑重范围。\n（2）大脑皮质：胎儿6或7个月时，脑的基本结构已经具备。到2岁时，脑及其各部分的相对大小和比例已基本上类似于成人大脑。" },
  { q: "婴儿大脑的功能发展表现在哪些方面？", a: "（1）脑电：5个月胎儿已显示出脑电活动，8个月以后则呈现出与新生儿相同的脑电图。同步节律波α波常作为婴儿脑成熟的标志。\n（2）皮质中枢：婴儿大脑是按照其基因结构的顺序而发展的，遵循着头尾原则和近远原则。\n（3）大脑单侧化：在新生儿阶段就能观察到某种大脑单侧化的倾向，但这种倾向只表明两半球在功能上存在着量的差异，而非质的区别。" },
  { q: "婴儿脑的可塑性和修复性是什么？", a: "（1）婴儿脑的可塑性：在生命早期，大脑的发展并不单纯是成熟程序的展开，而是生物因素和早期经验两者结合的产物。婴儿脑的大小和功能都受其后天经验的影响和制约。\n（2）婴儿脑的修复性：在婴儿早期，大脑具有良好的修复性。一侧半球受损后，另一侧半球可能会产生替代性功能。" },
  { q: "婴儿动作发展的规律有哪些？", a: "（1）整分原则，从整体性动作到分化性动作；\n（2）头尾原则，从上身到下身；\n（3）大小原则，从大肌肉到小肌肉；\n（4）近远原则，从躯干到四肢。" },
  { q: "影响动作发展的因素有哪些？", a: "（1）成熟；（2）学习与教育；（3）营养与健康；（4）环境因素。" },
  { q: "动作发展的重要意义是什么？", a: "（1）个体心理的起源与动作密切相关。\n（2）从个体心理的发展历程上看，个体的心理发展是由外逐步内化的，而动作在心理的内化过程中起着关键性的作用。\n（3）动作作为主体能动性的基本表现形式，在个体早期心理发展中起着重要的建构作用。" },
  { q: "什么是视崖实验？", a: "视崖实验是吉布森和沃克用来证明婴儿深度知觉的一个著名的心理学实验。视崖实验证明6个月的婴儿已经具备了深度知觉，对于“悬崖”感到害怕，而小于6个月的婴儿已经开始注意到深和浅的差别，但并不害怕。" },
  { q: "什么是习惯化与去习惯化？", a: "（1）习惯化：即婴儿对一个重复出现的刺激逐渐熟悉，兴趣下降。\n（2）去习惯化：当刺激发生变化时，婴儿再次对刺激感兴趣，该程序既说明差异辨别的存在，也表明偏好的存在。" },
  { q: "言语发展的理论有哪些？", a: "（1）先天论：乔姆斯基的转换生成说；（2）后天论：强化说、模仿说；（3）认知学说：皮亚杰；（4）相互作用论。" },
  { q: "婴儿言语发展阶段有哪些？", a: "（1）前言语阶段（0~12个月）；（2）言语的发生（大约1岁）；（3）单词句时期（1~1.5岁）；（4）简单句时期（1.5~2岁）；（5）复合句时期（2~3岁）。" },
  { q: "气质的类型有哪些？", a: "（1）传统的四类型说：多血质、胆汁质、黏液质、抑郁质；\n（2）巴甫洛夫的高级神经活动类型说；\n（3）托马斯、切斯的三类型说：容易型、困难型、迟缓型；\n（4）巴斯的活动特性说：情绪性婴儿、活动性婴儿、社交性婴儿、冲动性婴儿；\n（5）卡根的抑制—非抑制说；\n（6）布雷泽尔顿的气质三类型说：活泼型、安静型、一般型。" },
  { q: "什么是拟合优度模型？", a: "托马斯和切斯提出了拟合优度模型来描述气质与环境因素是怎样共同作用，对儿童发展产生良好结果的。他们认为，气质类型形成，关键在于父母的教养方式是否与儿童的气质特点相符合。父母养育和孩子的气质不一致，称为拟合劣化，它会助长孩子的抵抗性和充满冲突的人格。" },
  { q: "自我意识情绪主要包括哪几种？", a: "（1）尴尬；（2）自豪；（3）羞耻；（4）内疚。" },
  { q: "婴儿情绪社会化表现在哪些方面？", a: "（1）社会性微笑；（2）陌生人焦虑；（3）分离焦虑；（4）情绪的社会性参照。" },
  { q: "什么是依恋？其发展阶段有哪些？", a: "依恋是指婴儿与主要抚养者（通常是母亲）之间最初的社会性联结，也是情感社会化的重要标志。心理学家鲍尔比、安斯沃斯等人将其发展过程分为以下四个阶段：\n（1）无差别的社会反应阶段（从出生到3个月）；\n（2）有差别的社会反应阶段（3~6个月）；\n（3）特殊的情感联结阶段（6个月~2岁）；\n（4）目标调整的伙伴关系阶段（2岁以后）。" },
  { q: "婴儿依恋的类型有哪些？", a: "（1）安全型依恋；（2）回避型依恋；（3）反抗型依恋。后来，一些研究者发现了第四种类型的依恋——混乱型。" },
  { q: "影响依恋的因素主要有哪些？", a: "（1）依恋的机会；（2）抚育的质量；（3）婴儿的心理特点；（4）家庭环境和文化环境。" },
  { q: "婴儿早期同伴交往经历哪几个发展阶段？", a: "（1）以客体为中心阶段；（2）简单交往阶段；（3）互补性交往阶段。" },
  { q: "什么是社交指向行为？", a: "指婴儿意在指向同伴的各种具体行为，婴儿在发出这些行动时，总是伴随着对同伴的注意，也总能得到同伴的反应。" },
  { q: "婴儿自我认知发展分为哪几个阶段？", a: "1. 主体我的发展：\n（1）5~8个月：婴儿显示对镜像的兴趣，但未意识到自己的镜像与他人形象的区别；\n（2）9~12个月：婴儿表现出对自己作为活动主体的认识；\n（3）12~15个月：婴儿能区分自己和他人的动作，主体我得到明确的发展。\n2. 客体我的发展：\n（4）15~18个月：婴儿开始将自己作为客体来认识；\n（5）18~24个月：婴儿已具有了用语言标示自我的能力，表明婴儿已经具有明确的客体我。" },

  // ========== 第六章 幼儿的心理发展 ==========
  { q: "早期的游戏理论有哪些？", a: "（1）霍尔的复演说；（2）席勒和斯宾塞的精力过剩说；（3）彪勒夫妇的机能快乐说；（4）格罗斯的生活准备说；（5）拉扎勒斯和帕特里克的笑乐放松说；（6）博伊千介克的成熟说；（7）帕特里克的能量匮乏论；（8）巴特森的游戏元交际理论。" },
  { q: "当代游戏理论有哪些？", a: "（1）精神分析理论；（2）认知动力说；（3）学习理论。" },
  { q: "游戏的特点有哪些？", a: "（1）游戏具有社会性，是人的社会活动的一种初级模拟形式，反映了儿童周围的社会生活。\n（2）游戏是想象与现实生活的一种独特结合，不是社会生活的简单翻版。\n（3）游戏是儿童主动参与的、伴有愉悦体验的活动。" },
  { q: "游戏的作用有哪些？", a: "（1）在游戏过程中，儿童既可以体验到开放、自由、宽松的心理环境，又可以发展适应生活和解决问题的能力。\n（2）游戏可以使儿童运动器官得到很好的发展。\n（3）游戏使得儿童认知和社会交往能力能够更快、更好地发展。\n（4）游戏可帮助儿童学会表达和控制情绪，学会处理焦虑和内心冲突。\n（5）游戏对培养良好的个性品质同样有重要作用。\n（6）游戏是幼儿教育的重要手段。" },
  { q: "游戏的种类有哪些？", a: "按照游戏的目的性分类，幼儿的游戏主要有创造性游戏、教学游戏和活动性游戏。\n此外，皮亚杰根据儿童认知发展阶段把游戏分为练习游戏、象征性游戏及有规则的游戏。\n帕滕则按照儿童社会性发展把游戏分为六种：无所用心的行为、旁观者行为、单独游戏、平行游戏、联合游戏和合作游戏。" },
  { q: "幼儿词汇的发展表现有哪些？", a: "（1）词汇数量的增加；（2）词汇内容的丰富和深化；（3）词类范围的扩大；（4）积极词汇的增长。" },
  { q: "幼儿语法的掌握趋势是什么？", a: "（1）从简单句（单句）到复合句（复句）；（2）从陈述句到多种形式的句子；（3）从无修饰句到修饰句；（4）从不完整句到完整句。" },
  { q: "幼儿记忆的发展特点有哪些？", a: "（1）记忆容量的增加；（2）无意识记和有意识记的发展；（3）形象记忆和语词记忆的发展；（4）自传式记忆的发展；（5）记忆策略的形成；（6）元记忆的形成。" },
  { q: "幼儿思维的特点有哪些？", a: "（1）思维的具体形象性；（2）思维的抽象逻辑性开始萌芽；（3）言语在幼儿思维发展中的作用日益增强。" },
  { q: "皮亚杰关于幼儿思维的研究有哪些？", a: "（1）三座山测验：证明前运算思维的基本特征是自我中心。\n（2）守恒：前运算阶段的儿童的思维只能集中于问题的一个维度，具有中心化的特点。\n（3）类包含：前运算阶段的儿童缺乏这种推理能力，不能同时想到一个子类和整个一类。" },
  { q: "什么是心理理论？", a: "心理理论是指个体凭借一定的知识系统对自身或他人的心理状态进行推测，并据此对行为做出因果性解释与预测的能力。儿童拥有心理理论的主要标志是通过“错误信念”任务的测试。" },
  { q: "错误信念任务包括哪两种经典范式？", a: "（1）意外地点任务（意外转移任务）；（2）意外内容任务（表征变化任务）。" },
  { q: "心理理论发展的理论解释有哪些？", a: "（1）理论论；（2）模拟论；（3）模块论。" },
  { q: "幼儿自我评价的发展特点有哪些？", a: "（1）从轻信成人的评价到自己独立评价；（2）从对外部行为的评价到对内心品质的评价；（3）从比较笼统的评价到比较细致的评价；（4）从带有主观情绪性的评价到初步客观的评价；（5）开始以道德行为的准则进行评价。" },
  { q: "皮亚杰的儿童道德认知发展分为哪三个阶段？", a: "（1）前道德阶段（0~4、5岁）；（2）他律道德阶段（5~10岁）；（3）自律道德阶段（10岁以后）。" },
  { q: "科尔伯格的儿童道德认知发展分为哪三个水平、六个阶段？", a: "（1）前习俗水平（4~10岁）：①服从与惩罚定向；②天真的利己主义。\n（2）习俗水平（10~13岁）：③“好孩子”的定向；④维护权威和秩序的道德观。\n（3）后习俗水平（13岁以后）：⑤社会契约定向；⑥普遍的伦理原则。" },
  { q: "什么是攻击行为？", a: "攻击行为又称侵犯行为，是指任何有目的地侮辱或伤害他人（或其他生物）而受害者试图回避的行为。攻击可以是身体的攻击、言语的攻击，也可以是对别人权利的侵犯。" },
  { q: "什么是工具性攻击和敌意性攻击？", a: "工具性攻击：指向渴望得到的东西（如财物或权利），以伤害他人作为达到非攻击性目的的手段。\n敌意性攻击：以人为定向，旨在伤害他人（身体、感情和自尊等），如报复、支配等。" },
  { q: "攻击行为的理论有哪些？", a: "（1）精神分析理论；（2）生态学理论；（3）新行为主义；（4）社会学习理论；（5）社会信息加工理论。" },
  { q: "攻击行为的控制方法有哪些？", a: "（1）消除对攻击行为的奖赏和关注；（2）榜样和认知训练策略；（3）移情训练；（4）创造减少冲突的环境。" },
  { q: "什么是亲社会行为？", a: "亲社会行为又称向社会行为、利他行为，是指任何符合社会期望而对他人、群体或社会有益的行为及趋向，如帮助、捐助、分享、赞扬等。" },
  { q: "亲社会行为的理论有哪些？", a: "（1）社会生物学观点；（2）精神分析观点；（3）社会学习理论；（4）认知发展理论；（5）社会规范理论。" },
  { q: "亲社会行为的训练方法有哪些？", a: "（1）角色扮演训练；（2）行为强化训练；（3）自我概念训练；（4）榜样示范；（5）创造良好的社会氛围。" },
  { q: "性别角色的社会化过程包括哪些？", a: "（1）理解性别（性别认同）；（2）获得标准（性别角色标准）；（3）取得认同（性别角色认同）；（4）形成偏爱（性别角色偏爱）。" },
  { q: "什么是心理两性化？", a: "柏姆认为，男子气和女子气属于两个分离的独立维度，人可以具有两性化特质，糅合男女两性的优秀品质，不必只接受某一性别的特质而拒绝另一性别的特质。" },
  { q: "同伴关系的作用有哪些？", a: "（1）同伴可以满足儿童归属和爱的需要以及尊重的需要；（2）同伴交往为儿童提供了学习的机会；（3）同伴是儿童特殊的信息渠道和参照框架；（4）同伴是儿童得到情感支持的一个来源。" },
  { q: "同伴关系的发展特点是什么？", a: "在婴儿期，同伴关系只是最松散意义上的存在，儿童的社会交往非常有限。进入幼儿园，儿童与同伴的接触次数增加，他们不再把成人作为唯一的依靠对象。3~4岁儿童，依恋同伴的强度和与同伴建立起友谊的数量有显著增长。儿童早期的友谊一般是脆弱、易变的。" },

  // ========== 第七章 小学儿童的心理发展 ==========
  { q: "学习活动对心理发展的意义和作用是什么？", a: "（1）学校学习是在教师的指导下有目的、有系统地掌握知识、技能和行为规范的活动，是一种社会义务。\n（2）儿童通过教学活动掌握读、写、算等基本的知识和技能，其心理活动的有意性和自觉性都明显地发展起来，其思维活动也逐渐从具体形象思维过渡到抽象逻辑思维。\n（3）在共同的学习活动中，儿童相互交流、相互帮助，不仅有助于儿童发展社会交往的技能，提高社会认知的水平，培养合作、互助的集体精神，还有助于儿童掌握各种基本的社会行为规范，形成并发展各种良好的品德。" },
  { q: "小学儿童思维发展的基本特点是什么？", a: "（1）逐步过渡到以抽象逻辑思维为主要形式，但仍带有很大的具体性；（2）由具体形象思维到抽象逻辑思维的过渡存在明显的关键期，大约在四年级（10~11岁）；（3）思维结构趋于完整，但有待完善；（4）思维发展过程的不平衡性。" },
  { q: "什么是角色采择？其发展阶段有哪些？", a: "角色采择能力也称观点采择能力，是指儿童采取他人的观点来理解他人的思想和情感的一种认知技能。塞尔曼运用两难故事法研究表明，观点采择能力的发展存在以下五个阶段：\n（1）阶段0：自我中心的或无差别的观点（3~6岁）；\n（2）阶段1：社会—信息角色采择（6~8岁）；\n（3）阶段2：自我反省角色采择（8~10岁）；\n（4）阶段3：相互角色采择（10~12岁）；\n（5）阶段4：社会和习俗系统的角色替换（12~15岁）。" },
  { q: "小学儿童亲子关系的变化表现在哪些方面？", a: "（1）父母与儿童的交往时间减少；（2）父母在儿童教养方面所处理的日常问题的类型发生了变化；（3）儿童与父母的冲突数量减少了；（4）在纪律约束技术和控制过程方面，父母通常认为学龄儿童比学前儿童好控制一些；（5）父母对儿童的控制力量也在变化。" },
  { q: "小学儿童同伴交往的特点是什么？", a: "（1）儿童与同伴交往的时间更多，交往形式更复杂；（2）儿童在同伴交往中传递信息的技能增强；（3）儿童更善于利用各种信息来决定自己对他人所采取的行动；（4）儿童更善于协调自己与其他儿童的活动；（5）儿童开始形成同伴团体。" },
  { q: "塞尔曼提出的儿童友谊发展阶段有哪些？", a: "（1）第一阶段（3~7岁）；（2）第二阶段（4~9岁）：单向帮助阶段；（3）第三阶段（6~12岁）：双向帮助，但不能共患难的合作阶段；（4）第四阶段（9~15岁）：亲密的共享阶段；（5）第五阶段（12岁开始）：友谊发展的最高阶段。" },
  { q: "小学儿童品德发展的基本特点是什么？", a: "（1）小学儿童逐步形成自觉地运用道德认知来评价和调节道德行为的能力；（2）小学儿童的道德言行从比较协调到逐步分化；（3）自觉纪律的形成和发展在小学儿童品德发展中占有相当显著的地位。" },
  { q: "小学儿童道德动机发展的特点是什么？", a: "（1）由服从向独立发展；（2）由具体、近景向抽象、远景发展；（3）逐步产生道德动机的斗争，但激烈的冲突较少。" },

  // ========== 第八章 青少年的心理发展 ==========
  { q: "青少年身体发展的一般特点有哪些？", a: "青春期是个体生长发育的第二个高峰期。在这一时期，青少年的身体和生理机能发生了急剧的变化，主要表现在身体外形的改变、体内机能的增强及性的发育和成熟三个方面。" },
  { q: "青少年心理发展的一般特点是什么？", a: "1. 生理变化对心理活动的冲击；\n2. 心理上成人感与幼稚感的矛盾，具体表现为：\n（1）反抗性与依赖性；（2）闭锁性与开放性；（3）勇敢与怯懦；（4）高傲与自卑；（5）否定童年与眷恋童年。" },

  { q: "成年中期的智力发展模式是什么？", a: "（1）晶体智力继续上升，流体智力缓慢下降；（2）机械型智力在成年早期达到顶峰后出现下降，实用型智力则不断增长。" },
  { q: "什么是双重过程模型？", a: "由巴尔特斯等人提出，认为智力主要由两种成分构成，即认知机械成分和认知实用成分，这两种成分在人的一生中呈现出非常不同的变化轨迹。认知机械成分可看作流体智力概念的引申，毕生发展轨迹呈先上升后下降的倒U字形；认知实用成分可看作晶体智力概念的引申，其毕生发展将随着知识经验的愈益丰富而不断增长。" },
  { q: "成年中期个性特点的稳定性与变化是什么？", a: "个性特点的稳定性，包括两层基本含义：个性结构的成分不变、各成分的平均水平不变。\n个性特点的变化：中年人的宜人性和谨慎性比年轻人更高；中年人的外向性、神经质和开放性比年轻人更低。" },
  { q: "什么是家庭生命周期？", a: "家庭生命周期，通常指的是从男女双方结为夫妻组成家庭开始，至夫妻双方死亡导致家庭解体而告终的家庭发展过程。格里克将家庭生命周期分成八个阶段，即初始期、离家期、婚前期、生育前期、家有儿童期、家有青少年期、子女离家期和家庭后期。" },
  { q: "休珀的职业生涯发展理论分为哪五个阶段？", a: "（1）成长阶段（0~14岁）；（2）探索阶段（15~24岁）；（3）建立阶段（25~44岁）；（4）维持阶段（45~59岁）；（5）衰退与脱离阶段（60岁以上）。" },
  { q: "成年中期职业发展的具体问题有哪些？", a: "（1）职业成熟度；（2）工作满意感；（3）职业倦怠。" },

  // ========== 第十一章 成年晚期个体的心理发展 ==========
  { q: "什么是老龄和老化？", a: "老龄：指进入老年期的年龄。我国将60岁作为统一划分老年人口的界限。\n老化：指个体在成熟期后的生命过程中所表现出来的一系列形态学以及生理、心理功能方面的退行性变化。" },
  { q: "传统发展观的主要理论依据是什么？", a: "（1）将人主要看作是一个生物有机体，其心理活动将随着机体的发展而发展，随着机体的衰老而衰退；（2）心理的发展是单向前进的、不可逆转的；（3）年龄（时间）是心理发展或衰退的根据，并且是普遍适用的。" },
  { q: "毕生发展观的基本观点有哪些？", a: "（1）个体的发展是贯穿一生的；（2）发展的形式具有多样性；（3）任何一种心理或行为的发展过程都是复杂的；（4）个体的心理发展有很大的可塑性；（5）心理发展是由多重影响系统共同决定的。" },
  { q: "成年晚期认知活动的显著特点是什么？", a: "（1）退行性变化；（2）持续性；（3）差异性。" },

  { q: "成年晚期情绪情感的一般特点是什么？", a: "（1）比较容易产生消极的情绪情感；（2）情感体验深刻而持久；（3）情绪表达方式较为含蓄；（4）各种“丧失”是情绪体验的最重要的激发事件；（5）我国老年人生活满意度较高。" },
  { q: "成年期的社会性发展任务是什么？", a: "成年期是关注关系和成就的时期。亲密性可以在友谊和爱情中发生；在一生中，个体要在家庭和朋友的社会支持中保持平衡。成年期的另一个任务是再生：一种为他人幸福而做的努力。" },
  { q: "认知老化机制的代表性观点有哪些？", a: "（1）加工速度理论；（2）工作记忆理论；（3）抑制功能理论；（4）感觉功能理论；（5）执行功能减退假说。" },
  { q: "什么是SOC模型？", a: "巴尔特斯等人提出的SOC模型是成功解决成年晚期个体适应老化的理论模型。根据该理论模型，适应要整合以下三种过程：\n（1）选择：确认最有价值或最重要的机遇或活动领域；\n（2）最优化：有效地分配和提炼资源；\n（3）补偿：在资源减少的情况下，确定一些可以弥补损失和将其对功能的消极影响减少到最小的策略。" },
  { q: "临终心理的阶段有哪些？", a: "（1）否认；（2）愤怒；（3）交易；（4）抑郁；（5）承受。" },
];

/* ============ 逻辑 ============ */
const STORAGE_KEY = 'dev_psych_quiz_v1';
let state = loadState();
let current = null;
let answerShown = false;

const $ = id => document.getElementById(id);

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.known) && Array.isArray(s.unknown)) return s;
    }
  } catch (e) {}
  return { known: [], unknown: [] };
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function total() { return QUESTIONS.length; }

function updateProgress() {
  const known = state.known.length;
  $('knownCount').textContent = known;
  $('unknownCount').textContent = total() - known;
  $('progress').style.width = (known / total() * 100) + '%';
}

function pickQuestion() {
  let pool = state.unknown.slice();
  if (pool.length === 0) {
    pool = QUESTIONS.map((_, i) => i);
    state.unknown = pool.slice();
    state.known = [];
  }
  if (pool.length > 1 && current !== null) pool = pool.filter(i => i !== current);
  return pool[Math.floor(Math.random() * pool.length)];
}

function renderQuestion() {
  current = pickQuestion();
  answerShown = false;
  state.unknown = state.unknown.filter(i => i !== current);
  saveState();

  const item = QUESTIONS[current];
  $('tag').textContent = `第 ${current + 1} 题 / 共 ${total()} 题`;
  $('question').textContent = item.q;
  $('answer').textContent = item.a;
  $('answer').classList.remove('show');
  $('hint').style.display = 'block';
  $('actions').style.display = 'flex';
  $('actionsAfter').style.display = 'none';
  updateProgress();
}

function showAnswer() {
  if (answerShown) return;
  answerShown = true;
  $('answer').classList.add('show');
  $('hint').style.display = 'none';
  $('actions').style.display = 'none';
  $('actionsAfter').style.display = 'flex';
}

function markKnown() {
  if (!state.known.includes(current)) state.known.push(current);
  state.unknown = state.unknown.filter(i => i !== current);
  saveState();
  renderQuestion();
}

function markUnknown() {
  if (!state.unknown.includes(current)) state.unknown.push(current);
  state.known = state.known.filter(i => i !== current);
  saveState();
  renderQuestion();
}

function resetProgress() {
  if (!confirm('确定要重置所有进度吗？')) return;
  state = { known: [], unknown: [] };
  saveState();
  renderQuestion();
}

$('btnShow').addEventListener('click', showAnswer);
$('btnKnown').addEventListener('click', markKnown);
$('btnUnknown').addEventListener('click', markUnknown);
$('btnReset').addEventListener('click', resetProgress);

if (state.unknown.length === 0 && state.known.length === 0) {
  state.unknown = QUESTIONS.map((_, i) => i);
  saveState();
}
renderQuestion();
</script>
