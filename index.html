<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>考点刷题</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 40%, #fdf2f8 100%);
    background-attachment: fixed;
    color: #1f2937;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    color: #fff;
    padding: 18px 16px 14px; text-align: center;
    font-size: 17px; font-weight: 700;
    letter-spacing: .5px;
    box-shadow: 0 4px 20px rgba(99,102,241,.35);
    position: sticky; top: 0; z-index: 10;
  }
  .progress-bar {
    height: 6px; background: rgba(255,255,255,.25);
    margin-top: 12px; border-radius: 3px; overflow: hidden;
  }
  .progress-bar span {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #a5b4fc, #f0abfc);
    border-radius: 3px;
    transition: width .4s ease;
  }
  nav {
    display: flex; gap: 6px;
    padding: 10px 16px 0;
    position: sticky; top: 88px; z-index: 9;
  }
  nav button {
    flex: 1; border: none;
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(8px);
    padding: 10px 4px; font-size: 13px; font-weight: 600;
    color: #6b7280; font-family: inherit;
    border-radius: 999px;
    transition: all .2s ease;
    cursor: pointer;
  }
  nav button.active {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    box-shadow: 0 4px 12px rgba(99,102,241,.35);
  }
  main { flex: 1; padding: 16px; display: flex; flex-direction: column; }
  .card {
    background: #fff; border-radius: 20px;
    box-shadow: 0 8px 30px rgba(99,102,241,.10), 0 2px 8px rgba(0,0,0,.04);
    padding: 26px 20px; margin-bottom: 14px;
    flex: 1; display: flex; flex-direction: column;
    border: 1px solid rgba(255,255,255,.8);
  }
  .tag {
    display: inline-block; font-size: 12px; font-weight: 600;
    color: #6366f1; background: linear-gradient(135deg,#eef2ff,#f5f3ff);
    padding: 4px 12px; border-radius: 999px;
    margin-bottom: 16px; align-self: flex-start;
  }
  .question {
    font-size: 19px; font-weight: 700;
    line-height: 1.6; color: #111827;
  }
  .answer {
    margin-top: 20px; padding-top: 18px;
    border-top: 1px dashed #e5e7eb;
    font-size: 16px; line-height: 1.8; color: #374151;
    white-space: pre-wrap; display: none;
  }
  .answer.show { display: block; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .hint {
    margin-top: 16px; font-size: 14px; color: #9ca3af;
    text-align: center;
  }
  .actions { display: flex; gap: 10px; }
  button {
    border: none; border-radius: 14px;
    padding: 15px 8px; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: transform .12s, box-shadow .2s;
    font-family: inherit;
  }
  button:active { transform: scale(.97); }
  .btn-show {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff; flex: 1;
    box-shadow: 0 6px 16px rgba(99,102,241,.35);
  }
  .btn-known {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff; flex: 1;
    box-shadow: 0 6px 16px rgba(16,185,129,.30);
  }
  .btn-unknown {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #fff; flex: 1;
    box-shadow: 0 6px 16px rgba(245,158,11,.30);
  }
  .btn-prev { background: #e5e7eb; color: #374151; flex: 0 0 90px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  footer {
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(229,231,235,.8);
    padding: 12px 16px; font-size: 13px; color: #6b7280;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; bottom: 0;
  }
  .stat b { color: #4f46e5; font-weight: 700; }
  .stat .ok { color: #10b981; }
  .stat .no { color: #f59e0b; }
  .reset {
    color: #ef4444; font-size: 13px; background: none;
    border: none; padding: 4px; flex: none; width: auto;
    font-weight: 600;
  }
  .list-view { display: none; }
  .list-view.show { display: block; }
  .list-item {
    background: #fff; border-radius: 14px;
    padding: 16px 18px; margin-bottom: 10px;
    box-shadow: 0 4px 14px rgba(99,102,241,.08);
    cursor: pointer;
    transition: transform .15s ease;
    border: 1px solid rgba(255,255,255,.8);
  }
  .list-item:active { transform: scale(.99); }
  .list-item .li-q {
    font-size: 15px; font-weight: 700; color: #111827;
    line-height: 1.55;
  }
  .list-item .li-a {
    margin-top: 10px; font-size: 14px; color: #6b7280;
    line-height: 1.7; white-space: pre-wrap;
    display: none;
  }
  .list-item.open .li-a { display: block; }
  .list-item .li-tag {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 999px;
    margin-bottom: 8px;
  }
  .list-item .li-tag.wrong { background: #fef3c7; color: #b45309; }
  .list-item .li-tag.ok { background: #d1fae5; color: #047857; }
  .empty {
    text-align: center; color: #9ca3af;
    padding: 50px 20px; font-size: 15px;
  }
  #pet {
    position: fixed; right: 16px; bottom: 70px; z-index: 999;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    filter: drop-shadow(0 6px 12px rgba(99,102,241,.35));
    transition: transform .2s;
  }
  .home {
    padding: 20px 16px;
  }
  .home h2 {
    font-size: 18px; color: #4f46e5; margin: 0 0 16px;
    text-align: center;
  }
  .subject-card {
    background: #fff; border-radius: 18px;
    padding: 22px 20px; margin-bottom: 14px;
    box-shadow: 0 8px 24px rgba(99,102,241,.10);
    cursor: pointer;
    transition: transform .15s ease;
    display: flex; justify-content: space-between; align-items: center;
    border: 1px solid rgba(255,255,255,.8);
  }
  .subject-card:active { transform: scale(.98); }
  .subject-card .sc-name {
    font-size: 17px; font-weight: 700; color: #111827;
  }
  .subject-card .sc-info {
    font-size: 13px; color: #9ca3af; margin-top: 4px;
  }
  .subject-card .sc-arrow {
    font-size: 22px; color: #a5b4fc;
  }
  .back-btn {
    background: none; border: none; color: #fff;
    font-size: 15px; font-weight: 600; padding: 4px 0;
    cursor: pointer;
  }
  .back-btn:active { opacity: .7; }
</style>
</head>
<body>

<header id="header">
  <span id="headerTitle">考点刷题</span>
  <div class="progress-bar"><span id="progress"></span></div>
</header>

<nav id="nav" style="display:none;">
  <button id="navQuiz" class="active">刷题</button>
  <button id="navWrong">错题集</button>
  <button id="navAll">全部题目</button>
</nav>

<main>
  <!-- 首页：选科目 -->
  <div id="homeView" class="home">
    <h2>选择科目</h2>
    <div id="subjectList"></div>
  </div>

  <!-- 刷题页 -->
  <div id="quizView" style="display:none;">
    <div class="card" id="card">
      <span class="tag" id="tag">第 1 题</span>
      <div class="question" id="question">加载中...</div>
      <div class="answer" id="answer"></div>
      <div class="hint" id="hint">先自己回想一下，再点「显示答案」</div>
    </div>

    <div class="actions" id="actions">
      <button class="btn-prev" id="btnPrev">← 上一个</button>
      <button class="btn-show" id="btnShow">显示答案</button>
    </div>

    <div class="actions" id="actionsAfter" style="display:none; margin-top:10px;">
      <button class="btn-prev" id="btnPrev2">← 上一个</button>
      <button class="btn-unknown" id="btnUnknown">不熟，再来</button>
      <button class="btn-known" id="btnKnown">会了，下一题</button>
    </div>
  </div>

  <div id="wrongView" class="list-view">
    <div id="wrongList"></div>
  </div>

  <div id="allView" class="list-view">
    <div id="allList"></div>
  </div>
</main>

<footer>
  <div class="stat">
    已掌握 <b class="ok" id="knownCount">0</b> · 待复习 <b class="no" id="unknownCount">0</b>
  </div>
  <button class="reset" id="btnReset">重置进度</button>
</footer>

<div id="pet">
  <svg width="72" height="72" viewBox="0 0 100 100">
    <ellipse cx="50" cy="78" rx="26" ry="8" fill="rgba(99,102,241,.15)"/>
    <ellipse cx="50" cy="52" rx="28" ry="30" fill="#a5b4fc"/>
    <ellipse cx="50" cy="58" rx="20" ry="20" fill="#e0e7ff"/>
    <circle cx="40" cy="46" r="4.5" fill="#1f2937"/>
    <circle cx="60" cy="46" r="4.5" fill="#1f2937"/>
    <circle cx="41.5" cy="44.5" r="1.6" fill="#fff"/>
    <circle cx="61.5" cy="44.5" r="1.6" fill="#fff"/>
    <ellipse cx="50" cy="58" rx="3" ry="2" fill="#f472b6"/>
    <path d="M44 64 Q50 69 56 64" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="30" cy="56" r="3" fill="#fbcfe8" opacity=".8"/>
    <circle cx="70" cy="56" r="3" fill="#fbcfe8" opacity=".8"/>
  </svg>
  <div id="petMsg" style="position:absolute;right:80px;bottom:20px;background:#fff;color:#4f46e5;font-size:13px;font-weight:600;padding:8px 12px;border-radius:12px;box-shadow:0 4px 14px rgba(99,102,241,.25);white-space:nowrap;display:none;"></div>
</div>

<script>
/* ============ 题库 ============ */
const SUBJECTS = [
  {
    id: 'dev',
    name: '发展心理学',
  questions: [
      { q: "发展心理学的研究对象是什么？", a: "发展心理学是研究个体毕生心理发展的特点和规律的心理学分支科学。人的心身在生命进程中表现出量和质两方面的变化，且与年龄联系紧密，既表现出连续性，又表现出发展的阶段性，形成年龄特征。" },
      { q: "发展心理学研究心理发展的年龄特征，包括哪两个主要部分和四个有关方面？", a: "两个主要部分：\n（1）人的认知发展的年龄特征，包括感觉、知觉、记忆、思维、想象等，思维发展的年龄特征研究是其中最主要的一环；\n（2）社会性发展的年龄特征，包括兴趣、动机、情感、价值观、自我意识、能力、性格等，性格发展的年龄特征研究是其中最主要的一环。\n四个有关方面：\n（1）心理发展的社会生活条件和教育条件；\n（2）生理因素的发展；\n（3）动作和活动的发展；\n（4）言语的发展。" },
      { q: "什么是年龄特征？", a: "人的心理和身体的发展在生命进程中表现出连续性和阶段性，因而个体在不同年龄阶段将表现出特定的特征。" },
      { q: "什么是种系心理发展？", a: "种系心理发展是指从动物到人类的心理演变过程，包括动物心理的进化过程和人类心理的进化过程。前者研究的是动物心理学（比较心理学），后者研究的是民族心理学（主要是原始人类心理学）和个体发展心理学。" },
      { q: "促进人类动物祖先演变到人类有哪三个前提条件？", a: "一是直立行走和手的发展；二是使用工具和制造工具；三是因交往需要产生语言。" },
      { q: "人类心理的特点有哪些？", a: "（1）有意识的心理；\n（2）社会性的心理；\n（3）有语言功能的心理。" },
      { q: "什么是个体心理发展？", a: "个体心理发展是指人的个体从受精卵开始到出生、成熟直至衰老的整个生命中，心理发生和发展的过程。" },
      { q: "广义和狭义的发展心理学分别是什么？", a: "广义的发展心理学是研究种系和个体心理发生与发展的科学。狭义的发展心理学是个体发展心理学。" },
      { q: "个体心理发展的过程是什么？", a: "个体心理发展的过程是一个社会化的过程。社会化是个体掌握和积极再现社会经验、社会联系和社会关系的过程。通过社会化，个体获得在社会中进行正常活动所必需的品质、价值观、信念以及社会所赞许的行为方式。" },
      { q: "关于个体心理发展与种系心理发展关系的理论，谁最具代表性？其观点是什么？", a: "霍尔的复演论最具代表性。他认为，应该把个体心理发展看作一系列或多或少复演种系进化历史过程。从种系进化史的角度看，在个体生活的早期所表现出来的遗传特征比以后表现出来的遗传特征古老，因此前者不如后者稳定和强大。" },
      { q: "发展心理学的研究主要涉及哪两个问题？", a: "一个是有关心理发展原理或规律的理论问题；另一个是个体发展各年龄阶段的心理特征问题。" },
      { q: "在人类心理发展的基本原理或规律问题上，各种心理学派别之间的争论可以归纳为哪五点？", a: "（1）人类心理和行为是先天的还是后天的；\n（2）人类对于环境是主动的还是被动的；\n（3）人类心理发展是分阶段的还是连续的，是量变还是量变和质变的统一；\n（4）人类心理发展是普遍的还是特殊的，是多样的还是固定的；\n（5）发展的终点是开放的（发展变化能持续下去）还是有最终目标的。" },
      { q: "发展心理学的理论研究涉及哪三个问题？", a: "（1）关于遗传和环境（含教育）在心理发展上的作用问题；\n（2）关于心理发展的外因与内因问题；\n（3）关于心理不断发展和发展阶段的关系问题。" },
      { q: "关于遗传和环境在心理发展上的作用问题，正确的观点是什么？", a: "先天遗传给心理发展提供了可能性，后天环境将这种可能性变为现实性，两者缺一不可。因此，发展心理学既要研究人类心理的先天要素，也要研究自然环境、社会环境等文化背景与人类心理发展的交互作用。" },
      { q: "关于心理发展的外因与内因问题，正确的观点是什么？", a: "在人类心理发展上，外因和内因都要重视。人类身心发展是主动的，外因要通过内因才起作用。我们既要讲发展，又要强调内外因之间的关系和作用。" },
      { q: "关于心理不断发展和发展阶段的关系问题，正确的观点是什么？", a: "人类的心理既是不断发展的，又是有阶段性的。应将心理发展的连续性和阶段性统一起来，将相对主义的开放和理想化的终点统一起来，才能既科学地解释生命全程的心理持续发展趋势，又探讨不同年龄阶段心理发展的特征。" },
      { q: "发展的连续性和阶段性中，渐进论和阶段论分别是什么？", a: "渐进论认为，心理发展是一个量的积累的过程，是渐进式的、连续变化的过程，如行为主义、社会学习理论、信息加工理论。\n阶段论认为，心理发展是一个非连续的过程，有时候发展是平坦的，有时候又会发生质变，前后两个阶段表现出截然不同的心理特征。如皮亚杰的发生认识论、精神分析理论等，这些理论都是比较强调生物成熟因素对于心理发展具有重要影响。" },
      { q: "心理发展是阶段性和连续性的统一，如何理解？", a: "（1）心理发展速度的变化：心理并不是匀速发展的，有发展的快速期和进展较为缓慢的平稳期。由于发展速度上的这种不平衡，心理进展的连续性就被快速期中断，称为不连续的进程。也就是说，以发展的快速期作为分界点，发展的进程呈现出一个个不同的阶段。\n（2）阶段性与连续性的统一：心理的发展包含着量变和质变的矛盾运动过程。在心理发展的快速期，起主导作用的心理过程或心理特征发生急骤的更替，这就是一种质的飞跃，表现为阶段的划分。每一种心理过程或心理特征都不是在瞬间产生的，在质的飞跃之前有量的逐步积累；在新的心理过程或心理特征形成之后，还要继续发展积累新质，准备新的飞跃；即使在发展的快速期，也不是将前后发展进程截然分割，快速期本身也有一段发展过程，也包含着一定的渐变。所以说，在心理发展的任何时刻都体现着质变和量变的统一关系，都表现为阶段性与连续性的统一。" },
      { q: "科学儿童心理学是如何诞生的？", a: "科学儿童心理学产生于19世纪后半期。德国生理学家和实验心理学家普莱尔是儿童心理学的创始人。普莱尔的《儿童心理》（1882年出版）是第一部科学的、系统的儿童心理学著作。" },
      { q: "儿童心理学的演变经历了哪几个时期？", a: "（1）准备时期（19世纪后期之前）：在近代社会发展、近代自然科学发展、近代教育发展的推动下，经过许多科学家对儿童研究的促进，19世纪后期诞生了科学的儿童心理学。\n（2）形成时期（1882年至第一次世界大战）：在欧洲和美国出现一批心理学家，开始用观察和实验方法来研究儿童心理发展。\n（3）分化和发展时期（两次世界大战之间）：由于整个心理学的发展，儿童心理学研究工作和著作在数量和质量上都有了飞速发展，儿童心理学达到比较成熟的阶段。\n（4）演变和增新时期（第二次世界大战以后）：主要表现在两个方面，一是理论观点的演变，二是在具体研究工作上的演变。" },
      { q: "从儿童发展到个体毕生全程发展的研究，霍尔、荣格、霍林沃思分别有什么贡献？", a: "霍尔将儿童心理学研究的年龄范围扩大到青春期，即儿童心理学研究儿童从出生到成熟各个阶段心理发展的特征。\n荣格是最早对成年期心理发展进行研究的心理学家。\n美国心理学家霍林沃思最先提出要追求人的心理发展全貌，并于1927年出版了《发展心理学概论》一书，这是世界上第一部发展心理学著作。" },
      { q: "发展心理学研究体制的进展体现在哪些方面？", a: "（1）发展心理学研究体制的横向整体化变化：主要涉及发展心理学研究的广度与范围问题。主要体现出两个特点：①新的交叉学科不断出现；②发展心理学的研究范围向人生的两极延伸。\n（2）发展心理学研究体制的纵向整体化变化：是指发展心理学研究重点的变化，主要体现在人们逐渐把着眼点转向发展心理学的应用方面。" },
      { q: "发展心理学研究方法的进展体现在哪些方面？", a: "（1）系统科学原理成为发展心理学研究的方法论基础；\n（2）发展心理学研究思路的生态化取向；\n（3）重视纵向（或聚合交叉）的研究；\n（4）研究方式的跨学科和跨文化特点；\n（5）研究方法的综合化与研究手段的现代化；\n（6）研究结果的数量化特征。" },
      { q: "发展心理学理论的发展体现在哪里？", a: "当代发展心理学不仅日益关注气质和情绪等基本的心理学维度，而且日益关注高级的元认知过程，包括儿童对自己及他人的思维、情感和信念的知识，以及儿童对自身的认知及对社会行为的监控和调节。" },
      { q: "发展心理学的价值是什么？", a: "（1）从人类存在的角度说，“认识自己”是其永恒的追求；\n（2）从人类本能的角度说，“发展自己”是其根本需求；\n（3）大量的现实问题需要发展心理学家去解决。" },
      { q: "发展心理学的不稳定因素有哪些？", a: "（1）过分追求数量化和抽象化的倾向；\n（2）研究的内容过分琐碎，仅凭研究者的个人兴趣；\n（3）缺乏理论的整合，只有零散的材料。" },
      { q: "发展心理学的未来走向有哪些？", a: "1. 发展心理学研究中思维方式的变革：\n（1）实现以“学科”为导向的研究模式向以“问题”为导向的研究模式的转变；\n（2）从以实体为中心的研究思路过渡到以系统为中心的研究思路；\n（3）从对心理现象的唯一性确证过渡到对多样性和不确定性的接受与容忍；\n（4）在考察心理现象的因果关系时，由直接的单一线性联系过渡到多维线性联系或非线性联系。\n2. 发展心理学研究方法的趋势：注重掌握最新的研究方法，如脑—基因—行为等多种手段相结合的研究思路等；现场研究又重新受到重视。\n3. 发展心理学研究内容的趋势：研究选题的应用性倾向越来越明显。\n4. 发展心理学研究中更大范围的整体化趋势。" },
      { q: "弗洛伊德的人格基本结构包括哪三部分？", a: "本我、自我、超我。" },
      { q: "什么是本我？", a: "本我是人格中的生物成分，遵循快乐原则。它是原始的、本能的，在人格深处最难以接近的部分，其基本机能是寻求能满足机体需求的对象，提供能量和动力。本我及其初级过程思维关注的是获得满足，而不管满足的途径是否实际或是否为环境所允许。在心理发展过程中，年龄越小，本我的作用越大。" },
      { q: "什么是自我？", a: "自我是人格的心理成分，遵循现实原则。它是从本我中分化、发展出来的，在现实的基础上满足个体的需要。自我能支配行动，思考过去的经验，计划未来的行动，弗洛伊德称这种合理的思维为二级过程思维。" },
      { q: "什么是超我？", a: "超我是人格中的社会成分，遵循道德原则。它包括良心和自我理想。良心是超我中的惩罚性、消极性和批判性的部分；自我理想是个体为之奋斗的部分。" },
      { q: "本我、自我与超我的关系是什么？", a: "弗洛伊德把自我与本我的关系比作骑士与马的关系，马提供能量，而骑士则指导马朝着他想去的方向前行。因此自我并不妨碍本我，而是帮助本我最终获得快乐的满足。\n超我和自我都是人格的控制系统。自我控制的是本我盲目的激情，以保持机体免受损害；超我有是非标准，力图使本我延迟得到满足，甚至完全不能获得满足。" },
      { q: "弗洛伊德的心理发展阶段说分为哪五个阶段？", a: "（1）口唇期（0~1岁）；（2）肛门期（1~3岁）；（3）性器期（3~6岁）；（4）潜伏期（6~11岁）；（5）青春期（11岁或13岁开始）。" },
      { q: "埃里克森的心理发展观与弗洛伊德有什么区别？", a: "埃里克森既考虑到生物学的影响，也考虑到文化和社会因素。他认为在人格发展中，逐渐形成的自我在个人与周围环境的交互作用中起着主导和整合的作用。他以人格特征为标准把个体一生划分为8个阶段，同时指出了每一个阶段的主要发展任务。" },
      { q: "埃里克森人格发展八阶段分别是什么？", a: "（1）婴儿期（0~2岁）：发展信任感，克服不信任感；\n（2）儿童早期（2~4岁）：获得自主感，克服羞怯感和疑虑感；\n（3）学前期（4~7岁）：获得主动感，克服内疚感；\n（4）学龄期（7~12岁）：获得勤奋感，克服自卑感；\n（5）青年期（12~18岁）：建立同一感，防止同一感混乱；\n（6）成年早期（18~25岁）：获得亲密感，避免孤独感；\n（7）成年中期（25~50岁）：获得繁殖感，避免停滞感；\n（8）老年期（50岁以后）：获得完善感，避免失望和厌倦感。" },
      { q: "什么是合法延缓期？", a: "埃里克森提出了“合法延缓期”的概念，也称为心理的延缓偿付期，他认为这时的青年自觉没有能力持久地承担义务，感到要做出的决断太多太快，因此在做出最后决断之前要进入一种“暂停”的时期，用以延缓承担的义务，以避免同一性提前完结的内心需要。" },
      { q: "弗洛伊德和埃里克森的观点比较。", a: "（1）弗洛伊德强调本能的作用，将人格发展局限在母亲—儿童—父亲这个狭隘的三角关系中，特别强调早期经验在人格发展中的重要作用；而埃里克森更强调自我的作用，将人格的发展置于更广阔的社会背景之上，重视社会文化对人格发展的影响。\n（2）弗洛伊德对人格阶段的划分只到青春期，埃里克森则将人格阶段扩大至个体的一生。\n（3）埃里克森理论是对弗洛伊德理论的继承、扩展与修订。" },
      { q: "华生的发展心理学理论主要观点是什么？", a: "华生认为，心理的本质是行为，人的各种心理现象是行为的组成因素，并且都可用客观的刺激—反应公式来论证。华生是名副其实的环境决定论者，这种论断主要体现在两个方面：\n1. 否认遗传的作用；\n2. 夸大环境和教育的作用。" },
      { q: "斯金纳的发展心理学理论主要观点是什么？", a: "与华生的刺激—反应心理学的不同点在于，斯金纳区分出应答性行为和操作性行为。\n1. 行为的强化控制原理：塑造、强化与消退、及时强化。\n2. 儿童行为的实际控制：育婴箱、行为矫正、教学机器和教学程序。" },
      { q: "什么是观察学习？", a: "观察学习是指通过观察他人（榜样）所表现的行为及其结果而进行的学习。相较刺激—反应学习来说，观察学习的学习者可以不必直接做出反应，也不需要亲自体验强化，只通过观察他人在一定环境中的行为，并观察他人接受一定的强化就能完成学习。班杜拉认为，观察学习表现为注意过程、保持过程、运动复现过程和动机过程。强化可以是直接强化，也可以是替代强化，还可以是自我强化。" },
      { q: "社会学习在社会化过程中的作用有哪些？", a: "（1）攻击性；（2）性别化；（3）自我强化；（4）亲社会行为。" },
      { q: "维果茨基的文化—历史发展理论是什么？", a: "维果茨基创立了文化—历史发展理论，用以解释人类心理本质上与动物不同的那些高级的心理机能。他认为工具的使用使人适应自然的方式变为物质生产的间接方式，而不再像动物一样用身体的直接方式来适应自然。在人的工具生产中凝结着人类的间接经验，即社会文化知识经验，这就说明制约人类的心理发展规律的不再是生物进化规律，而是社会历史发展规律。" },
      { q: "维果茨基认为发展的实质是什么？", a: "维果茨基认为，心理的发展指的是一个人的心理（从出生到成年）在环境与教育的影响下，在低级的心理机能的基础上，逐渐向高级的心理机能的转化过程。" },
      { q: "什么是高级心理机能？", a: "是在同周围人的交往过程中产生和发展起来的，受人类文化历史所制约。人使用物质工具进行劳动操作，使自己脱离了动物世界。同时使用符号、语言等精神工具进行精神生产，使其心理机能发生质的变化，上升到高级阶段，具有随意性、主动性。" },
      { q: "心理机能由低级向高级发展的标志有哪些？", a: "（1）心理活动的随意机能；\n（2）心理活动的抽象概括机能；\n（3）各心理机能之间的关系不断变化、组合，形成间接的、以符号或词为中介的心理结构；\n（4）心理活动的个性化。" },
      { q: "心理机能由低级向高级发展的原因有哪些？", a: "（1）高级心理机能起源于文化历史的发展，是受社会规律所制约的；\n（2）从个体发展来看，儿童在与成人交往的过程中通过掌握高级的心理机能的工具——语言、符号这一中介环节，使其在低级的心理机能的基础上形成了各种新质的心理机能；\n（3）高级的心理机能是不断内化的结果。" },
      { q: "什么是最近发展区？", a: "维果茨基认为，至少要确定两种发展的水平。第一种是现有发展水平，即儿童独立活动时达到的解决问题的水平；第二种是在有指导的情况下可以达到的解决问题的水平，也就是通过教学所获得的潜力。\n“最近发展区”是指儿童现有发展水平与在成人帮助下可能达到的发展水平之间的差异，即儿童凭借成人的帮助能达到的解决问题的水平与在独立活动中达到的解决问题的水平之间的差异。教学创造着“最近发展区”，表明儿童发展的可能性。" },
      { q: "维果茨基关于教学与发展的关系提出了哪三个重要问题？", a: "（1）最近发展区；（2）教学应当走在发展的前面；（3）学习的最佳期限。" },
      { q: "皮亚杰心理学的理论核心是什么？", a: "皮亚杰心理学的理论核心是“发生认识论”，他认为心理、智力、思维不是起源于先天的成熟或后天的经验，应当是主体的动作，而动作的本质是主体对客体的适应。主体通过动作达到对客体的适应是心理发展的真正原因。" },
      { q: "皮亚杰认为支配心理发展的因素有哪四个？", a: "（1）成熟；（2）物理因素；（3）社会环境；（4）平衡。" },
      { q: "什么是图式？", a: "图式是心理发展结构的核心概念，是指动作的结构或组织，这些动作在相同或类似环境中由于不断重复而得到迁移或概括。图式最先来自遗传，之后在适应环境的过程中不断改变和丰富，也就是说，低级的动作图式经过同化、顺应、平衡而逐步构成新的图式。" },
      { q: "什么是同化？", a: "同化是指把环境因素纳入机体已有的图式或结构之中，以加强和丰富主体的动作。它只是数量上的变化，不能引起图式的改变或创新。" },
      { q: "什么是顺应？", a: "顺应是指改变主体动作以适应客观变化。它是质量上的变化，促进创立新图式或调整原有图式。" },
      { q: "皮亚杰关于发展阶段的观点有哪些？", a: "1. 心理发展过程是连续的，但由于各种发展因素的相互作用，儿童心理发展具有阶段性。\n2. 各阶段都有它独特的结构，标志着一定阶段的年龄特征。由于各种因素如环境、教育等的差异，阶段可以提前或推迟，但先后次序不变。\n3. 各阶段的出现，从低到高有一定的次序，且有一定的交叉。\n4. 每个阶段都是形成下一个阶段的必要条件。前一阶段的结构是构成后一阶段的结构的基础，但前后两个阶段有质的差异。\n5. 在心理发展过程中，两个阶段之间不是截然划分的，而是有一定的交叉。\n6. 心理发展的一个新水平是许多因素融合而成的新结构，各种发展因素由没有系统的联系逐步组成整体。" },
      { q: "皮亚杰心理发展的四个阶段是什么？", a: "（1）感知运动阶段（0~2岁）；（2）前运算阶段（2~7岁）；（3）具体运算阶段（7~12岁）；（4）形式运算阶段（12~15岁）。" },
      { q: "什么是客体永久性？", a: "客体永久性是指儿童理解了物体是作为独立实体而存在的，即使个体不能知觉到物体的存在，它们仍然是存在的。" },
      { q: "格塞尔的成熟势力说的主要观点是什么？", a: "美国心理学家格塞尔利用双生子爬楼梯的实验证明：儿童的学习取决于生理上的成熟，成熟之前的学习与训练难有显著的效果。格塞尔认为，成熟是通过从一种发展水平向另一种发展水平突然转变而实现的，发展的本质是结构性的。儿童在成熟之前，处于学习的准备状态。" },
      { q: "什么是双生子爬楼梯实验？", a: "格塞尔让一对同卵双胞胎在不同时间学爬楼梯，其中一个在出生的第48周开始，另一个在第53周开始，结果在第55周时发现两人的爬楼梯水平一样好。将试验领域推广至其他年龄段和其他事例，得出了相似结论，即任何一项训练或教育内容针对某个特定的受训对象，都存在一个“最佳教育期”。" },
      { q: "布朗芬布伦纳的生态系统理论包括哪几个系统？", a: "（1）微观系统；（2）中间系统；（3）外层系统；（4）宏观系统；（5）时间系统。" },
      { q: "发展心理学研究的功能有哪些？", a: "（1）描述；（2）解释；（3）预测；（4）控制。" },
      { q: "发展心理学研究的特殊性有哪些？", a: "（1）年龄是一个特殊的自变量；（2）研究对象的年龄跨度大。" },
      { q: "发展心理学研究的原则有哪些？", a: "（1）客观性原则；（2）特殊性原则；（3）教育性原则；（4）生态化原则。" },
      { q: "什么是横断研究设计？其优缺点是什么？", a: "横断研究设计是在某一特定的时间，同时对不同年龄的被试进行比较的研究设计。\n优点：（1）能够在短时间内发现同一年龄或不同年龄群体发展的相似性和差异性，确定发展的年龄特征；（2）由于能够同时对几个年龄群体进行调查测量，获得的信息量大，经济且费时短。\n缺点：（1）横断研究设计所关注的年龄效应可能会与代替效应（同辈效应）相混淆；（2）由于在横断研究设计中每个人只在某个时间点上接受测查，因而无法获得个体发展趋势或发展变化的数据资料。" },
      { q: "什么是纵向研究设计？其优缺点是什么？", a: "纵向研究设计也叫追踪研究设计，是对同一研究对象在不同的年龄或阶段进行长期反复观测的研究设计。\n优点：能系统地、详尽地了解心理发展的连续过程和从量变到质变的规律。\n缺点：（1）随着研究时间的延续，部分被试可能会因各种原因退出研究，从而造成样本的流失；（2）反复测查可能影响被试的发展，影响被试的情绪，从而影响到某些数据的可靠性；（3）花费大而且耗时，长期追踪要经历时代、社会、环境的变化，这通常会造成变量的增多。" },
      { q: "什么是聚合交叉设计？其优缺点是什么？", a: "聚合交叉设计是将横断研究设计和纵向研究设计融合在一起的研究设计。研究者选择不同年龄的群体为研究对象，在短时期内重复观察这些对象。\n优点：（1）既具有纵向研究设计系统、详尽的特点，又具有横断研究设计能够进行大面积测查的特点；（2）采用了动态和静态相结合的原则，缩短了长期追踪的研究时间。\n缺点：存在理论是否可推广到其他群体的问题。" },
      { q: "什么是微观发生学设计？其优缺点是什么？", a: "微观发生学设计是通过在短时间内重复给被试呈现一个诱发变化的刺激或提供学习的机会，观测个体发生变化的过程的研究设计。\n优点：（1）它关注研究对象一系列行为发生的细节，观测一段时间内的快速变化，使得研究者能够直接观测发展变化的过程；（2）能够在研究的年龄范围内追踪特定行为的个体发展轨迹，有助于确定从一种行为模式到另一种行为模式的转折点；（3）能够观察到个体的内部差异；（4）能够确定变化最有可能发生的条件，有助于探索发展变化的原因。\n缺点：（1）需要对被试进行逐个观察、逐点记录，耗时费力，因此被试的数量有限；（2）它只适用于动机强的被试；（3）某些情况下，研究者仍旧难以分清被试已具备的能力和变化后的能力。" },
      { q: "双生子研究的优缺点是什么？", a: "优点：①同卵双生子具有相同的基因，他们之间的任何差异都可以归结为环境因素的作用；②异卵双生子基因不同，但在环境上有许多相似性，因此也提供了环境控制的可能性。\n缺点：①只孤立地考虑遗传和环境因素的影响，未考虑到两者动态的交互作用；②不能人为制造在不同生长环境下的双生子，因此较难寻找到合适的被试。" },
      { q: "发展心理学研究方法的新趋势有哪些？", a: "（1）多层面和多学科研究相互整合；（2）多变量统计方法大量使用；（3）新的数据收集手段广泛使用；（4）训练研究和教育实验越来越受重视。" },
      { q: "胎儿宫内发育分为哪几个阶段？", a: "斯滕伯格将个体出生前的发育期划分为胚芽期（0~2周）、胚胎期（3~8周）和胎儿期（8~40周）。" },
      { q: "胎儿生理和心理发展的影响因素有哪些？", a: "（1）遗传因素；（2）表观遗传；（3）环境因素；（4）母体因素；（5）父源因素。" },
      { q: "胎儿期心理卫生的种类有哪些？", a: "主要有音乐胎教、抚摸胎教、言语胎教、光照胎教。" },
      { q: "婴儿大脑形态的发展表现在哪些方面？", a: "（1）脑重与头围；（2）大脑皮质。" },
      { q: "婴儿大脑的功能发展表现在哪些方面？", a: "（1）脑电；（2）皮质中枢；（3）大脑单侧化。" },
      { q: "婴儿脑的可塑性和修复性是什么？", a: "（1）婴儿脑的可塑性；（2）婴儿脑的修复性。" },
      { q: "婴儿动作发展的规律有哪些？", a: "（1）整分原则；（2）头尾原则；（3）大小原则；（4）近远原则。" },
      { q: "影响动作发展的因素有哪些？", a: "（1）成熟；（2）学习与教育；（3）营养与健康；（4）环境因素。" },
      { q: "动作发展的重要意义是什么？", a: "（1）个体心理的起源与动作密切相关。（2）从个体心理的发展历程上看，动作在心理的内化过程中起着关键性的作用。（3）动作作为主体能动性的基本表现形式，在个体早期心理发展中起着重要的建构作用。" },
      { q: "什么是视崖实验？", a: "视崖实验是吉布森和沃克用来证明婴儿深度知觉的一个著名的心理学实验。视崖实验证明6个月的婴儿已经具备了深度知觉，对于“悬崖”感到害怕，而小于6个月的婴儿已经开始注意到深和浅的差别，但并不害怕。" },
      { q: "什么是习惯化与去习惯化？", a: "（1）习惯化；（2）去习惯化。" },
      { q: "言语发展的理论有哪些？", a: "（1）先天论；（2）后天论；（3）认知学说；（4）相互作用论。" },
      { q: "婴儿言语发展阶段有哪些？", a: "（1）前言语阶段（0~12个月）；（2）言语的发生（大约1岁）；（3）单词句时期（1~1.5岁）；（4）简单句时期（1.5~2岁）；（5）复合句时期（2~3岁）。" },
      { q: "气质的类型有哪些？", a: "（1）传统的四类型说；（2）巴甫洛夫的高级神经活动类型说；（3）托马斯、切斯的三类型说；（4）巴斯的活动特性说；（5）卡根的抑制—非抑制说；（6）布雷泽尔顿的气质三类型说。" },
      { q: "什么是拟合优度模型？", a: "托马斯和切斯提出了拟合优度模型来描述气质与环境因素是怎样共同作用，对儿童发展产生良好结果的。他们认为，气质类型形成，关键在于父母的教养方式是否与儿童的气质特点相符合。" },
      { q: "自我意识情绪主要包括哪几种？", a: "（1）尴尬；（2）自豪；（3）羞耻；（4）内疚。" },
      { q: "婴儿情绪社会化表现在哪些方面？", a: "（1）社会性微笑；（2）陌生人焦虑；（3）分离焦虑；（4）情绪的社会性参照。" },
      { q: "什么是依恋？其发展阶段有哪些？", a: "依恋是指婴儿与主要抚养者（通常是母亲）之间最初的社会性联结，也是情感社会化的重要标志。发展阶段：（1）无差别的社会反应阶段；（2）有差别的社会反应阶段；（3）特殊的情感联结阶段；（4）目标调整的伙伴关系阶段。" },
      { q: "婴儿依恋的类型有哪些？", a: "（1）安全型依恋；（2）回避型依恋；（3）反抗型依恋；后来发现了第四种——混乱型。" },
      { q: "影响依恋的因素主要有哪些？", a: "（1）依恋的机会；（2）抚育的质量；（3）婴儿的心理特点；（4）家庭环境和文化环境。" },
      { q: "婴儿早期同伴交往经历哪几个发展阶段？", a: "（1）以客体为中心阶段；（2）简单交往阶段；（3）互补性交往阶段。" },
      { q: "什么是社交指向行为？", a: "指婴儿意在指向同伴的各种具体行为，婴儿在发出这些行动时，总是伴随着对同伴的注意，也总能得到同伴的反应。" },
      { q: "婴儿自我认知发展分为哪几个阶段？", a: "1. 主体我的发展：（1）5~8个月；（2）9~12个月；（3）12~15个月。\n2. 客体我的发展：（4）15~18个月；（5）18~24个月。" },
      { q: "早期的游戏理论有哪些？", a: "（1）霍尔的复演说；（2）席勒和斯宾塞的精力过剩说；（3）彪勒夫妇的机能快乐说；（4）格罗斯的生活准备说；（5）拉扎勒斯和帕特里克的笑乐放松说；（6）博伊千介克的成熟说；（7）帕特里克的能量匮乏论；（8）巴特森的游戏元交际理论。" },
      { q: "当代游戏理论有哪些？", a: "（1）精神分析理论；（2）认知动力说；（3）学习理论。" },
      { q: "游戏的特点有哪些？", a: "（1）游戏具有社会性；（2）游戏是想象与现实生活的一种独特结合；（3）游戏是儿童主动参与的、伴有愉悦体验的活动。" },
      { q: "游戏的作用有哪些？", a: "（1）发展适应生活和解决问题的能力；（2）使儿童运动器官得到很好的发展；（3）使得儿童认知和社会交往能力能够更快、更好地发展；（4）帮助儿童学会表达和控制情绪；（5）对培养良好的个性品质同样有重要作用；（6）游戏是幼儿教育的重要手段。" },
      { q: "游戏的种类有哪些？", a: "按照游戏的目的性分类，幼儿的游戏主要有创造性游戏、教学游戏和活动性游戏。皮亚杰分为练习游戏、象征性游戏及有规则的游戏。帕滕分为六种：无所用心的行为、旁观者行为、单独游戏、平行游戏、联合游戏和合作游戏。" },
      { q: "幼儿词汇的发展表现有哪些？", a: "（1）词汇数量的增加；（2）词汇内容的丰富和深化；（3）词类范围的扩大；（4）积极词汇的增长。" },
      { q: "幼儿语法的掌握趋势是什么？", a: "（1）从简单句到复合句；（2）从陈述句到多种形式的句子；（3）从无修饰句到修饰句；（4）从不完整句到完整句。" },
      { q: "幼儿记忆的发展特点有哪些？", a: "（1）记忆容量的增加；（2）无意识记和有意识记的发展；（3）形象记忆和语词记忆的发展；（4）自传式记忆的发展；（5）记忆策略的形成；（6）元记忆的形成。" },
      { q: "幼儿思维的特点有哪些？", a: "（1）思维的具体形象性；（2）思维的抽象逻辑性开始萌芽；（3）言语在幼儿思维发展中的作用日益增强。" },
      { q: "皮亚杰关于幼儿思维的研究有哪些？", a: "（1）三座山测验；（2）守恒；（3）类包含。" },
      { q: "什么是心理理论？", a: "心理理论是指个体凭借一定的知识系统对自身或他人的心理状态进行推测，并据此对行为做出因果性解释与预测的能力。儿童拥有心理理论的主要标志是通过“错误信念”任务的测试。" },
      { q: "错误信念任务包括哪两种经典范式？", a: "（1）意外地点任务；（2）意外内容任务。" },
      { q: "心理理论发展的理论解释有哪些？", a: "（1）理论论；（2）模拟论；（3）模块论。" },
      { q: "幼儿自我评价的发展特点有哪些？", a: "（1）从轻信成人的评价到自己独立评价；（2）从对外部行为的评价到对内心品质的评价；（3）从比较笼统的评价到比较细致的评价；（4）从带有主观情绪性的评价到初步客观的评价；（5）开始以道德行为的准则进行评价。" },
      { q: "皮亚杰的儿童道德认知发展分为哪三个阶段？", a: "（1）前道德阶段（0~4、5岁）；（2）他律道德阶段（5~10岁）；（3）自律道德阶段（10岁以后）。" },
      { q: "科尔伯格的儿童道德认知发展分为哪三个水平、六个阶段？", a: "（1）前习俗水平：①服从与惩罚定向；②天真的利己主义。\n（2）习俗水平：③“好孩子”的定向；④维护权威和秩序的道德观。\n（3）后习俗水平：⑤社会契约定向；⑥普遍的伦理原则。" },
      { q: "什么是攻击行为？", a: "攻击行为又称侵犯行为，是指任何有目的地侮辱或伤害他人（或其他生物）而受害者试图回避的行为。攻击可以是身体的攻击、言语的攻击，也可以是对别人权利的侵犯。" },
      { q: "什么是工具性攻击和敌意性攻击？", a: "工具性攻击：指向渴望得到的东西，以伤害他人作为达到非攻击性目的的手段。\n敌意性攻击：以人为定向，旨在伤害他人，如报复、支配等。" },
      { q: "攻击行为的理论有哪些？", a: "（1）精神分析理论；（2）生态学理论；（3）新行为主义；（4）社会学习理论；（5）社会信息加工理论。" },
      { q: "攻击行为的控制方法有哪些？", a: "（1）消除对攻击行为的奖赏和关注；（2）榜样和认知训练策略；（3）移情训练；（4）创造减少冲突的环境。" },
      { q: "什么是亲社会行为？", a: "亲社会行为又称向社会行为、利他行为，是指任何符合社会期望而对他人、群体或社会有益的行为及趋向，如帮助、捐助、分享、赞扬等。" },
      { q: "亲社会行为的理论有哪些？", a: "（1）社会生物学观点；（2）精神分析观点；（3）社会学习理论；（4）认知发展理论；（5）社会规范理论。" },
      { q: "亲社会行为的训练方法有哪些？", a: "（1）角色扮演训练；（2）行为强化训练；（3）自我概念训练；（4）榜样示范；（5）创造良好的社会氛围。" },
      { q: "性别角色的社会化过程包括哪些？", a: "（1）理解性别；（2）获得标准；（3）取得认同；（4）形成偏爱。" },
      { q: "什么是心理两性化？", a: "柏姆认为，男子气和女子气属于两个分离的独立维度，人可以具有两性化特质，糅合男女两性的优秀品质，不必只接受某一性别的特质而拒绝另一性别的特质。" },
      { q: "同伴关系的作用有哪些？", a: "（1）同伴可以满足儿童归属和爱的需要以及尊重的需要；（2）同伴交往为儿童提供了学习的机会；（3）同伴是儿童特殊的信息渠道和参照框架；（4）同伴是儿童得到情感支持的一个来源。" },
      { q: "同伴关系的发展特点是什么？", a: "在婴儿期，同伴关系只是最松散意义上的存在。进入幼儿园，儿童与同伴的接触次数增加。3~4岁儿童，依恋同伴的强度和与同伴建立起友谊的数量有显著增长。儿童早期的友谊一般是脆弱、易变的。" },
      { q: "学习活动对心理发展的意义和作用是什么？", a: "（1）学校学习是一种社会义务，对个性发展具有重要意义。\n（2）儿童通过教学活动掌握读、写、算等基本的知识和技能，其思维活动也逐渐从具体形象思维过渡到抽象逻辑思维。\n（3）在共同的学习活动中，儿童相互交流、相互帮助，有助于儿童发展社会交往的技能。" },
      { q: "小学儿童思维发展的基本特点是什么？", a: "（1）逐步过渡到以抽象逻辑思维为主要形式，但仍带有很大的具体性；（2）由具体形象思维到抽象逻辑思维的过渡存在明显的关键期，大约在四年级（10~11岁）；（3）思维结构趋于完整，但有待完善；（4）思维发展过程的不平衡性。" },
      { q: "什么是角色采择？其发展阶段有哪些？", a: "角色采择能力也称观点采择能力，是指儿童采取他人的观点来理解他人的思想和情感的一种认知技能。发展阶段：（1）阶段0：自我中心的或无差别的观点（3~6岁）；（2）阶段1：社会—信息角色采择（6~8岁）；（3）阶段2：自我反省角色采择（8~10岁）；（4）阶段3：相互角色采择（10~12岁）；（5）阶段4：社会和习俗系统的角色替换（12~15岁）。" },
      { q: "小学儿童亲子关系的变化表现在哪些方面？", a: "（1）父母与儿童的交往时间减少；（2）父母在儿童教养方面所处理的日常问题的类型发生了变化；（3）儿童与父母的冲突数量减少了；（4）在纪律约束技术和控制过程方面，父母通常认为学龄儿童比学前儿童好控制一些；（5）父母对儿童的控制力量也在变化。" },
      { q: "小学儿童同伴交往的特点是什么？", a: "（1）儿童与同伴交往的时间更多，交往形式更复杂；（2）儿童在同伴交往中传递信息的技能增强；（3）儿童更善于利用各种信息来决定自己对他人所采取的行动；（4）儿童更善于协调自己与其他儿童的活动；（5）儿童开始形成同伴团体。" },
      { q: "塞尔曼提出的儿童友谊发展阶段有哪些？", a: "（1）第一阶段（3~7岁）；（2）第二阶段（4~9岁）：单向帮助阶段；（3）第三阶段（6~12岁）：双向帮助，但不能共患难的合作阶段；（4）第四阶段（9~15岁）：亲密的共享阶段；（5）第五阶段（12岁开始）：友谊发展的最高阶段。" },
      { q: "小学儿童品德发展的基本特点是什么？", a: "（1）小学儿童逐步形成自觉地运用道德认知来评价和调节道德行为的能力；（2）小学儿童的道德言行从比较协调到逐步分化；（3）自觉纪律的形成和发展在小学儿童品德发展中占有相当显著的地位。" },
      { q: "小学儿童道德动机发展的特点是什么？", a: "（1）由服从向独立发展；（2）由具体、近景向抽象、远景发展；（3）逐步产生道德动机的斗争，但激烈的冲突较少。" },
      { q: "青少年身体发展的一般特点有哪些？", a: "青春期是个体生长发育的第二个高峰期。主要表现在身体外形的改变、体内机能的增强及性的发育和成熟三个方面。" },
      { q: "青少年心理发展的一般特点是什么？", a: "1. 生理变化对心理活动的冲击；\n2. 心理上成人感与幼稚感的矛盾：\n（1）反抗性与依赖性；（2）闭锁性与开放性；（3）勇敢与怯懦；（4）高傲与自卑；（5）否定童年与眷恋童年。" },
      { q: "青少年思维发展的特点是什么？", a: "（1）思维的概括能力增强；（2）能使用假设检验和更加一般的逻辑规则进行思考；（3）思维活动中的自我意识成分增多；（4）辩证思维能力增强；（5）思维的创造性也在迅速发展。" },
      { q: "青少年创造性思维发展的特点是什么？", a: "（1）创造力整体呈阶段性发展；（2）随着年龄的增长，高中生创造性思维的流畅性呈下降趋势，变通性平稳发展，独特性逐渐提高；（3）在性别方面，女生创造性水平明显高于男生；（4）创造性思维的组成成分存在不同的发展趋势。" },
      { q: "初中生自我中心思维的表现有哪些？", a: "（1）假想的观众；（2）独特的自我；（3）个人神话。" },
      { q: "青少年自我意识的基本特点有哪些？", a: "（1）自我意识中独立意向的发展；（2）自我意识成分的分化；（3）强烈地关心自己的个性成长；（4）自我评价的成熟；（5）有较强的自尊心；（6）道德意识的高度发展。" },
      { q: "影响青少年自我概念的因素有哪些？", a: "（1）生理因素；（2）认知水平；（3）父母的自我概念倾向；（4）成功及失败经验的积累。" },
      { q: "什么是自我同一性？", a: "自我同一性是指个体在特定环境中的自我整合与适应感，是个体寻求内在一致性和连续性的能力，是对“我是谁”“我将来的发展方向”以及“我如何适应社会”等问题的主观感受和意识。" },
      { q: "马西娅的自我同一性理论包括哪四种重要方式？", a: "（1）同一性扩散；（2）同一性早闭；（3）同一性延缓；（4）同一性完成。" },
      { q: "青少年情绪表现的两极性有哪些？", a: "（1）强烈、狂暴性和温和、细腻性共存；（2）情绪的可变性和固执性共存；（3）内向性和表现性共存。" },
      { q: "初中生反抗心理产生的原因有哪些？", a: "（1）自我意识的突然高涨；（2）中枢神经系统的兴奋性过强；（3）独立意识。" },
      { q: "初中生反抗心理的具体表现有哪些？", a: "（1）态度强硬，举止粗暴；（2）漠不关心，冷淡对待；（3）反抗的迁移性。" },
      { q: "初中生人际交往发展的特点有哪些？", a: "（1）逐渐克服了团伙的交往方式；（2）朋友关系在生活中日益重要；（3）与异性朋友之间的关系；（4）与父母关系的变化；（5）与教师的关系。" },
      { q: "青少年面临的心理社会问题有哪些？", a: "（1）成瘾行为；（2）内部失调；（3）外部失调。" },
      { q: "成年早期的一般特征有哪些？", a: "（1）从成长期到稳定的变化；（2）智力发展到达全盛时期；（3）恋爱、结婚到为人父母；（4）创立事业到紧张工作；（5）困难重重到适应生活。" },
      { q: "成年早期的思维优势有哪些？", a: "（1）成年早期的思维方式以辩证逻辑思维为主；（2）成年早期的后期是表现创造性思维的重要时期。" },
      { q: "什么是双环模型？", a: "被用来解释自我同一性建立的内在过程。它认为自我同一性由彼此独立但又高度相关的五个维度构成，即广度探索、深度探索、沉浸探索、做出承诺和认同承诺。" },
      { q: "成年中期的发育任务有哪些观点？", a: "（1）埃里克森的观点；（2）莱文森的观点；（3）古尔德的观点；（4）哈维格斯特的观点。" },
      { q: "成年中期的智力发展模式是什么？", a: "（1）晶体智力继续上升，流体智力缓慢下降；（2）机械型智力在成年早期达到顶峰后出现下降，实用型智力则不断增长。" },
      { q: "什么是双重过程模型？", a: "由巴尔特斯等人提出，认为智力主要由两种成分构成，即认知机械成分和认知实用成分。认知机械成分可看作流体智力概念的引申，毕生发展轨迹呈先上升后下降的倒U字形；认知实用成分可看作晶体智力概念的引申，其毕生发展将随着知识经验的愈益丰富而不断增长。" },
      { q: "成年中期个性特点的稳定性与变化是什么？", a: "个性特点的稳定性，包括两层基本含义：个性结构的成分不变、各成分的平均水平不变。\n个性特点的变化：中年人的宜人性和谨慎性比年轻人更高；中年人的外向性、神经质和开放性比年轻人更低。" },
      { q: "什么是家庭生命周期？", a: "家庭生命周期，通常指的是从男女双方结为夫妻组成家庭开始，至夫妻双方死亡导致家庭解体而告终的家庭发展过程。格里克将家庭生命周期分成八个阶段。" },
      { q: "休珀的职业生涯发展理论分为哪五个阶段？", a: "（1）成长阶段（0~14岁）；（2）探索阶段（15~24岁）；（3）建立阶段（25~44岁）；（4）维持阶段（45~59岁）；（5）衰退与脱离阶段（60岁以上）。" },
      { q: "成年中期职业发展的具体问题有哪些？", a: "（1）职业成熟度；（2）工作满意感；（3）职业倦怠。" },
      { q: "什么是老龄和老化？", a: "老龄：指进入老年期的年龄。我国将60岁作为统一划分老年人口的界限。\n老化：指个体在成熟期后的生命过程中所表现出来的一系列形态学以及生理、心理功能方面的退行性变化。" },
      { q: "传统发展观的主要理论依据是什么？", a: "（1）将人主要看作是一个生物有机体；（2）心理的发展是单向前进的、不可逆转的；（3）年龄是心理发展或衰退的根据，并且是普遍适用的。" },
      { q: "毕生发展观的基本观点有哪些？", a: "（1）个体的发展是贯穿一生的；（2）发展的形式具有多样性；（3）任何一种心理或行为的发展过程都是复杂的；（4）个体的心理发展有很大的可塑性；（5）心理发展是由多重影响系统共同决定的。" },
      { q: "成年晚期认知活动的显著特点是什么？", a: "（1）退行性变化；（2）持续性；（3）差异性。" },
      { q: "成年晚期记忆老化的特点有哪些？", a: "（1）再认成绩好于回忆成绩；（2）内容有关联的记忆和有意义的记忆成绩好于无意义的机械记忆成绩；（3）初级记忆成绩好于次级记忆成绩；（4）日常生活的记忆成绩好于实验室记忆成绩；（5）内隐记忆的年龄差异小于外显记忆；（6）语义记忆的年龄差异小于情境记忆。" },
      { q: "成年晚期情绪情感的一般特点是什么？", a: "（1）比较容易产生消极的情绪情感；（2）情感体验深刻而持久；（3）情绪表达方式较为含蓄；（4）各种“丧失”是情绪体验的最重要的激发事件；（5）我国老年人生活满意度较高。" },
      { q: "成年期的社会性发展任务是什么？", a: "成年期是关注关系和成就的时期。亲密性可以在友谊和爱情中发生；在一生中，个体要在家庭和朋友的社会支持中保持平衡。成年期的另一个任务是再生：一种为他人幸福而做的努力。" },
      { q: "认知老化机制的代表性观点有哪些？", a: "（1）加工速度理论；（2）工作记忆理论；（3）抑制功能理论；（4）感觉功能理论；（5）执行功能减退假说。" },
      { q: "什么是SOC模型？", a: "巴尔特斯等人提出的SOC模型是成功解决成年晚期个体适应老化的理论模型。根据该理论模型，适应要整合以下三种过程：（1）选择；（2）最优化；（3）补偿。" },
      { q: "临终心理的阶段有哪些？", a: "（1）否认；（2）愤怒；（3）交易；（4）抑郁；（5）承受。" },
    ]
  
 
    id: 'psy',
    name: '心理治疗与心理咨询',
    questions: [
      { q: "什么是咨询心理学？", a: "咨询心理学也称咨询心理学，它是研究心理咨询活动规律的科学，亦即研究心理咨询的本质、理论、内容、过程、形式和方法的科学，是应用心理学的一个重要分支。" },
      { q: "什么是心理咨询？", a: "心理咨询是由专业人员即心理咨询师，通过人际关系，运用心理学方法，遵循心理学原则，帮助来访者，自强自立的过程。" },
      { q: "什么是心理治疗？", a: "心理治疗是在良好的治疗关系的基础上，由经过专业训练的治疗者运用心理治疗的有关理论和技术，对来访者进行帮助的过程，以消除或缓解来访者的问题或障碍，促进其人格向健康、协调的方向发展。" },
      { q: "心理咨询与心理治疗的相似之处有哪些？", a: "（1）二者所采用的理论方法常常是一致的。\n（2）二者进行工作的对象常常是相似的。\n（3）二者在强调帮助来访者成长和改变方面是相似的。\n（4）二者都注重建立帮助者与求助者之间的良好的人际关系。" },
      { q: "心理咨询与心理治疗的区别有哪些？", a: "（1）对象不同；（2）范围不同；（3）用时不同；（4）焦点不同；（5）目标不同；（6）专业训练不同；（7）情境不同；（8）组织不同。" },
      { q: "心理咨询的基本原则有哪些？", a: "（1）保密的原则；（2）时间限定的原则；（3）地点限定的原则；（4）感情限定的原则；（5）“来者不拒，去者不追”的原则；（6）“一只脚在岸上，一只脚在水里”的原则；（7）重大决定延期的原则。" },
      { q: "心理咨询和心理治疗工作者的职责有哪些？", a: "（1）对来访者负责；（2）帮助的根本目标；（3）保密原则。" },
      { q: "临床与咨询心理学从业者的职业伦理总则有哪些？", a: "（1）善行；（2）责任；（3）诚信；（4）公正；（5）尊重。" },
      { q: "什么是一般心理问题？", a: "一般心理问题是由现实因素激发、持续时间较短、情绪反应能在理智控制之下、不严重破坏社会功能、情绪反应尚未泛化的心理不健康状态。" },
      { q: "变态心理学的评价标准有哪些？", a: "1. 标准化区分：（1）医学标准；（2）统计学标准；（3）内省经验标准；（4）社会适应标准。\n2. 心理学的区分原则：（1）主观世界与客观世界的统一性；（2）心理活动的内在协调性；（3）人格的相对稳定性。" },
      { q: "什么是治疗关系？", a: "治疗关系是对来访者进行帮助的关系，其不同于一般的社会关系。" },
      { q: "什么是治疗联盟？", a: "霍维茨在解释心理治疗中来访者的变化是如何产生时强调指出，这种变化是通过人际关系中那些支持性的因素而产生的，他把这种关系叫作治疗的联盟。这种联盟的建立是为了帮助来访者以更为合适的方式思考、行事。" },
      { q: "治疗联盟内化过程包括哪几个方面？", a: "（1）积极的情绪体验；（2）自尊心的提高；（3）移情式的改进；（4）认同作用。" },
      { q: "治疗关系的特征有哪些？", a: "（1）独特性；（2）客观性与主观性的统一；（3）专业限制。" },
      { q: "治疗关系中的专业限制包括哪些？", a: "（1）独特性的限制；（2）职责的限度；（3）时间的限制；（4）其他限制。" },
      { q: "咨询关系的意义和作用有哪些？", a: "咨询关系对于治疗改变有两方面的意义：一是咨询关系本身即有治疗作用；二是咨询关系是其他改变因素的整体和支持物。" },
      { q: "治疗关系的影响因素有哪些？", a: "（1）共情；（2）积极关注；（3）尊重和温暖；（4）真诚可信；（5）具体化；（6）即时化；（7）对峙。" },
      { q: "什么是共情？", a: "共情也称“同感”“共感”，是指治疗者时时刻刻都应该是非常敏感的，对于前来寻求帮助的每一个特殊的个体都能保持这种敏感，变换自己的体验。" },
      { q: "共情的类型有哪些？", a: "（1）初级共情；（2）高级共情。" },
      { q: "准确的共情包括哪些步骤？", a: "（1）治疗者从来访者内心的参照体系出发，设身处地地体验来访者的内心世界；（2）以言语准确地表达对来访者内心体验的理解；（3）引导来访者对其感受作进一步思考。" },
      { q: "什么是积极关注？", a: "积极关注是一种共情的态度，是指治疗者以积极的态度看待来访者。注意强调他们的长处，即有选择地突出来访者言语及行为中的积极方面，利用其自身的积极因素。" },
      { q: "什么是即时化？", a: "即时化是要帮助来访者注意“此时此地”的情况，这是治疗者的任务之一。即时化的另一个内容，是指治疗者对来访者与自己的关系要敏感，对来访者指向治疗者的言语、行为、情感应予以必要的反应。" },
      { q: "什么是对峙？", a: "对峙就是要向来访者指出存在于各种态度、思想、行为之间的矛盾，也就是与来访者讨论这些矛盾。" },
      { q: "会谈的类型有哪些？", a: "（1）收集材料式会谈；（2）诊断式会谈；（3）心理治疗式会谈。" },
      { q: "注意倾听的技巧有哪些？", a: "（1）开放式问题；（2）封闭式问题；（3）鼓励和重复语句；（4）说明语句；（5）对感情的反映；（6）总结。" },
      { q: "影响对方的技巧有哪些？", a: "（1）解释；（2）指导；（3）忠告与信息；（4）自我暴露；（5）反馈；（6）逻辑推论；（7）影响性总结；（8）非言语性技巧。" },
      { q: "沉默的形式有哪些？", a: "（1）创造性沉默；（2）自发性沉默；（3）冲突性沉默。" },
      { q: "沉默的处理方式有哪些？", a: "（1）在创造性沉默中，治疗者最好什么也不要说，但要在等待中注视着对方。\n（2）在自发性沉默中，治疗者可以先略等片刻以确定这种沉默是否属于第一种创造性沉默，如若不是，治疗者应立即有所反应。\n（3）在冲突性沉默中，治疗者要以真诚的态度与来访者相处，表达出自己的想法。" },
      { q: "精神分裂症病人的特征有哪些？", a: "精神分裂症病人常常存在思维障碍，其中最常见的一种思维障碍是妄想。还可能出现感知觉障碍、情感方面的障碍，性格与以前比有一种突变。" },
      { q: "什么是人格障碍？", a: "人格障碍也称变态人格，是指人格在其发展和结构上明显偏离正常，以致不能适应正常的社会生活的障碍。" },
      { q: "在咨询与心理治疗过程中运用心理测验的注意事项有哪些？", a: "（1）要正确选择测验材料；（2）不要滥用心理测验；（3）专业人员要有标准的指导语、标准的答案和统一的记分方法。" },
      { q: "我国目前心理门诊中运用较多的心理测验类型有哪些？", a: "（1）智力测验；（2）人格测验；（3）症状评定量表。" },

      { q: "帮助和改变阶段中治疗者的主要任务是什么？", a: "帮助来访者改变其认知、情绪或行为。" },
      { q: "什么是阻力？", a: "阻力又叫阻抗，是指来访者在心理咨询过程中以公开或隐蔽的方式否定咨询者的分析，拖延、对抗咨询者的要求，从而影响咨询的进展，甚至使咨询难以顺利进行的一种现象。" },
      { q: "阻力的表现形式有哪些？", a: "（1）对会谈时间及规定的消极态度；（2）把注意力集中在与治疗者有关的问题上；（3）回避问题的方式；（4）为自己的行为辩护。" },
      { q: "阻力产生的原因有哪些？", a: "（1）阻力来自成长中的痛苦；（2）阻力来自机能性的行为失调；（3）阻力来自对抗治疗或治疗者的心理动机。" },
      { q: "应付阻力的要点有哪些？", a: "（1）解除戒备心理；（2）正确进行诊断和分析；（3）以诚恳的帮助对方的态度对待阻抗；（4）通过方法技巧突破阻抗。" },
      { q: "来自治疗者的干扰有哪些？", a: "1. 产生于满足自身需要的干扰；\n2. 与治疗者个人缺点有关的干扰。" },
      { q: "什么是无意识？", a: "无意识也译为潜意识，它有两个含义：一个是指人们对自己的一些行为的真正原因和动机不能意识到，另一个是指人们在清醒的意识下面还有潜在的心理活动在进行着，包含各种本能冲动以及与本能有关的欲望。" },

      { q: "什么是自由联想法？", a: "自由联想法是弗洛伊德1895年创造的。他让病人很舒服地躺着或坐好，把自己想到的一切都讲出来，不论其如何微不足道、荒诞不经、有伤大雅，都要如实报告出来。" },
      { q: "什么是移情？", a: "移情是指由于做心理分析治疗所用的时间很长，病人会把自己父母、亲人等的感情转移到治疗者身上，是病人无意识阻抗的一种特殊形式。" },
      { q: "什么是行为治疗？", a: "行为治疗也称作行为矫正。它是针对来访者的问题行为，运用提高目标行为发生率或降低行为发生率的种种行为技术，以最终矫正问题行为的心理治疗模式。" },
      { q: "行为治疗的基本理论包括哪三个部分？", a: "（1）经典的条件反射原理；（2）操作条件作用原理；（3）模仿学习的原理。" },
      { q: "行为治疗的基本假设是什么？", a: "（1）个体是通过学习获得了不适应的行为的。\n（2）个体可以通过学习消除那些习得的不良或不适应行为，也可通过学习获得所缺少的适应性行为。" },
      { q: "各种行为治疗的共同特点有哪些？", a: "（1）治疗只是针对当前来访者有关的问题进行；\n（2）治疗是以特殊的行为为目标的；\n（3）以实验为基础的；\n（4）对于每个来访者，治疗者根据其问题和本人的有关情况，采用适当的技术。" },
      { q: "行为治疗的基本过程是什么？", a: "（1）确认来访者的不良行为，据此可制定治疗目标、选择治疗技术和方法；\n（2）以适当的技术方法对不良行为进行矫正，帮助来访者建立起新的行为方式；\n（3）记录靶行为的基线水平及变化过程，以评价治疗过程。" },
      { q: "行为治疗中的常用技术有哪些？", a: "（1）放松训练；（2）系统脱敏法；（3）模仿学习；（4）角色扮演或行为排演；（5）决断训练；（6）强化；（7）满灌疗法；（8）厌恶疗法。" },
      { q: "什么是系统脱敏法？", a: "系统脱敏疗法是由沃尔朴最先发明及应用的，主要用于来访者在某一特定的情境下产生的超出一般紧张的焦虑或恐怖状态。它利用的是交互抑制的原理或反条件作用的原理来达到治疗目的。" },
      { q: "什么是满灌疗法？", a: "满灌疗法也称冲击疗法或泛溢疗法。满灌疗法不需要进行任何放松训练，而一下子呈现最强烈的恐惧、焦虑刺激，以迅速纠正来访者对恐惧、焦虑刺激的错误认知，并迅速消除由这种刺激引发的习惯性恐惧、焦虑反应。" },
      { q: "什么是厌恶疗法？", a: "厌恶疗法是一种把问题行为与引起躯体痛苦或精神痛苦的刺激结合起来，使来访者在发生问题行为的同时感到躯体或精神的痛苦，从而使来访者对问题行为产生厌恶而使问题行为消退的行为治疗方法。" },
      { q: "以人为中心疗法对人的基本看法有哪些？", a: "（1）人的主观性；（2）人的实现的倾向；（3）对人的其他看法。" },
      { q: "什么是有机体的评价过程？", a: "一个人的有机体的评价过程，与他对体验的估量和根据这种体验能否满足实现的倾向的情况而得出的评价的价值排列有关。" },
      { q: "什么是价值的条件化？", a: "价值的条件化过程是建立在对他人评价的内化或对他人评价的内投射的基础之上的，这一过程并不能真实地反映个体的实现倾向，相反却在妨碍着这种倾向。" },
      { q: "以人为中心治疗的特点有哪些？", a: "（1）基本理念的人本主义色彩；（2）重视当事人的主观世界；（3）反对教育的、行为控制的治疗倾向；（4）由当事人主导治疗过程；（5）咨询师做当事人的“朋友”和“伙伴”。" },
      { q: "指导式与非指导式的治疗方式有什么区别？", a: "指导式的治疗假定治疗者应为来访者选择治疗目标，指导来访者努力去达到这一目标。\n非指导的治疗认为来访者有权为他自己的生活做出选择，重视个人心理上的独立性和保持完整的心理状态的权利。" },
      { q: "罗杰斯提出的治疗者应以什么态度对待来访者？", a: "真诚、无条件积极关注和共情的态度。" },
      { q: "什么是合理情绪疗法？", a: "合理情绪疗法，简称RET，是20世纪50年代由埃利斯在美国创立的。合理情绪治疗的基本理论主要为ABC理论。" },
      { q: "什么是ABC理论？", a: "在ABC理论模式中，A是指诱发性事件；B是指个体在遇到诱发事件之后相应而生的信念；C是指特定情景下，个体的情绪及行为结果。ABC理论指出，诱发性事件A只是引起情绪及行为反应的间接原因；而B才是引起人的情绪及行为反应的更直接的起因。" },
      { q: "不合理信念的特征有哪些？", a: "（1）绝对化的要求；（2）过分概括化；（3）糟糕至极。" },
      { q: "合理情绪治疗的基本步骤有哪些？", a: "（1）心理诊断阶段；（2）领悟阶段；（3）修通阶段；（4）再教育阶段。" },
      { q: "合理情绪疗法的常用技术有哪些？", a: "（1）与不合理信念辩论的方法；（2）合理的情绪想象技术；（3）认知的家庭作业。" },
      { q: "什么是森田疗法？", a: "森田疗法由日本精神病学家森田正马于20世纪20年代组合了当时治疗神经症障碍的一些主要方法而创立的。其理论基础是森田提出的独特的神经质学说。" },
      { q: "森田疗法的基本理念和治疗原理是什么？", a: "“顺应自然，为所当为”。" },
      { q: "森田疗法的治疗原则有哪些？", a: "1. 顺应自然的治疗原理；\n2. 为所当为的治疗原理。" },
      { q: "森田疗法的住院治疗分为哪几期？", a: "（1）绝对卧床期；（2）轻工作期；（3）重工作期；（4）生活训练期。" },
    ]
  }
];

/* ============ 逻辑 ============ */
const STORAGE_KEY = 'multi_quiz_v1';
let state = loadState();
let currentSubject = null;
let current = null;
let answerShown = false;
let history = [];

const $ = id => document.getElementById(id);

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && typeof s === 'object') return s;
    }
  } catch (e) {}
  return {};
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function getSubjectState(id) {
  if (!state[id]) state[id] = { known: [], unknown: [] };
  return state[id];
}

function total() { return currentSubject ? currentSubject.questions.length : 0; }

function updateProgress() {
  if (!currentSubject) return;
  const s = getSubjectState(currentSubject.id);
  const known = s.known.length;
  $('knownCount').textContent = known;
  $('unknownCount').textContent = total() - known;
  $('progress').style.width = (known / total() * 100) + '%';
}

function pickQuestion() {
  const s = getSubjectState(currentSubject.id);
  let pool = s.unknown.slice();
  if (pool.length === 0) {
    pool = currentSubject.questions.map((_, i) => i);
    s.unknown = pool.slice();
    s.known = [];
  }
  if (pool.length > 1 && current !== null) pool = pool.filter(i => i !== current);
  return pool[Math.floor(Math.random() * pool.length)];
}

function renderQuestion() {
  current = pickQuestion();
  answerShown = false;
  history.push(current);
  const s = getSubjectState(currentSubject.id);
  s.unknown = s.unknown.filter(i => i !== current);
  saveState();

  const item = currentSubject.questions[current];
  $('tag').textContent = `第 ${current + 1} 题 / 共 ${total()} 题`;
  $('question').textContent = item.q;
  $('answer').textContent = item.a;
  $('answer').classList.remove('show');
  $('hint').style.display = 'block';
  $('actions').style.display = 'flex';
  $('actionsAfter').style.display = 'none';
  $('btnPrev').disabled = history.length <= 1;
  updateProgress();
}

function showAnswer() {
  if (answerShown) return;
  answerShown = true;
  $('answer').classList.add('show');
  $('hint').style.display = 'none';
  $('actions').style.display = 'none';
  $('actionsAfter').style.display = 'flex';
}

function markKnown() {
  const s = getSubjectState(currentSubject.id);
  if (!s.known.includes(current)) s.known.push(current);
  s.unknown = s.unknown.filter(i => i !== current);
  saveState();
  renderQuestion();
}

function markUnknown() {
  const s = getSubjectState(currentSubject.id);
  if (!s.unknown.includes(current)) s.unknown.push(current);
  s.known = s.known.filter(i => i !== current);
  saveState();
  renderQuestion();
}

function goPrev() {
  if (history.length <= 1) return;
  history.pop();
  current = history[history.length - 1];
  answerShown = false;
  const item = currentSubject.questions[current];
  $('tag').textContent = `第 ${current + 1} 题 / 共 ${total()} 题`;
  $('question').textContent = item.q;
  $('answer').textContent = item.a;
  $('answer').classList.remove('show');
  $('hint').style.display = 'block';
  $('actions').style.display = 'flex';
  $('actionsAfter').style.display = 'none';
  $('btnPrev').disabled = history.length <= 1;
}

function resetProgress() {
  if (!confirm('确定要重置当前科目的进度吗？')) return;
  state[currentSubject.id] = { known: [], unknown: [] };
  history = [];
  saveState();
  renderQuestion();
}

function switchView(view) {
  $('quizView').style.display = view === 'quiz' ? 'block' : 'none';
  $('wrongView').classList.toggle('show', view === 'wrong');
  $('allView').classList.toggle('show', view === 'all');
  $('navQuiz').classList.toggle('active', view === 'quiz');
  $('navWrong').classList.toggle('active', view === 'wrong');
  $('navAll').classList.toggle('active', view === 'all');
  if (view === 'wrong') renderList('wrong');
  if (view === 'all') renderList('all');
}

function renderList(type) {
  const container = type === 'wrong' ? $('wrongList') : $('allList');
  const s = getSubjectState(currentSubject.id);
  let items = [];
  if (type === 'wrong') {
    items = s.unknown.map(i => ({ index: i, item: currentSubject.questions[i] }));
  } else {
    items = currentSubject.questions.map((item, i) => ({ index: i, item }));
  }
  if (items.length === 0) {
    container.innerHTML = '<div class="empty">暂时没有错题，继续加油！</div>';
    return;
  }
  container.innerHTML = items.map(({ index, item }) => {
    const isKnown = s.known.includes(index);
    const tag = isKnown ? '<span class="li-tag ok">已掌握</span>' : '<span class="li-tag wrong">不熟</span>';
    return `<div class="list-item" data-i="${index}">
      ${tag}
      <div class="li-q">${item.q}</div>
      <div class="li-a">${item.a}</div>
    </div>`;
  }).join('');
}

function showHome() {
  currentSubject = null;
  history = [];
  $('homeView').style.display = 'block';
  $('quizView').style.display = 'none';
  $('wrongView').classList.remove('show');
  $('allView').classList.remove('show');
  $('nav').style.display = 'none';
  $('headerTitle').textContent = '考点刷题';
  $('progress').style.width = '0%';
  $('knownCount').textContent = '0';
  $('unknownCount').textContent = '0';
  const list = $('subjectList');
  list.innerHTML = SUBJECTS.map(sub => {
    const s = getSubjectState(sub.id);
    const known = s.known.length;
    return `<div class="subject-card" data-id="${sub.id}">
      <div>
        <div class="sc-name">${sub.name}</div>
        <div class="sc-info">已掌握 ${known} / ${sub.questions.length}</div>
      </div>
      <div class="sc-arrow">›</div>
    </div>`;
  }).join('');
}

function enterSubject(id) {
  currentSubject = SUBJECTS.find(s => s.id === id);
  history = [];
  $('homeView').style.display = 'none';
  $('nav').style.display = 'flex';
  $('headerTitle').textContent = currentSubject.name;
  const s = getSubjectState(id);
  if (s.unknown.length === 0 && s.known.length === 0) {
    s.unknown = currentSubject.questions.map((_, i) => i);
    saveState();
  }
  switchView('quiz');
  renderQuestion();
}

document.addEventListener('click', (e) => {
  const card = e.target.closest('.subject-card');
  if (card) { enterSubject(card.dataset.id); return; }
  const li = e.target.closest('.list-item');
  if (li) li.classList.toggle('open');
});

$('header').addEventListener('click', (e) => {
  if (e.target.id === 'headerTitle' && currentSubject) showHome();
});

$('btnShow').addEventListener('click', showAnswer);
$('btnKnown').addEventListener('click', markKnown);
$('btnUnknown').addEventListener('click', markUnknown);
$('btnPrev').addEventListener('click', goPrev);
$('btnPrev2').addEventListener('click', goPrev);
$('btnReset').addEventListener('click', resetProgress);
$('navQuiz').addEventListener('click', () => switchView('quiz'));
$('navWrong').addEventListener('click', () => switchView('wrong'));
$('navAll').addEventListener('click', () => switchView('all'));

showHome();

/* ============ 宠物 ============ */
(function(){
  const pet = document.getElementById('pet');
  const msg = document.getElementById('petMsg');
  const lines = ["加油，你可以的！","再记一遍就记住啦～","别急，慢慢来","你已经很棒了！","坚持就是胜利！","这道题快拿下了！"];
  let timer;

  let breath = 0, dir = 1;
  setInterval(() => {
    breath += dir * 0.15;
    if (breath > 1) { breath = 1; dir = -1; }
    if (breath < 0) { breath = 0; dir = 1; }
    pet.style.transform = `scale(${1 + breath * 0.03})`;
  }, 50);

  pet.addEventListener('click', () => {
    msg.textContent = lines[Math.floor(Math.random()*lines.length)];
    msg.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(() => msg.style.display = 'none', 1800);
  });

  function react(type) {
    if (type === 'yes') {
      pet.animate([
        { transform: 'scale(1)' },
        { transform: 'scale(1.15) rotate(-6deg)' },
        { transform: 'scale(1) rotate(0)' }
      ], { duration: 400 });
      msg.textContent = "真棒！✅";
      msg.style.display = 'block';
      clearTimeout(timer);
      timer = setTimeout(() => msg.style.display = 'none', 1200);
    } else {
      pet.animate([
        { transform: 'rotate(0)' },
        { transform: 'rotate(8deg)' },
        { transform: 'rotate(-8deg)' },
        { transform: 'rotate(0)' }
      ], { duration: 400 });
      msg.textContent = "没关系，再记一遍～";
      msg.style.display = 'block';
      clearTimeout(timer);
      timer = setTimeout(() => msg.style.display = 'none', 1400);
    }
  }

  document.addEventListener('click', (e) => {
    if (e.target.id === 'btnKnown') react('yes');
    if (e.target.id === 'btnUnknown') react('no');
  });
})();
</script>
