<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>考点刷题</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 40%, #fdf2f8 100%);
    background-attachment: fixed;
    color: #1f2937;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    color: #fff;
    padding: 18px 16px 14px; text-align: center;
    font-size: 17px; font-weight: 700;
    letter-spacing: .5px;
    box-shadow: 0 4px 20px rgba(99,102,241,.35);
    position: sticky; top: 0; z-index: 10;
  }
  .progress-bar {
    height: 6px; background: rgba(255,255,255,.25);
    margin-top: 12px; border-radius: 3px; overflow: hidden;
  }
  .progress-bar span {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #a5b4fc, #f0abfc);
    border-radius: 3px;
    transition: width .4s ease;
  }
  nav {
    display: flex; gap: 6px;
    padding: 10px 16px 0;
    position: sticky; top: 88px; z-index: 9;
  }
  nav button {
    flex: 1; border: none;
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(8px);
    padding: 10px 4px; font-size: 13px; font-weight: 600;
    color: #6b7280; font-family: inherit;
    border-radius: 999px;
    transition: all .2s ease;
    cursor: pointer;
  }
  nav button.active {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    box-shadow: 0 4px 12px rgba(99,102,241,.35);
  }
  main { flex: 1; padding: 16px; display: flex; flex-direction: column; }
  .card {
    background: #fff; border-radius: 20px;
    box-shadow: 0 8px 30px rgba(99,102,241,.10), 0 2px 8px rgba(0,0,0,.04);
    padding: 26px 20px; margin-bottom: 14px;
    flex: 1; display: flex; flex-direction: column;
    border: 1px solid rgba(255,255,255,.8);
  }
  .tag {
    display: inline-block; font-size: 12px; font-weight: 600;
    color: #6366f1; background: linear-gradient(135deg,#eef2ff,#f5f3ff);
    padding: 4px 12px; border-radius: 999px;
    margin-bottom: 16px; align-self: flex-start;
  }
  .question {
    font-size: 19px; font-weight: 700;
    line-height: 1.6; color: #111827;
  }
  .answer {
    margin-top: 20px; padding-top: 18px;
    border-top: 1px dashed #e5e7eb;
    font-size: 16px; line-height: 1.8; color: #374151;
    white-space: pre-wrap; display: none;
  }
  .answer.show { display: block; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .hint {
    margin-top: 16px; font-size: 14px; color: #9ca3af;
    text-align: center;
  }
  .actions { display: flex; gap: 10px; }
  button {
    border: none; border-radius: 14px;
    padding: 15px 8px; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: transform .12s, box-shadow .2s;
    font-family: inherit;
  }
  button:active { transform: scale(.97); }
  .btn-show {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff; flex: 1;
    box-shadow: 0 6px 16px rgba(99,102,241,.35);
  }
  .btn-known {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff; flex: 1;
    box-shadow: 0 6px 16px rgba(16,185,129,.30);
  }
  .btn-unknown {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #fff; flex: 1;
    box-shadow: 0 6px 16px rgba(245,158,11,.30);
  }
  .btn-prev { background: #e5e7eb; color: #374151; flex: 0 0 90px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  footer {
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(229,231,235,.8);
    padding: 12px 16px; font-size: 13px; color: #6b7280;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; bottom: 0;
  }
  .stat b { color: #4f46e5; font-weight: 700; }
  .stat .ok { color: #10b981; }
  .stat .no { color: #f59e0b; }
  .reset {
    color: #ef4444; font-size: 13px; background: none;
    border: none; padding: 4px; flex: none; width: auto;
    font-weight: 600;
  }
  .list-view { display: none; }
  .list-view.show { display: block; }
  .list-item {
    background: #fff; border-radius: 14px;
    padding: 16px 18px; margin-bottom: 10px;
    box-shadow: 0 4px 14px rgba(99,102,241,.08);
    cursor: pointer;
    transition: transform .15s ease;
    border: 1px solid rgba(255,255,255,.8);
  }
  .list-item:active { transform: scale(.99); }
  .list-item .li-q {
    font-size: 15px; font-weight: 700; color: #111827;
    line-height: 1.55;
  }
  .list-item .li-a {
    margin-top: 10px; font-size: 14px; color: #6b7280;
    line-height: 1.7; white-space: pre-wrap;
    display: none;
  }
  .list-item.open .li-a { display: block; }
  .list-item .li-tag {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 999px;
    margin-bottom: 8px;
  }
  .list-item .li-tag.wrong { background: #fef3c7; color: #b45309; }
  .list-item .li-tag.ok { background: #d1fae5; color: #047857; }
  .empty {
    text-align: center; color: #9ca3af;
    padding: 50px 20px; font-size: 15px;
  }
  #pet {
    position: fixed; right: 16px; bottom: 70px; z-index: 999;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    filter: drop-shadow(0 6px 12px rgba(99,102,241,.35));
    transition: transform .2s;
  }
  .home {
    padding: 20px 16px;
  }
  .home h2 {
    font-size: 18px; color: #4f46e5; margin: 0 0 16px;
    text-align: center;
  }
  .subject-card {
    background: #fff; border-radius: 18px;
    padding: 22px 20px; margin-bottom: 14px;
    box-shadow: 0 8px 24px rgba(99,102,241,.10);
    cursor: pointer;
    transition: transform .15s ease;
    display: flex; justify-content: space-between; align-items: center;
    border: 1px solid rgba(255,255,255,.8);
  }
  .subject-card:active { transform: scale(.98); }
  .subject-card .sc-name {
    font-size: 17px; font-weight: 700; color: #111827;
  }
  .subject-card .sc-info {
    font-size: 13px; color: #9ca3af; margin-top: 4px;
  }
  .subject-card .sc-arrow {
    font-size: 22px; color: #a5b4fc;
  }
  .back-btn {
    background: none; border: none; color: #fff;
    font-size: 15px; font-weight: 600; padding: 4px 0;
    cursor: pointer;
  }
  .back-btn:active { opacity: .7; }
</style>
</head>
<body>

<header id="header">
  <span id="headerTitle">考点刷题</span>
  <div class="progress-bar"><span id="progress"></span></div>
</header>

<nav id="nav" style="display:none;">
  <button id="navQuiz" class="active">刷题</button>
  <button id="navWrong">错题集</button>
  <button id="navAll">全部题目</button>
</nav>

<main>
  <!-- 首页：选科目 -->
  <div id="homeView" class="home">
    <h2>选择科目</h2>
    <div id="subjectList"></div>
  </div>

  <!-- 刷题页 -->
  <div id="quizView" style="display:none;">
    <div class="card" id="card">
      <span class="tag" id="tag">第 1 题</span>
      <div class="question" id="question">加载中...</div>
      <div class="answer" id="answer"></div>
      <div class="hint" id="hint">先自己回想一下，再点「显示答案」</div>
    </div>

    <div class="actions" id="actions">
      <button class="btn-prev" id="btnPrev">← 上一个</button>
      <button class="btn-show" id="btnShow">显示答案</button>
    </div>

    <div class="actions" id="actionsAfter" style="display:none; margin-top:10px;">
      <button class="btn-prev" id="btnPrev2">← 上一个</button>
      <button class="btn-unknown" id="btnUnknown">不熟，再来</button>
      <button class="btn-known" id="btnKnown">会了，下一题</button>
    </div>
  </div>

  <div id="wrongView" class="list-view">
    <div id="wrongList"></div>
  </div>

  <div id="allView" class="list-view">
    <div id="allList"></div>
  </div>
</main>

<footer>
  <div class="stat">
    已掌握 <b class="ok" id="knownCount">0</b> · 待复习 <b class="no" id="unknownCount">0</b>
  </div>
  <button class="reset" id="btnReset">重置进度</button>
</footer>

<div id="pet">
  <svg width="72" height="72" viewBox="0 0 100 100">
    <ellipse cx="50" cy="78" rx="26" ry="8" fill="rgba(99,102,241,.15)"/>
    <ellipse cx="50" cy="52" rx="28" ry="30" fill="#a5b4fc"/>
    <ellipse cx="50" cy="58" rx="20" ry="20" fill="#e0e7ff"/>
    <circle cx="40" cy="46" r="4.5" fill="#1f2937"/>
    <circle cx="60" cy="46" r="4.5" fill="#1f2937"/>
    <circle cx="41.5" cy="44.5" r="1.6" fill="#fff"/>
    <circle cx="61.5" cy="44.5" r="1.6" fill="#fff"/>
    <ellipse cx="50" cy="58" rx="3" ry="2" fill="#f472b6"/>
    <path d="M44 64 Q50 69 56 64" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="30" cy="56" r="3" fill="#fbcfe8" opacity=".8"/>
    <circle cx="70" cy="56" r="3" fill="#fbcfe8" opacity=".8"/>
  </svg>
  <div id="petMsg" style="position:absolute;right:80px;bottom:20px;background:#fff;color:#4f46e5;font-size:13px;font-weight:600;padding:8px 12px;border-radius:12px;box-shadow:0 4px 14px rgba(99,102,241,.25);white-space:nowrap;display:none;"></div>
</div>

<script>
/* ============ 题库 ============ */
const SUBJECTS = [
  {
    id: 'dev',
    name: '发展心理学',
    questions: [
      { q: "发展心理学的研究对象是什么？", a: "发展心理学是研究个体毕生心理发展的特点和规律的心理学分支科学。人的心身在生命进程中表现出量和质两方面的变化，且与年龄联系紧密，既表现出连续性，又表现出发展的阶段性，形成年龄特征。" },
      { q: "发展心理学研究心理发展的年龄特征，包括哪两个主要部分和四个有关方面？", a: "两个主要部分：\n（1）人的认知发展的年龄特征，包括感觉、知觉、记忆、思维、想象等，思维发展的年龄特征研究是其中最主要的一环；\n（2）社会性发展的年龄特征，包括兴趣、动机、情感、价值观、自我意识、能力、性格等，性格发展的年龄特征研究是其中最主要的一环。\n四个有关方面：\n（1）心理发展的社会生活条件和教育条件；\n（2）生理因素的发展；\n（3）动作和活动的发展；\n（4）言语的发展。" },
      { q: "什么是年龄特征？", a: "人的心理和身体的发展在生命进程中表现出连续性和阶段性，因而个体在不同年龄阶段将表现出特定的特征。" },
      { q: "什么是种系心理发展？", a: "种系心理发展是指从动物到人类的心理演变过程，包括动物心理的进化过程和人类心理的进化过程。前者研究的是动物心理学（比较心理学），后者研究的是民族心理学（主要是原始人类心理学）和个体发展心理学。" },
      { q: "促进人类动物祖先演变到人类有哪三个前提条件？", a: "一是直立行走和手的发展；二是使用工具和制造工具；三是因交往需要产生语言。" },
      { q: "人类心理的特点有哪些？", a: "（1）有意识的心理；\n（2）社会性的心理；\n（3）有语言功能的心理。" },
      { q: "什么是个体心理发展？", a: "个体心理发展是指人的个体从受精卵开始到出生、成熟直至衰老的整个生命中，心理发生和发展的过程。" },
      { q: "广义和狭义的发展心理学分别是什么？", a: "广义的发展心理学是研究种系和个体心理发生与发展的科学。狭义的发展心理学是个体发展心理学。" },
      { q: "个体心理发展的过程是什么？", a: "个体心理发展的过程是一个社会化的过程。社会化是个体掌握和积极再现社会经验、社会联系和社会关系的过程。通过社会化，个体获得在社会中进行正常活动所必需的品质、价值观、信念以及社会所赞许的行为方式。" },
      { q: "关于个体心理发展与种系心理发展关系的理论，谁最具代表性？其观点是什么？", a: "霍尔的复演论最具代表性。他认为，应该把个体心理发展看作一系列或多或少复演种系进化历史过程。从种系进化史的角度看，在个体生活的早期所表现出来的遗传特征比以后表现出来的遗传特征古老，因此前者不如后者稳定和强大。" },
      { q: "发展心理学的研究主要涉及哪两个问题？", a: "一个是有关心理发展原理或规律的理论问题；另一个是个体发展各年龄阶段的心理特征问题。" },
      { q: "在人类心理发展的基本原理或规律问题上，各种心理学派别之间的争论可以归纳为哪五点？", a: "（1）人类心理和行为是先天的还是后天的；\n（2）人类对于环境是主动的还是被动的；\n（3）人类心理发展是分阶段的还是连续的，是量变还是量变和质变的统一；\n（4）人类心理发展是普遍的还是特殊的，是多样的还是固定的；\n（5）发展的终点是开放的（发展变化能持续下去）还是有最终目标的。" },
      { q: "发展心理学的理论研究涉及哪三个问题？", a: "（1）关于遗传和环境（含教育）在心理发展上的作用问题；\n（2）关于心理发展的外因与内因问题；\n（3）关于心理不断发展和发展阶段的关系问题。" },
      { q: "关于遗传和环境在心理发展上的作用问题，正确的观点是什么？", a: "先天遗传给心理发展提供了可能性，后天环境将这种可能性变为现实性，两者缺一不可。因此，发展心理学既要研究人类心理的先天要素，也要研究自然环境、社会环境等文化背景与人类心理发展的交互作用。" },
      { q: "关于心理发展的外因与内因问题，正确的观点是什么？", a: "在人类心理发展上，外因和内因都要重视。人类身心发展是主动的，外因要通过内因才起作用。我们既要讲发展，又要强调内外因之间的关系和作用。" },
      { q: "关于心理不断发展和发展阶段的关系问题，正确的观点是什么？", a: "人类的心理既是不断发展的，又是有阶段性的。应将心理发展的连续性和阶段性统一起来，将相对主义的开放和理想化的终点统一起来，才能既科学地解释生命全程的心理持续发展趋势，又探讨不同年龄阶段心理发展的特征。" },
      { q: "发展的连续性和阶段性中，渐进论和阶段论分别是什么？", a: "渐进论认为，心理发展是一个量的积累的过程，是渐进式的、连续变化的过程，如行为主义、社会学习理论、信息加工理论。\n阶段论认为，心理发展是一个非连续的过程，有时候发展是平坦的，有时候又会发生质变，前后两个阶段表现出截然不同的心理特征。如皮亚杰的发生认识论、精神分析理论等，这些理论都是比较强调生物成熟因素对于心理发展具有重要影响。" },
      { q: "心理发展是阶段性和连续性的统一，如何理解？", a: "（1）心理发展速度的变化：心理并不是匀速发展的，有发展的快速期和进展较为缓慢的平稳期。由于发展速度上的这种不平衡，心理进展的连续性就被快速期中断，称为不连续的进程。也就是说，以发展的快速期作为分界点，发展的进程呈现出一个个不同的阶段。\n（2）阶段性与连续性的统一：心理的发展包含着量变和质变的矛盾运动过程。在心理发展的快速期，起主导作用的心理过程或心理特征发生急骤的更替，这就是一种质的飞跃，表现为阶段的划分。每一种心理过程或心理特征都不是在瞬间产生的，在质的飞跃之前有量的逐步积累；在新的心理过程或心理特征形成之后，还要继续发展积累新质，准备新的飞跃；即使在发展的快速期，也不是将前后发展进程截然分割，快速期本身也有一段发展过程，也包含着一定的渐变。所以说，在心理发展的任何时刻都体现着质变和量变的统一关系，都表现为阶段性与连续性的统一。" },
      { q: "科学儿童心理学是如何诞生的？", a: "科学儿童心理学产生于19世纪后半期。德国生理学家和实验心理学家普莱尔是儿童心理学的创始人。普莱尔的《儿童心理》（1882年出版）是第一部科学的、系统的儿童心理学著作。" },
      { q: "儿童心理学的演变经历了哪几个时期？", a: "（1）准备时期（19世纪后期之前）：在近代社会发展、近代自然科学发展、近代教育发展的推动下，经过许多科学家对儿童研究的促进，19世纪后期诞生了科学的儿童心理学。\n（2）形成时期（1882年至第一次世界大战）：在欧洲和美国出现一批心理学家，开始用观察和实验方法来研究儿童心理发展。\n（3）分化和发展时期（两次世界大战之间）：由于整个心理学的发展，儿童心理学研究工作和著作在数量和质量上都有了飞速发展，儿童心理学达到比较成熟的阶段。\n（4）演变和增新时期（第二次世界大战以后）：主要表现在两个方面，一是理论观点的演变，二是在具体研究工作上的演变。" },
      { q: "从儿童发展到个体毕生全程发展的研究，霍尔、荣格、霍林沃思分别有什么贡献？", a: "霍尔将儿童心理学研究的年龄范围扩大到青春期，即儿童心理学研究儿童从出生到成熟各个阶段心理发展的特征。\n荣格是最早对成年期心理发展进行研究的心理学家。\n美国心理学家霍林沃思最先提出要追求人的心理发展全貌，并于1927年出版了《发展心理学概论》一书，这是世界上第一部发展心理学著作。" },
      { q: "发展心理学研究体制的进展体现在哪些方面？", a: "（1）发展心理学研究体制的横向整体化变化：主要涉及发展心理学研究的广度与范围问题。主要体现出两个特点：①新的交叉学科不断出现；②发展心理学的研究范围向人生的两极延伸。\n（2）发展心理学研究体制的纵向整体化变化：是指发展心理学研究重点的变化，主要体现在人们逐渐把着眼点转向发展心理学的应用方面。" },
      { q: "发展心理学研究方法的进展体现在哪些方面？", a: "（1）系统科学原理成为发展心理学研究的方法论基础；\n（2）发展心理学研究思路的生态化取向；\n（3）重视纵向（或聚合交叉）的研究；\n（4）研究方式的跨学科和跨文化特点；\n（5）研究方法的综合化与研究手段的现代化；\n（6）研究结果的数量化特征。" },
      { q: "发展心理学理论的发展体现在哪里？", a: "当代发展心理学不仅日益关注气质和情绪等基本的心理学维度，而且日益关注高级的元认知过程，包括儿童对自己及他人的思维、情感和信念的知识，以及儿童对自身的认知及对社会行为的监控和调节。" },
      { q: "发展心理学的价值是什么？", a: "（1）从人类存在的角度说，“认识自己”是其永恒的追求；\n（2）从人类本能的角度说，“发展自己”是其根本需求；\n（3）大量的现实问题需要发展心理学家去解决。" },
      { q: "发展心理学的不稳定因素有哪些？", a: "（1）过分追求数量化和抽象化的倾向；\n（2）研究的内容过分琐碎，仅凭研究者的个人兴趣；\n（3）缺乏理论的整合，只有零散的材料。" },
      { q: "发展心理学的未来走向有哪些？", a: "1. 发展心理学研究中思维方式的变革：\n（1）实现以“学科”为导向的研究模式向以“问题”为导向的研究模式的转变；\n（2）从以实体为中心的研究思路过渡到以系统为中心的研究思路；\n（3）从对心理现象的唯一性确证过渡到对多样性和不确定性的接受与容忍；\n（4）在考察心理现象的因果关系时，由直接的单一线性联系过渡到多维线性联系或非线性联系。\n2. 发展心理学研究方法的趋势：注重掌握最新的研究方法，如脑—基因—行为等多种手段相结合的研究思路等；现场研究又重新受到重视。\n3. 发展心理学研究内容的趋势：研究选题的应用性倾向越来越明显。\n4. 发展心理学研究中更大范围的整体化趋势。" },
    ]
  },
  {
    id: 'psy',
    name: '心理治疗与心理咨询',
    questions: [
      { q: "什么是咨询心理学？", a: "咨询心理学也称咨询心理学，它是研究心理咨询活动规律的科学，亦即研究心理咨询的本质、理论、内容、过程、形式和方法的科学，是应用心理学的一个重要分支。" },
      { q: "什么是心理咨询？", a: "心理咨询是由专业人员即心理咨询师，通过人际关系，运用心理学方法，遵循心理学原则，帮助来访者，自强自立的过程。" },
      { q: "什么是心理治疗？", a: "心理治疗是在良好的治疗关系的基础上，由经过专业训练的治疗者运用心理治疗的有关理论和技术，对来访者进行帮助的过程，以消除或缓解来访者的问题或障碍，促进其人格向健康、协调的方向发展。" },
      { q: "心理咨询与心理治疗的相似之处有哪些？", a: "（1）二者所采用的理论方法常常是一致的。\n（2）二者进行工作的对象常常是相似的。\n（3）二者在强调帮助来访者成长和改变方面是相似的。\n（4）二者都注重建立帮助者与求助者之间的良好的人际关系。" },
      { q: "心理咨询与心理治疗的区别有哪些？", a: "（1）对象不同；（2）范围不同；（3）用时不同；（4）焦点不同；（5）目标不同；（6）专业训练不同；（7）情境不同；（8）组织不同。" },
      { q: "心理咨询的基本原则有哪些？", a: "（1）保密的原则；（2）时间限定的原则；（3）地点限定的原则；（4）感情限定的原则；（5）“来者不拒，去者不追”的原则；（6）“一只脚在岸上，一只脚在水里”的原则；（7）重大决定延期的原则。" },
      { q: "心理咨询和心理治疗工作者的职责有哪些？", a: "（1）对来访者负责；（2）帮助的根本目标；（3）保密原则。" },
      { q: "临床与咨询心理学从业者的职业伦理总则有哪些？", a: "（1）善行；（2）责任；（3）诚信；（4）公正；（5）尊重。" },
      { q: "什么是一般心理问题？", a: "一般心理问题是由现实因素激发、持续时间较短、情绪反应能在理智控制之下、不严重破坏社会功能、情绪反应尚未泛化的心理不健康状态。" },
      { q: "变态心理学的评价标准有哪些？", a: "1. 标准化区分：（1）医学标准；（2）统计学标准；（3）内省经验标准；（4）社会适应标准。\n2. 心理学的区分原则：（1）主观世界与客观世界的统一性；（2）心理活动的内在协调性；（3）人格的相对稳定性。" },
      { q: "什么是治疗关系？", a: "治疗关系是对来访者进行帮助的关系，其不同于一般的社会关系。" },
      { q: "什么是治疗联盟？", a: "霍维茨在解释心理治疗中来访者的变化是如何产生时强调指出，这种变化是通过人际关系中那些支持性的因素而产生的，他把这种关系叫作治疗的联盟。这种联盟的建立是为了帮助来访者以更为合适的方式思考、行事。" },
      { q: "治疗联盟内化过程包括哪几个方面？", a: "（1）积极的情绪体验；（2）自尊心的提高；（3）移情式的改进；（4）认同作用。" },
      { q: "治疗关系的特征有哪些？", a: "（1）独特性；（2）客观性与主观性的统一；（3）专业限制。" },
      { q: "治疗关系中的专业限制包括哪些？", a: "（1）独特性的限制；（2）职责的限度；（3）时间的限制；（4）其他限制。" },
      { q: "咨询关系的意义和作用有哪些？", a: "咨询关系对于治疗改变有两方面的意义：一是咨询关系本身即有治疗作用；二是咨询关系是其他改变因素的整体和支持物。" },
      { q: "治疗关系的影响因素有哪些？", a: "（1）共情；（2）积极关注；（3）尊重和温暖；（4）真诚可信；（5）具体化；（6）即时化；（7）对峙。" },
      { q: "什么是共情？", a: "共情也称“同感”“共感”，是指治疗者时时刻刻都应该是非常敏感的，对于前来寻求帮助的每一个特殊的个体都能保持这种敏感，变换自己的体验。" },
      { q: "共情的类型有哪些？", a: "（1）初级共情；（2）高级共情。" },
      { q: "准确的共情包括哪些步骤？", a: "（1）治疗者从来访者内心的参照体系出发，设身处地地体验来访者的内心世界；（2）以言语准确地表达对来访者内心体验的理解；（3）引导来访者对其感受作进一步思考。" },
      { q: "什么是积极关注？", a: "积极关注是一种共情的态度，是指治疗者以积极的态度看待来访者。注意强调他们的长处，即有选择地突出来访者言语及行为中的积极方面，利用其自身的积极因素。" },
      { q: "什么是即时化？", a: "即时化是要帮助来访者注意“此时此地”的情况，这是治疗者的任务之一。即时化的另一个内容，是指治疗者对来访者与自己的关系要敏感，对来访者指向治疗者的言语、行为、情感应予以必要的反应。" },
      { q: "什么是对峙？", a: "对峙就是要向来访者指出存在于各种态度、思想、行为之间的矛盾，也就是与来访者讨论这些矛盾。" },
      { q: "会谈的类型有哪些？", a: "（1）收集材料式会谈；（2）诊断式会谈；（3）心理治疗式会谈。" },
      { q: "注意倾听的技巧有哪些？", a: "（1）开放式问题；（2）封闭式问题；（3）鼓励和重复语句；（4）说明语句；（5）对感情的反映；（6）总结。" },
      { q: "影响对方的技巧有哪些？", a: "（1）解释；（2）指导；（3）忠告与信息；（4）自我暴露；（5）反馈；（6）逻辑推论；（7）影响性总结；（8）非言语性技巧。" },
      { q: "沉默的形式有哪些？", a: "（1）创造性沉默；（2）自发性沉默；（3）冲突性沉默。" },
      { q: "沉默的处理方式有哪些？", a: "（1）在创造性沉默中，治疗者最好什么也不要说，但要在等待中注视着对方。\n（2）在自发性沉默中，治疗者可以先略等片刻以确定这种沉默是否属于第一种创造性沉默，如若不是，治疗者应立即有所反应。\n（3）在冲突性沉默中，治疗者要以真诚的态度与来访者相处，表达出自己的想法。" },
      { q: "精神分裂症病人的特征有哪些？", a: "精神分裂症病人常常存在思维障碍，其中最常见的一种思维障碍是妄想。还可能出现感知觉障碍、情感方面的障碍，性格与以前比有一种突变。" },
      { q: "什么是人格障碍？", a: "人格障碍也称变态人格，是指人格在其发展和结构上明显偏离正常，以致不能适应正常的社会生活的障碍。" },
      { q: "在咨询与心理治疗过程中运用心理测验的注意事项有哪些？", a: "（1）要正确选择测验材料；（2）不要滥用心理测验；（3）专业人员要有标准的指导语、标准的答案和统一的记分方法。" },
      { q: "我国目前心理门诊中运用较多的心理测验类型有哪些？", a: "（1）智力测验；（2）人格测验；（3）症状评定量表。" },
      { q: "对问题的确认和分析包括哪些步骤？", a: "（1）一般信息的收集、问题的概况；（2）是否可疑精神病；（3）对来访者的问题的确认和分析。" },
      { q: "不同治疗学派的治疗目标分别是什么？", a: "（1）心理分析治疗的目标：是要消除神经症症状、使自我变得强壮有力；\n（2）行为治疗的目标：是要改变不适应的行为，消除行为缺陷；\n（3）来访者中心疗法的治疗目标：是对自我经验和体验采取更为开放的态度，具有责任感，自尊，能接受他人；\n（4）合理情绪疗法的治疗目标：是思维的合理性和适度的情绪反应等。" },
      { q: "心理治疗的基本阶段有哪些？", a: "（1）心理诊断阶段；（2）帮助和改变阶段；（3）结束阶段。" },
      { q: "治疗目标的制定应注意哪几点？", a: "（1）治疗目标是具体的；（2）治疗目标是现实可行的；（3）治疗目标是心理学的目标；（4）治疗目标常常是分轻重缓急的；（5）对治疗目标应经常进行评价。" },
      { q: "帮助和改变阶段中治疗者的主要任务是什么？", a: "帮助来访者改变其认知、情绪或行为。" },
      { q: "什么是阻力？", a: "阻力又叫阻抗，是指来访者在心理咨询过程中以公开或隐蔽的方式否定咨询者的分析，拖延、对抗咨询者的要求，从而影响咨询的进展，甚至使咨询难以顺利进行的一种现象。" },
      { q: "阻力的表现形式有哪些？", a: "（1）对会谈时间及规定的消极态度；（2）把注意力集中在与治疗者有关的问题上；（3）回避问题的方式；（4）为自己的行为辩护。" },
      { q: "阻力产生的原因有哪些？", a: "（1）阻力来自成长中的痛苦；（2）阻力来自机能性的行为失调；（3）阻力来自对抗治疗或治疗者的心理动机。" },
      { q: "应付阻力的要点有哪些？", a: "（1）解除戒备心理；（2）正确进行诊断和分析；（3）以诚恳的帮助对方的态度对待阻抗；（4）通过方法技巧突破阻抗。" },
      { q: "来自治疗者的干扰有哪些？", a: "1. 产生于满足自身需要的干扰；\n2. 与治疗者个人缺点有关的干扰。" },
      { q: "什么是无意识？", a: "无意识也译为潜意识，它有两个含义：一个是指人们对自己的一些行为的真正原因和动机不能意识到，另一个是指人们在清醒的意识下面还有潜在的心理活动在进行着，包含各种本能冲动以及与本能有关的欲望。" },
      { q: "什么是压抑？", a: "弗洛伊德认为无意识的动机都是向上运动的，向外推的，而意识却施以相反的力量，向下、向内紧压，这就是压抑。压抑的功能是把主体的经历和回忆、各种欲望和冲动保存和隐藏起来，不让它们在意识中出现。" },
      { q: "什么是本我、自我和超我？", a: "本我是人格中最原始、最模糊和最不易把握的部分，是由一切与生俱来的本能冲动所组成的，遵循快乐原则。\n自我是现实化了的本能，从本我中分化出来，受现实原则支配。\n超我是道德化了的自我，从自我中分化而来，遵循至善原则，可分为自我理想和良心。" },
      { q: "自我的心理防御机制有哪些？", a: "（1）压抑；（2）投射；（3）否认；（4）退行；（5）固着；（6）升华；（7）置换；（8）抵消；（9）反向形成。" },
      { q: "弗洛伊德的性心理发展分为哪五个阶段？", a: "（1）口欲阶段（0~1岁左右）；（2）肛欲阶段（1~3岁左右）；（3）性器欲阶段（3~6岁左右）；（4）潜伏期阶段（6~12岁左右）；（5）青春期阶段（12~18岁左右）。" },
      { q: "心理分析的治疗方法有哪些？", a: "（1）自由联想法；（2）释梦；（3）阻抗；（4）移情；（5）解释。" },
      { q: "什么是自由联想法？", a: "自由联想法是弗洛伊德1895年创造的。他让病人很舒服地躺着或坐好，把自己想到的一切都讲出来，不论其如何微不足道、荒诞不经、有伤大雅，都要如实报告出来。" },
      { q: "什么是移情？", a: "移情是指由于做心理分析治疗所用的时间很长，病人会把自己父母、亲人等的感情转移到治疗者身上，是病人无意识阻抗的一种特殊形式。" },
      { q: "什么是行为治疗？", a: "行为治疗也称作行为矫正。它是针对来访者的问题行为，运用提高目标行为发生率或降低行为发生率的种种行为技术，以最终矫正问题行为的心理治疗模式。" },
      { q: "行为治疗的基本理论包括哪三个部分？", a: "（1）经典的条件反射原理；（2）操作条件作用原理；（3）模仿学习的原理。" },
      { q: "行为治疗的基本假设是什么？", a: "（1）个体是通过学习获得了不适应的行为的。\n（2）个体可以通过学习消除那些习得的不良或不适应行为，也可通过学习获得所缺少的适应性行为。" },
      { q: "各种行为治疗的共同特点有哪些？", a: "（1）治疗只是针对当前来访者有关的问题进行；\n（2）治疗是以特殊的行为为目标的；\n（3）以实验为基础的；\n（4）对于每个来访者，治疗者根据其问题和本人的有关情况，采用适当的技术。" },
      { q: "行为治疗的基本过程是什么？", a: "（1）确认来访者的不良行为，据此可制定治疗目标、选择治疗技术和方法；\n（2）以适当的技术方法对不良行为进行矫正，帮助来访者建立起新的行为方式；\n（3）记录靶行为的基线水平及变化过程，以评价治疗过程。" },
      { q: "行为治疗中的常用技术有哪些？", a: "（1）放松训练；（2）系统脱敏法；（3）模仿学习；（4）角色扮演或行为排演；（5）决断训练；（6）强化；（7）满灌疗法；（8）厌恶疗法。" },
      { q: "什么是系统脱敏法？", a: "系统脱敏疗法是由沃尔朴最先发明及应用的，主要用于来访者在某一特定的情境下产生的超出一般紧张的焦虑或恐怖状态。它利用的是交互抑制的原理或反条件作用的原理来达到治疗目的。" },
      { q: "什么是满灌疗法？", a: "满灌疗法也称冲击疗法或泛溢疗法。满灌疗法不需要进行任何放松训练，而一下子呈现最强烈的恐惧、焦虑刺激，以迅速纠正来访者对恐惧、焦虑刺激的错误认知，并迅速消除由这种刺激引发的习惯性恐惧、焦虑反应。" },

      { q: "森田疗法的住院治疗分为哪几期？", a: "（1）绝对卧床期；（2）轻工作期；（3）重工作期；（4）生活训练期。" },

/* ============ 逻辑 ============ */
const STORAGE_KEY = 'multi_quiz_v1';
let state = loadState();
let currentSubject = null;
let current = null;
let answerShown = false;
let history = [];

const $ = id => document.getElementById(id);

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && typeof s === 'object') return s;
    }
  } catch (e) {}
  return {};
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function getSubjectState(id) {
  if (!state[id]) state[id] = { known: [], unknown: [] };
  return state[id];
}

function total() { return currentSubject ? currentSubject.questions.length : 0; }

function updateProgress() {
  if (!currentSubject) return;
  const s = getSubjectState(currentSubject.id);
  const known = s.known.length;
  $('knownCount').textContent = known;
  $('unknownCount').textContent = total() - known;
  $('progress').style.width = (known / total() * 100) + '%';
}

function pickQuestion() {
  const s = getSubjectState(currentSubject.id);
  let pool = s.unknown.slice();
  if (pool.length === 0) {
    pool = currentSubject.questions.map((_, i) => i);
    s.unknown = pool.slice();
    s.known = [];
  }
  if (pool.length > 1 && current !== null) pool = pool.filter(i => i !== current);
  return pool[Math.floor(Math.random() * pool.length)];
}

function renderQuestion() {
  current = pickQuestion();
  answerShown = false;
  history.push(current);
  const s = getSubjectState(currentSubject.id);
  s.unknown = s.unknown.filter(i => i !== current);
  saveState();

  const item = currentSubject.questions[current];
  $('tag').textContent = `第 ${current + 1} 题 / 共 ${total()} 题`;
  $('question').textContent = item.q;
  $('answer').textContent = item.a;
  $('answer').classList.remove('show');
  $('hint').style.display = 'block';
  $('actions').style.display = 'flex';
  $('actionsAfter').style.display = 'none';
  $('btnPrev').disabled = history.length <= 1;
  updateProgress();
}

function showAnswer() {
  if (answerShown) return;
  answerShown = true;
  $('answer').classList.add('show');
  $('hint').style.display = 'none';
  $('actions').style.display = 'none';
  $('actionsAfter').style.display = 'flex';
}

function markKnown() {
  const s = getSubjectState(currentSubject.id);
  if (!s.known.includes(current)) s.known.push(current);
  s.unknown = s.unknown.filter(i => i !== current);
  saveState();
  renderQuestion();
}

function markUnknown() {
  const s = getSubjectState(currentSubject.id);
  if (!s.unknown.includes(current)) s.unknown.push(current);
  s.known = s.known.filter(i => i !== current);
  saveState();
  renderQuestion();
}

function goPrev() {
  if (history.length <= 1) return;
  history.pop();
  current = history[history.length - 1];
  answerShown = false;
  const item = currentSubject.questions[current];
  $('tag').textContent = `第 ${current + 1} 题 / 共 ${total()} 题`;
  $('question').textContent = item.q;
  $('answer').textContent = item.a;
  $('answer').classList.remove('show');
  $('hint').style.display = 'block';
  $('actions').style.display = 'flex';
  $('actionsAfter').style.display = 'none';
  $('btnPrev').disabled = history.length <= 1;
}

function resetProgress() {
  if (!confirm('确定要重置当前科目的进度吗？')) return;
  state[currentSubject.id] = { known: [], unknown: [] };
  history = [];
  saveState();
  renderQuestion();
}

function switchView(view) {
  $('quizView').style.display = view === 'quiz' ? 'block' : 'none';
  $('wrongView').classList.toggle('show', view === 'wrong');
  $('allView').classList.toggle('show', view === 'all');
  $('navQuiz').classList.toggle('active', view === 'quiz');
  $('navWrong').classList.toggle('active', view === 'wrong');
  $('navAll').classList.toggle('active', view === 'all');
  if (view === 'wrong') renderList('wrong');
  if (view === 'all') renderList('all');
}

function renderList(type) {
  const container = type === 'wrong' ? $('wrongList') : $('allList');
  const s = getSubjectState(currentSubject.id);
  let items = [];
  if (type === 'wrong') {
    items = s.unknown.map(i => ({ index: i, item: currentSubject.questions[i] }));
  } else {
    items = currentSubject.questions.map((item, i) => ({ index: i, item }));
  }
  if (items.length === 0) {
    container.innerHTML = '<div class="empty">暂时没有错题，继续加油！</div>';
    return;
  }
  container.innerHTML = items.map(({ index, item }) => {
    const isKnown = s.known.includes(index);
    const tag = isKnown ? '<span class="li-tag ok">已掌握</span>' : '<span class="li-tag wrong">不熟</span>';
    return `<div class="list-item" data-i="${index}">
      ${tag}
      <div class="li-q">${item.q}</div>
      <div class="li-a">${item.a}</div>
    </div>`;
  }).join('');
}

function showHome() {
  currentSubject = null;
  history = [];
  $('homeView').style.display = 'block';
  $('quizView').style.display = 'none';
  $('wrongView').classList.remove('show');
  $('allView').classList.remove('show');
  $('nav').style.display = 'none';
  $('headerTitle').textContent = '考点刷题';
  $('progress').style.width = '0%';
  $('knownCount').textContent = '0';
  $('unknownCount').textContent = '0';
  const list = $('subjectList');
  list.innerHTML = SUBJECTS.map(sub => {
    const s = getSubjectState(sub.id);
    const known = s.known.length;
    return `<div class="subject-card" data-id="${sub.id}">
      <div>
        <div class="sc-name">${sub.name}</div>
        <div class="sc-info">已掌握 ${known} / ${sub.questions.length}</div>
      </div>
      <div class="sc-arrow">›</div>
    </div>`;
  }).join('');
}

function enterSubject(id) {
  currentSubject = SUBJECTS.find(s => s.id === id);
  history = [];
  $('homeView').style.display = 'none';
  $('nav').style.display = 'flex';
  $('headerTitle').textContent = currentSubject.name;
  const s = getSubjectState(id);
  if (s.unknown.length === 0 && s.known.length === 0) {
    s.unknown = currentSubject.questions.map((_, i) => i);
    saveState();
  }
  switchView('quiz');
  renderQuestion();
}

document.addEventListener('click', (e) => {
  const card = e.target.closest('.subject-card');
  if (card) { enterSubject(card.dataset.id); return; }
  const li = e.target.closest('.list-item');
  if (li) li.classList.toggle('open');
});

$('header').addEventListener('click', (e) => {
  if (e.target.id === 'headerTitle' && currentSubject) showHome();
});

$('btnShow').addEventListener('click', showAnswer);
$('btnKnown').addEventListener('click', markKnown);
$('btnUnknown').addEventListener('click', markUnknown);
$('btnPrev').addEventListener('click', goPrev);
$('btnPrev2').addEventListener('click', goPrev);
$('btnReset').addEventListener('click', resetProgress);
$('navQuiz').addEventListener('click', () => switchView('quiz'));
$('navWrong').addEventListener('click', () => switchView('wrong'));
$('navAll').addEventListener('click', () => switchView('all'));

showHome();

/* ============ 宠物 ============ */
(function(){
  const pet = document.getElementById('pet');
  const msg = document.getElementById('petMsg');
  const lines = ["加油，你可以的！","再记一遍就记住啦～","别急，慢慢来","你已经很棒了！","坚持就是胜利！","这道题快拿下了！"];
  let timer;

  let breath = 0, dir = 1;
  setInterval(() => {
    breath += dir * 0.15;
    if (breath > 1) { breath = 1; dir = -1; }
    if (breath < 0) { breath = 0; dir = 1; }
    pet.style.transform = `scale(${1 + breath * 0.03})`;
  }, 50);

  pet.addEventListener('click', () => {
    msg.textContent = lines[Math.floor(Math.random()*lines.length)];
    msg.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(() => msg.style.display = 'none', 1800);
  });

  function react(type) {
    if (type === 'yes') {
      pet.animate([
        { transform: 'scale(1)' },
        { transform: 'scale(1.15) rotate(-6deg)' },
        { transform: 'scale(1) rotate(0)' }
      ], { duration: 400 });
      msg.textContent = "真棒！✅";
      msg.style.display = 'block';
      clearTimeout(timer);
      timer = setTimeout(() => msg.style.display = 'none', 1200);
    } else {
      pet.animate([
        { transform: 'rotate(0)' },
        { transform: 'rotate(8deg)' },
        { transform: 'rotate(-8deg)' },
        { transform: 'rotate(0)' }
      ], { duration: 400 });
      msg.textContent = "没关系，再记一遍～";
      msg.style.display = 'block';
      clearTimeout(timer);
      timer = setTimeout(() => msg.style.display = 'none', 1400);
    }
  }

  document.addEventListener('click', (e) => {
    if (e.target.id === 'btnKnown') react('yes');
    if (e.target.id === 'btnUnknown') react('no');
  });
})();
</script>
