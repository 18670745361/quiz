<script>
/* ============ 发展心理学题库（完整版） ============ */
const QUESTIONS = [
  { q: "发展心理学的研究对象是什么？", a: "发展心理学是研究个体毕生心理发展的特点和规律的心理学分支科学。人的心身在生命进程中表现出量和质两方面的变化，且与年龄联系紧密，既表现出连续性，又表现出发展的阶段性，形成年龄特征。" },
  { q: "发展心理学研究心理发展的年龄特征，包括哪两个主要部分和四个有关方面？", a: "发展心理学研究各种心理活动的年龄特征，具体地说，研究心理发展的年龄特征，包括两个主要部分和四个有关方面。\n1. 两个主要部分：\n（1）人的认知发展的年龄特征，认知包括感觉、知觉、记忆、思维、想象等，思维的年龄特征的研究是其中最主要的一环；\n（2）社会性发展的年龄特征，社会性包括兴趣、动机、情感、价值观、自我意识、能力、性格等，性格的年龄特征的研究是其中最主要的一环。\n2. 四个有关方面：\n（1）心理发展的社会生活条件和教育条件；\n（2）生理因素的发展；\n（3）动作和活动的发展；\n（4）言语的发展。" },
  { q: "什么是年龄特征？", a: "人的心理和身体的发展在生命进程中表现出连续性和阶段性，因而个体在不同年龄阶段将表现出特定的特征。" },
  { q: "什么是种系心理发展？", a: "种系心理发展是指从动物到人类的心理演变过程。其中包括动物心理的进化过程和人类心理的进化过程。前者研究的是动物心理学（比较心理学）的内容，后者研究的是民族心理学（主要是原始人类心理学）和个体发展心理学的内容。" },
  { q: "人类的进化是什么？促进人类动物祖先演变到人类有哪三个前提条件？", a: "人类心理的进化过程是研究人类动物祖先演变到人类的过程。促进人类动物祖先演变到人类有三个前提条件：一是直立行走和手的发展；二是使用工具和制造工具；三是因交往需要产生语言。" },
  { q: "人类心理的特点有哪些？", a: "（1）有意识的心理；\n（2）社会性的心理；\n（3）有语言功能的心理。" },
  { q: "什么是个体心理发展？", a: "个体心理发展是指人的个体从受精卵开始到出生、成熟直至衰老的整个生命中，心理发生和发展的过程。个体心理发展和种系心理发展构成了从动物到人类心理发展的整体面貌。因此，广义的发展心理学是研究种系和个体心理发生与发展的科学，狭义的发展心理学是个体发展心理学。" },
  { q: "个体心理的发展过程是什么？", a: "个体心理发展的过程是一个社会化的过程。社会化是个体掌握和积极再现社会经验、社会联系和社会关系的过程。通过社会化，个体获得在社会中进行正常活动所必需的品质、价值观、信念以及社会所赞许的行为方式。" },
  { q: "个体心理发展和种系心理发展的关系是什么？", a: "关于个体心理发展与种系心理发展关系的理论，霍尔的复演论最具代表性。他认为，应该把个体心理发展看作一系列或多或少复演种系进化历史过程。从种系进化史的角度看，在个体生活的早期所表现出来的遗传特征比以后表现出来的遗传特征古老，因此前者不如后者稳定和强大。" },
  { q: "发展心理学的研究主要涉及哪两个问题？", a: "发展心理学的研究主要涉及两个问题：一个是有关心理发展原理或规律的理论问题；另一个是个体发展各年龄阶段的心理特征问题。" },
  { q: "在人类心理发展的基本原理或规律问题上，各种心理学派别之间的争论可以归纳为哪五点？", a: "（1）人类心理和行为是先天的还是后天的；\n（2）人类对于环境是主动的还是被动的；\n（3）人类心理发展是分阶段的还是连续的，是量变还是量变和质变的统一；\n（4）人类心理发展是普遍的还是特殊的，是多样的还是固定的；\n（5）发展的终点是开放的（发展变化能持续下去）还是有最终目标的。" },
  { q: "发展心理学的理论研究涉及哪三个问题？", a: "1. 关于遗传和环境（含教育）在心理发展上的作用问题：先天遗传给心理发展提供了可能性，后天环境将这种可能性变为现实性，两者缺一不可。因此，发展心理学既要研究人类心理的先天要素，也要研究自然环境、社会环境等文化背景与人类心理发展的交互作用。\n2. 关于心理发展的外因与内因问题：在人类心理发展上，外因和内因都要重视。人类身心发展是主动的，外因要通过内因才起作用。我们既要讲发展，又要强调内外因之间的关系和作用。\n3. 关于心理不断发展和发展阶段的关系问题：人类的心理既是不断发展的，又是有阶段性的。应将心理发展的连续性和阶段性统一起来，将相对主义的开放和理想化的终点统一起来，才能既科学地解释生命全程的心理持续发展趋势，又探讨不同年龄阶段心理发展的特征。" },
  { q: "发展的连续性和阶段性中，渐进论和阶段论分别是什么？", a: "1. 渐进论：渐进论认为，心理发展是一个量的积累的过程，是渐进式的、连续变化的过程，如行为主义、社会学习理论、信息加工理论。\n2. 阶段论：阶段论认为，心理发展是一个非连续的过程，有时候发展是平坦的，有时候又会发生质变，前后两个阶段表现出截然不同的心理特征。如皮亚杰的发生认识论、精神分析理论等，这些理论都是比较强调生物成熟因素对于心理发展具有重要影响。" },
  { q: "心理发展是阶段性和连续性的统一，如何理解？", a: "1. 心理发展速度的变化：心理并不是匀速发展的，有发展的快速期和进展较为缓慢的平稳期。由于发展速度上的这种不平衡，心理进展的连续性就被快速期中断，称为不连续的进程。也就是说，以发展的快速期作为分界点，发展的进程呈现出一个个不同的阶段。\n2. 阶段性与连续性的统一：心理的发展包含着量变和质变的矛盾运动过程。在心理发展的快速期，起主导作用的心理过程或心理特征发生急骤的更替，这就是一种质的飞跃，表现为阶段的划分。每一种心理过程或心理特征都不是在瞬间产生的，在质的飞跃之前有量的逐步积累；在新的心理过程或心理特征形成之后，还要继续发展积累新质，准备新的飞跃；即使在发展的快速期，也不是将前后发展进程截然分割，快速期本身也有一段发展过程，也包含着一定的渐变。所以说，在心理发展的任何时刻都体现着质变和量变的统一关系，都表现为阶段性与连续性的统一。" },
  { q: "科学儿童心理学是如何诞生的？", a: "科学儿童心理学产生于19世纪后半期。德国生理学家和实验心理学家普莱尔是儿童心理学的创始人。普莱尔的《儿童心理》（1882年出版）是第一部科学的、系统的儿童心理学著作。" },
  { q: "儿童心理学的演变经历了哪几个时期？", a: "1. 准备时期（19世纪后期之前）：在近代社会发展、近代自然科学发展、近代教育发展的推动下，经过许多科学家对儿童研究的促进，19世纪后期诞生了科学的儿童心理学。\n2. 形成时期（1882年至第一次世界大战）：在欧洲和美国出现一批心理学家，开始用观察和实验方法来研究儿童心理发展。\n3. 分化和发展时期（两次世界大战之间）：由于整个心理学的发展，儿童心理学研究工作和著作在数量和质量上都有了飞速发展，儿童心理学达到比较成熟的阶段。\n4. 演变和增新时期（第二次世界大战以后）：主要表现在两个方面，一是理论观点的演变，二是在具体研究工作上的演变。" },
  { q: "从儿童发展到个体毕生全程发展的研究，霍尔、荣格、霍林沃思分别有什么贡献？", a: "1. 霍尔将儿童心理学研究的年龄范围扩大到青春期：霍尔确定了儿童心理学研究的年龄范围，即儿童心理学研究儿童从出生到成熟各个阶段心理发展的特征。\n2. 精神分析学派对个体一生全程的发展率先做了研究：荣格是最早对成年期心理发展进行研究的心理学家。\n3. 发展心理学的问世及研究：美国心理学家霍林沃思最先提出要追求人的心理发展全貌，并于1927年出版了《发展心理学概论》一书，这是世界上第一部发展心理学著作。从1957年起，美国《心理学年鉴》开始用“发展心理学”代替“儿童心理学”作章名。自发展心理学问世以来，研究者对发展心理学开展了较深入的研究，特别是对成人心理发展做了有创新意义的研究。" },
  { q: "发展心理学研究体制的进展体现在哪些方面？", a: "1. 发展心理学研究体制的横向整体化变化：发展心理学研究体制的横向整体化变化，主要涉及发展心理学研究的广度与范围问题。主要体现出两个特点：（1）新的交叉学科不断出现；（2）发展心理学的研究范围向人生的两极延伸。\n2. 发展心理学研究体制的纵向整体化变化：发展心理学研究体制的纵向整体化变化，是指发展心理学研究重点的变化，主要体现在人们逐渐把着眼点转向发展心理学的应用方面。" },
  { q: "发展心理学研究方法的进展体现在哪些方面？", a: "发展心理学在研究方法上的进展体现在：1. 系统科学原理成为发展心理学研究的方法论基础；2. 发展心理学研究思路的生态化取向；3. 重视纵向（或聚合交叉）的研究；4. 研究方式的跨学科和跨文化特点；5. 研究方法的综合化与研究手段的现代化；6. 研究结果的数量化特征。" },
  { q: "发展心理学理论的发展体现在哪里？", a: "当代发展心理学不仅日益关注气质和情绪等基本的心理学维度，而且日益关注高级的元认知过程，包括儿童对自己及他人的思维、情感和信念的知识，以及儿童对自身的认知及对社会行为的监控和调节。" },
  { q: "发展心理学的价值是什么？", a: "1. 从人类存在的角度说，“认识自己”是其永恒的追求。\n2. 从人类本能的角度说，“发展自己”是其根本需求；\n3. 大量的现实问题需要发展心理学家去解决。" },
  { q: "发展心理学的不稳定因素有哪些？", a: "（1）过分追求数量化和抽象化的倾向；\n（2）研究的内容过分琐碎，仅凭研究者的个人兴趣；\n（3）缺乏理论的整合，只有零散的材料。" },
  { q: "发展心理学的未来走向有哪些？", a: "1. 发展心理学研究中思维方式的变革：\n（1）实现以“学科”为导向的研究模式向以“问题”为导向的研究模式的转变，开展跨学科、跨地区、跨院校的系统性和综合性研究。\n（2）从以实体为中心的研究思路过渡到以系统为中心的研究思路。\n（3）从对心理现象的唯一性确证过渡到对多样性和不确定性的接受与容忍。\n（4）在考察心理现象的因果关系时，由直接的单一线性联系过渡到多维线性联系或非线性联系。\n2. 发展心理学研究方法的趋势：随着科学技术的发展，心理学的研究方法也进一步实现了创新和现代化，研究者要注重掌握最新的研究方法，如脑—基因—行为等多种手段相结合的研究思路等。此外，随着生态化运动的兴起，在发展心理学研究中，现场研究又重新受到重视。\n3. 发展心理学研究内容的趋势：未来发展心理学的研究内容，研究选题的应用性倾向越来越明显。发展心理学家会越来越多地参与到社会生活中去，着重加强应用，提高心理学科为社会服务，尤其是满足国家和社会发展重大需求的能力。\n4. 发展心理学研究中更大范围的整体化趋势：心理学必须进行自我改革，加速发展，实现更大范围的整体化。" },
  { q: "绝对决定论的主要观点是什么？", a: "绝对决定论把遗传与环境完全对立起来，或是强调遗传决定发展，完全否定环境的作用；或是强调环境决定发展，完全否定遗传的作用。\n遗传决定论以优生学创始者高尔顿为代表。他认为个体的发展及其品性早在生殖细胞的基因中就决定了，发展只是内在因素的自然展开，环境与教育仅起引发作用。\n环境决定论以行为主义创始人华生为代表。他认为环境和教育是行为发展的唯一条件。" },
  { q: "共同决定论的主要观点是什么？", a: "共同决定论的代表人物是“福合论”的倡导者斯腾。福合论的核心是：人类心理的发展是既非由遗传的天生素质决定，也非只是环境影响的结果，而是两者相辅相成所造成的。\n格塞尔认为支配发展的因素有两个：成熟和学习。学习与生理上的“准备状态”有关，在未达到准备状态时，学习不会发生，一旦准备好了，学习就会生效，这就是成熟—学习原则。" },
  { q: "相互作用论的主要观点是什么？", a: "相互作用论的观点是当前普遍承认的观点。相互作用论的代表人物是皮亚杰。他假设个体天生有一些基本的心理图式，在个体与外部环境作用时，利用“同化”与“顺应”的机制，不断改变和发展原有的心理图式，最后达到较高层次的结构化，使儿童对环境的适应能力也越来越强。相互作用论的基本论点可以归结为：\n1. 遗传与环境的作用是互相制约、互相依存的。一个因素（遗传或环境）作用的大小、性质依赖于另一因素。\n2. 遗传与环境的作用是互相渗透、互相转化的。有时遗传可以影响或改变环境，而环境也可以影响或改变遗传。\n3. 遗传与环境、成熟与学习对发展的作用是动态的。通常是年龄越小，遗传的影响越大；低级的心理机能受环境制约少，受遗传影响大；越是高级的心理机能（如抽象思维，高级情感）受环境的影响越大。" },
  { q: "什么是关键期？", a: "动物性学家洛伦兹在研究小鸭习性时发现了“印刻”现象，即小鸭将出生后第一眼看到的对象当作自己的母亲，心理学家则将这种“印刻”发生的时期称为动物辨认母亲的关键期。\n心理学家认为，关键期是指人和动物的某些行为和能力的发展有一定的最佳时间，如在此时给予适当的良性刺激，会促使其行为和能力得到更好的发展；反之，则会阻碍发展甚至导致行为与能力的缺失。\n目前研究认为，关键期的缺失对人类发展所造成的负面影响，通常在极端的情况下才难以弥补。对人类大部分心理功能而言，也许用“敏感期”更为合适，即在敏感期内，个体比较容易接受某种刺激的影响，比较容易进行某些形式的学习。" },
  { q: "弗洛伊德的人格基本结构包括哪三部分？", a: "弗洛伊德的人格基本结构包括本我、自我、超我。" },
  { q: "什么是本我？", a: "本我是人格中的生物成分，遵循快乐原则。它是原始的、本能的，在人格深处最难以接近的部分，其基本机能是寻求能满足机体需求的对象，提供能量和动力。本我及其初级过程思维关注的是获得满足，而不管满足的途径是否实际或是否为环境所允许。在心理发展过程中，年龄越小，本我的作用越大。" },
  { q: "什么是自我？", a: "自我是人格的心理成分，遵循现实原则。它是从本我中分化、发展出来的，在现实的基础上满足个体的需要。自我能支配行动，思考过去的经验，计划未来的行动，弗洛伊德称这种合理的思维为二级过程思维。" },
  { q: "什么是超我？", a: "超我是人格中的社会成分，遵循道德原则。它包括良心和自我理想。良心是超我中的惩罚性、消极性和批判性的部分；自我理想是个体为之奋斗的部分。" },
  { q: "本我、自我与超我的关系是什么？", a: "弗洛伊德把自我与本我的关系比作骑士与马的关系，马提供能量，而骑士则指导马朝着他想去的方向前行。因此自我并不妨碍本我，而是帮助本我最终获得快乐的满足。\n超我和自我都是人格的控制系统。自我控制的是本我盲目的激情，以保持机体免受损害；超我有是非标准，力图使本我延迟得到满足，甚至完全不能获得满足。" },
  { q: "弗洛伊德的心理发展阶段说分为哪五个阶段？", a: "弗洛伊德强调人有追求自我快乐的本能，主张心理发展的动力来自于性本能，因此追求性欲的满足就是心理发展的内驱力。他把与生存本能联系并用以满足机体的性的需要的心理能量称为力比多。弗洛伊德以儿童发展的不同时期力比多集中处为标准将儿童的心理发展分为五个阶段。\n1. 口唇期（0~1岁）：口唇期的婴儿力比多发泄的主要动饮区是口腔。通过口腔活动的吮吸、吞咽、咀嚼等等，不仅满足了婴儿饥饿时的需要，而且这些活动本身也提高了性快感。\n2. 肛门期（1~3岁）：肛门期的幼儿主要动饮区从口腔转移到肛门，排泄活动成为力比多发泄的主要途径。肛门期是儿童学会如何获得爱和赞赏的关键时期，如果在这个时期的儿童不能被父母正确对待，人格就会残留恐惧、内疚和蔑视的痕迹，这种残留会导致成人以后存在强迫行为且尖酸刻薄。\n3. 性器期（3~6岁）：性器期以外生殖器为主要敏感区，是最重要的心理性欲阶段。这个时期的儿童在行为上开始有了性别之分，而且对自己的性器官产生兴趣。他们会模仿父母中的同性别者，并以另一位为“性恋”对象。男孩模仿父亲的行为，以母亲为爱恋对象，即“恋母情结”（俄狄浦斯情结，Oedipus complex）；女孩则正相反，即“恋父情结”（伊莱克特拉情结，Electra complex）。这两种情结的顺利解决不仅可以使儿童获得男性或女性的行为风格，还可以把父母亲的道德观念、社会态度内化为儿童自己的东西，使之形成超我。\n4. 潜伏期（6~11岁）：当儿童解决了恋父或恋母情结后，他们的力比多冲动就处于暂时的潜伏状态，性的发展呈现停滞或退化的状态，口唇期、肛门期的感觉，性器期的恋母情结的各种记忆都逐渐被遗忘，儿童的生活逐渐被其他兴趣所填满，如探索自然环境、知识学习、文艺体育活动和同伴交往等。\n5. 青春期（11岁或13岁开始）：进入青春期后，性器官的成熟使儿童的性冲动再次萌发，他们开始对异性产生兴趣，喜欢参加由两性组成的集体活动。这时的个体容易产生对成人的抵触情绪和冲动，但也是从这个时期起，开始摆脱对父母的依赖，成为社会中的独立成员。个体的心理从“自恋”转变到“异性恋”，而异性恋倾向一旦形成后，会持续一生，以后不会再发生根本变化。" },
  { q: "埃里克森的心理发展观与弗洛伊德有什么区别？", a: "精神分析学派的代表人物埃里克森的心理发展观与弗洛伊德的区别在于，他既考虑到生物学的影响，也考虑到文化和社会因素。他认为在人格发展中，逐渐形成的自我在个人与周围环境的交互作用中起着主导和整合的作用。他以人格特征为标准把个体一生划分为8个阶段，同时指出了每一个阶段的主要发展任务。" },
  { q: "埃里克森人格发展八阶段分别是什么？", a: "1. 婴儿期（0~2岁）：婴儿期的发展任务是满足生理上的需要，发展信任感，克服不信任感，体验着希望的实现。生理需要若是得到满足，则会产生基本信任感，反之会产生不信任感，即怀疑感。积极的成果是身体舒适和安全感。\n2. 儿童早期（或称学步期，2~4岁）：儿童早期的发展任务是获得自主感，克服羞怯感和疑虑感，体验着意志的实现。儿童此时已不满足停留在狭窄的空间里，渴望探索新世界。积极的成果是坚持的能力和自主的能力。\n3. 学前期（或称游戏期，4~7岁）：学前期的发展任务是获得主动感，克服内疚感，体验着目的的实现。积极的成果是掌握新任务和主动性。本阶段也称为游戏期，游戏执行着自我的功能，在解决各种矛盾中体现出自我治疗和自我教育的作用。\n4. 学龄期（7~12岁）：学龄期的发展任务是获得勤奋感，克服自卑感，体验着能力的实现。积极的成果是创造力的发展和掌握技能。许多人将来对学习和工作的态度和习惯都可追溯于本阶段的勤奋感。\n5. 青年期（12~18岁）：青年期的发展任务是建立同一感，防止同一感混乱，体验着忠实的实现。积极的成果是自我同一感能力的发展。埃里克森提出了“合法延缓期”的概念，也称为心理的延缓偿付期，他认为这时的青年自觉没有能力持久地承担义务，感到要做出的决断太多太快，因此在做出最后决断之前要进入一种“暂停”的时期，用以延缓承担的义务，以避免同一性提前完结的内心需要。\n6. 成年早期（18~25岁）：成年早期的发展任务是获得亲密感，避免孤独感，体验着爱情的实现。积极的成果是亲密。此时个体需要在自我同一性巩固的基础上获得共享的同一性，才能拥有美满婚姻而获得亲密感，而能否获得亲密感对个体是否能满意地进入社会有重要作用。\n7. 成年中期（25~50岁）：成年中期的发展任务是获得繁殖感，避免停滞感，体验着关怀的实现。积极的成果是关怀后代。这里的繁殖不仅指个人的生殖力，主要指关心和指导下一代成长的需要。\n8. 老年期（成年晚期，50岁以后）：老年期的发展任务是获得完善感，避免失望和厌倦感，体验着智慧的实现。完善感包括长期形成的智慧感和人生哲学，若没有这种感觉则对人生感到厌倦和失望，容易恐惧死亡。" },
  { q: "什么是合法延缓期？", a: "埃里克森提出了“合法延缓期”的概念，也称为心理的延缓偿付期，他认为这时的青年自觉没有能力持久地承担义务，感到要做出的决断太多太快，因此在做出最后决断之前要进入一种“暂停”的时期，用以延缓承担的义务，以避免同一性提前完结的内心需要。" },
  { q: "弗洛伊德和埃里克森的观点比较。", a: "1. 弗洛伊德强调本能的作用，将人格发展局限在母亲—儿童—父亲这个狭隘的三角关系中，特别强调早期经验在人格发展中的重要作用；而埃里克森更强调自我的作用，将人格的发展置于更广阔的社会背景之上，重视社会文化对人格发展的影响。\n2. 弗洛伊德对人格阶段的划分只到青春期，埃里克森则将人格阶段扩大至个体的一生。\n3. 埃里克森理论是对弗洛伊德理论的继承、扩展与修订。" },
  { q: "华生的发展心理学理论主要观点是什么？", a: "华生认为，心理的本质是行为，人的各种心理现象是行为的组成因素，并且都可用客观的刺激—反应公式来论证。华生是名副其实的环境决定论者，这种论断主要体现在两个方面。\n1. 否认遗传的作用。否认行为的遗传作用的理由：\n（1）行为反应由刺激引起，刺激来自客观而不是决定于遗传，因此行为不可能取决于遗传。\n（2）他承认机体在构造上的差异来自遗传，但构造上的遗传不能证明机能上的遗传，构造的未来形式取决于所处环境。\n（3）华生的心理学以控制行为作为研究目的，而遗传不能控制。\n2. 夸大环境和教育的作用。\n（1）华生认为个体在构造上的差异及幼年时期训练的差异足以说明后来个体行为上的差异。\n（2）华生提出教育万能论，他认为健康的婴儿可以被培养成任何职业的成人。\n（3）华生认为学习的先决条件是外部刺激。不管多么复杂的行为，都可以通过控制外部刺激而形成。" },
  { q: "斯金纳的发展心理学理论主要观点是什么？", a: "与华生的刺激—反应心理学的不同点在于，斯金纳区分出应答性行为和操作性行为。应答性行为是指由特定的、可观察的刺激引发的反应行为；操作性行为是指在没有任何能观察到的外部刺激的情境下的有机体的行为。\n1. 行为的强化控制原理：\n（1）塑造：强化作用是塑造行为的基础。儿童偶然的动作若是得到教育者的强化，该动作再次出现的概率就会大于其他动作。强化的次数增多，概率随之增大，这便导致了人的操作性行为的建立。\n（2）强化与消退：强化在行为发展过程中起着重要的作用，行为不被强化就会消退，即得不到强化的行为是易于消退的。只练习而不强化，不会巩固和发展一种行为。\n（3）及时强化：斯金纳强调及时强化，认为强化不及时是不利于人的行为发展的，教育者要及时强化希望在儿童身上看到的行为。\n依照斯金纳的观点，强化可以增加反应的概率，其可分为积极强化（阳性强化）和消极强化（阴性强化）。积极强化是由于一种刺激的加入增进了一个操作反应发生的概率。消极强化是由于一种刺激的排除而加强了某一操作反应的概率。斯金纳建议以消退取代惩罚，提倡强化的积极作用。\n2. 儿童行为的实际控制：\n（1）育婴箱：斯金纳创造了一种照料婴儿的机械装置，即育婴箱。这种设计的思想是要尽可能避免外界一切不良刺激，创造适宜儿童发展的行为环境，养育身心健康的儿童。后来，斯金纳发展了这些思想，写成小说《沃尔登第二》。\n（2）行为矫正：斯金纳操作性行为的思想被大量用于行为矫正，成人应注意不去强化儿童的不良行为。\n（3）教学机器和教学程序：在长期的研究中，斯金纳形成了把学习和机器相联系的思想。于是，最早的辅助教学机诞生了，弥补了教育上的一些不足。" },
  { q: "什么是观察学习？", a: "观察学习是指通过观察他人（榜样）所表现的行为及其结果而进行的学习。相较刺激—反应学习来说，观察学习的学习者可以不必直接做出反应，也不需要亲自体验强化，只通过观察他人在一定环境中的行为，并观察他人接受一定的强化就能完成学习。班杜拉认为，观察学习表现为注意过程、保持过程、运动复现过程和动机过程。强化可以是直接强化，也可以是替代强化，还可以是自我强化。" },
  { q: "社会学习在社会化过程中的作用有哪些？", a: "1. 攻击性：攻击性的社会化也是一种操作条件作用。如当儿童用社会容许的方法表现攻击性时（如球赛或打猎），父母和其他成人就奖励儿童；当儿童用社会不容许的方法来表现攻击性时（如打幼小儿童），则惩罚他们。所以儿童在观察攻击模式时，会注意什么时候的攻击性被强化，并模仿被强化的模式。\n2. 性别化：男女儿童的性别品质大多是通过社会化过程（特别是模仿）来获得的。儿童通过观察学习两性的行为，只是因为在社会强化的情况下，他们通常所从事的仅仅是适合他们自己性别的行为。有时这种社会强化还会影响观察过程本身。\n3. 自我强化：自我强化也是社会学习的结果。儿童从榜样身上学到自我肯定或自我否定的标准，当自身行为达到标准后，就以自己能支配的报酬方式来增强、维持自己的行为。\n4. 亲社会行为：班杜拉认为，呈现适当的亲社会行为（如分享、帮助、合作和利他主义等）模式能够对儿童产生影响。亲社会行为靠训练是没有什么效果的，有时强制的命令一时奏效，事后又反复。只有正确行为模式的影响才更有用，而且持续时间更长。" },
  { q: "维果茨基的文化—历史发展理论是什么？", a: "维果茨基创立了文化—历史发展理论，用以解释人类心理本质上与动物不同的那些高级的心理机能。他认为工具的使用使人适应自然的方式变为物质生产的间接方式，而不再像动物一样用身体的直接方式来适应自然。在人的工具生产中凝结着人类的间接经验，即社会文化知识经验，这就说明制约人类的心理发展规律的不再是生物进化规律，而是社会历史发展规律。" },
  { q: "维果茨基认为发展的实质是什么？", a: "维果茨基认为，心理的发展指的是一个人的心理（从出生到成年）在环境与教育的影响下，在低级的心理机能的基础上，逐渐向高级的心理机能的转化过程。" },
  { q: "什么是高级心理机能？", a: "高级心理机能是在同周围人的交往过程中产生和发展起来的，受人类文化历史所制约。人使用物质工具进行劳动操作，使自己脱离了动物世界。同时使用符号、语言等精神工具进行精神生产，使其心理机能发生质的变化，上升到高级阶段，具有随意性、主动性。" },
  { q: "心理机能由低级向高级发展的标志有哪些？", a: "（1）心理活动的随意机能；\n（2）心理活动的抽象概括机能；\n（3）各心理机能之间的关系不断变化、组合，形成间接的、以符号或词为中介的心理结构；\n（4）心理活动的个性化。" },
  { q: "心理机能由低级向高级发展的原因有哪些？", a: "（1）高级心理机能起源于文化历史的发展，是受社会规律所制约的；\n（2）从个体发展来看，儿童在与成人交往的过程中通过掌握高级的心理机能的工具——语言、符号这一中介环节，使其在低级的心理机能的基础上形成了各种新质的心理机能；\n（3）高级的心理机能是不断内化的结果。" },
  { q: "什么是最近发展区？", a: "维果茨基认为，至少要确定两种发展的水平。第一种是现有发展水平，即儿童独立活动时达到的解决问题的水平；第二种是在有指导的情况下可以达到的解决问题的水平，也就是通过教学所获得的潜力。\n“最近发展区”是指儿童现有发展水平与在成人帮助下可能达到的发展水平之间的差异，即儿童凭借成人的帮助能达到的解决问题的水平与在独立活动中达到的解决问题的水平之间的差异。教学创造着“最近发展区”，表明儿童发展的可能性。" },
  { q: "维果茨基关于教学与发展的关系提出了哪三个重要问题？", a: "在教学与发展的关系上，维果茨基提出了三个重要的问题：\n1. 最近发展区：见上题。\n2. 教学应当走在发展的前面：维果茨基提出“教学应当走在发展的前面”，这是他针对教学与发展关系主要的理论。也就是说，教学可以定义为人为的发展，教学决定着智力的发展，这种决定作用既表现在智力发展的内容、水平和智力活动的特点上，也表现在智力发展的速度上。\n3. 学习的最佳期限：教学如果脱离了儿童学习某一技能的最佳年龄是不利于其发展的，会造成儿童智力发展的障碍。因此，开始某种教学必须以成熟与发育为前提，且必须首先建立在正在开始形成的心理机能的基础上，走在心理机能形成的前面。" },
  { q: "什么是内化学说？", a: "维果茨基是内化学说的最早推出人之一。他指出，教学最重要的特征便是教学创造着最近发展区这一事实，从而学生能通过教学来掌握全人类的经验并内化为学生自身的内部财富。\n内化学说的基础是维果茨基的工具理论。他认为人类的精神生产工具或心理工具是各种符号，学生早年不会使用这类工具，因此其心理活动是直接的、不随意的、低级的、自然的。学生只有掌握语言这个工具之后，心理活动才能转变成间接的、随意的、高级的、社会历史的。高级的、社会历史的心理活动，首先是作为外部形式的活动形成，以后逐渐内化，在头脑中“默默地”进行。" },
  { q: "皮亚杰心理学的理论核心是什么？", a: "皮亚杰心理学的理论核心是“发生认识论”，他认为心理、智力、思维不是起源于先天的成熟或后天的经验，应当是主体的动作，而动作的本质是主体对客体的适应。主体通过动作达到对客体的适应是心理发展的真正原因。他认为适应的本质在于取得机体与环境的平衡，不管是指向外部的动作还是指向内化的思维动作，都是一种适应。\n皮亚杰认为适应是通过同化和顺应实现的，个体通过这两种形式来达到机体和环境的平衡。如果机体和环境失去平衡，个体就需要改变行为以重建平衡。这种不断的平衡—不平衡—平衡—……的过程，就是适应的过程，也就是心理发展的本质和原因。" },
  { q: "皮亚杰认为支配心理发展的因素有哪四个？", a: "皮亚杰认为支配心理发展的因素有四个：（1）成熟；（2）物理因素；（3）社会环境；（4）平衡。" },
  { q: "什么是图式？", a: "图式是心理发展结构的核心概念，是指动作的结构或组织，这些动作在相同或类似环境中由于不断重复而得到迁移或概括。图式最先来自遗传，之后在适应环境的过程中不断改变和丰富，也就是说，低级的动作图式经过同化、顺应、平衡而逐步构成新的图式。" },
  { q: "什么是同化？", a: "同化是指把环境因素纳入机体已有的图式或结构之中，以加强和丰富主体的动作。它只是数量上的变化，不能引起图式的改变或创新。" },
  { q: "什么是顺应？", a: "顺应是指改变主体动作以适应客观变化。它是质量上的变化，促进创立新图式或调整原有图式。" },
  { q: "什么是平衡？", a: "同化与顺应导致的适应，使机体暂时达到平衡，但这只是下一个较高水平的平衡运动的开始。不断发展着的平衡状态，就是整个心理的发展过程。平衡既是发展中的因素，又是心理结构。" },
  { q: "皮亚杰关于发展阶段的观点有哪些？", a: "1. 心理发展过程是连续的，但由于各种发展因素的相互作用，儿童心理发展具有阶段性。\n2. 各阶段都有它独特的结构，标志着一定阶段的年龄特征。由于各种因素如环境、教育等的差异，阶段可以提前或推迟，但先后次序不变。\n3. 各阶段的出现，从低到高有一定的次序，且有一定的交叉。\n4. 每个阶段都是形成下一个阶段的必要条件。前一阶段的结构是构成后一阶段的结构的基础，但前后两个阶段有质的差异。\n5. 在心理发展过程中，两个阶段之间不是截然划分的，而是有一定的交叉。\n6. 心理发展的一个新水平是许多因素融合而成的新结构，各种发展因素由没有系统的联系逐步组成整体。" },
  { q: "皮亚杰心理发展的四个阶段是什么？", a: "皮亚杰以主体适应环境的主导方式，即认知结构的性质为依据，把儿童心理发展划分为四个阶段：\n1. 感知运动阶段（0~2岁）：感知运动阶段的儿童智力活动处于感知运动水平，主要凭感知运动手段反映外界刺激，协调并适应外界环境。这个阶段的儿童形成了客体永久性意识，此外，他们对自我和外物的概念也有了初步的理解。\n2. 前运算阶段（2~7岁）：前运算阶段开始的标志是儿童可以将未出现在当前情境中的客体和事件表征为心理图片、声音、表象、单词或其他形式，表象思维与直观形象思维成为该阶段的主导。这个阶段的儿童智力活动处于表象水平，他们有运用符号的能力，他们的思维不可逆，未掌握守恒概念，具有自我中心的特点，还具有泛灵论的倾向，即倾向于将活动着的任何物体都视为有生命的。\n3. 具体运算阶段（7~12岁）：具体运算阶段的儿童智力活动处于获得概念稳定性，进行逻辑思维的阶段。他们对具体问题可以进行逻辑运算，思维具有可逆性，且发展了去中心化。可逆性和去中心化的出现表明儿童已经有了守恒概念，守恒是具体运算阶段的一个主要标志。\n4. 形式运算阶段（12~15岁）：形式运算阶段的儿童智力活动达到抽象逻辑思维阶段，这个阶段儿童的思维形式可以从具体内容中解脱出来，能够提出假设，凭借演绎推理、归纳推理解决抽象问题。" },
  { q: "什么是客体永久性？", a: "客体永久性是指儿童理解了物体是作为独立实体而存在的，即使个体不能知觉到物体的存在，它们仍然是存在的。" },
  { q: "格塞尔的成熟势力说的主要观点是什么？", a: "美国心理学家格塞尔利用双生子爬楼梯的实验证明：儿童的学习取决于生理上的成熟，成熟之前的学习与训练难有显著的效果。格塞尔认为，成熟是通过从一种发展水平向另一种发展水平突然转变而实现的，发展的本质是结构性的。儿童在成熟之前，处于学习的准备状态。所谓准备，是指由不成熟到成熟的生理机制的变化过程，只要准备好了，学习就会发生。\n学习和成熟对心理发展所起的作用是不同的，成熟是一个内部因素，决定着心理发展的方向和模式，而学习是一个外部因素，对个体的发展不起决定作用。没有足够的成熟，就没有真正的发展与变化；脱离了成熟的条件，学习本身并不推动发展。通过对儿童行为的观察与归纳，格塞尔总结出三个重要的观点：\n1. 发展是遗传因素的主要产物；\n2. 在儿童成长过程中，较好的年头与较差的年头（即发展质量较高与较低）有序地交替；\n3. 在儿童的身体类型和个性之间有明显的相关。" },
  { q: "什么是双生子爬楼梯实验？", a: "格塞尔让一对同卵双胞胎在不同时间学爬楼梯，其中一个在出生的第48周开始，另一个在第53周开始，结果在第55周时发现两人的爬楼梯水平一样好。将试验领域推广至其他年龄段和其他事例，得出了相似结论，即任何一项训练或教育内容针对某个特定的受训对象，都存在一个“最佳教育期”。" },
  { q: "布朗芬布伦纳的生态系统理论包括哪几个系统？", a: "生态系统理论由布朗芬布伦纳提出，强调发展的个体嵌套于一系列相互影响的环境系统之中，在这些系统中，个体与系统相互作用并相互影响。\n1. 微观系统：指个体活动与交往的直接环境（如家庭、学校），这个环境是不断变化发展的。\n2. 中间系统：指各微观系统之间的联系或相互关系。如果微观系统之间有较强的积极联系，发展可能实现最优化。\n3. 外层系统：指个体并未直接参与却对他们的发展产生影响的系统（如父母的工作环境）。\n4. 宏观系统：个体所处的大的或者亚文化的环境，包括文化价值观、法律、习俗等。\n5. 时间系统：是模型中的时间维度，它强调生态环境中的任何变化都会影响个体的发展。" },
  { q: "发展心理学研究的功能有哪些？", a: "1. 描述：描述研究对象的特点和发展状况是发展心理学研究最基本的目的。\n2. 解释：对发展心理现象的活动过程与特点的形成原因、发展变化以及相互关系等做出说明。\n3. 预测：根据研究形成的某一科学理论，通过一系列的逻辑推理，对研究对象以后的发展变化和在特定情境中的反应做出推断。\n4. 控制：根据科学理论操纵某些变量的决定条件或创设一定的情境，使研究对象产生理论预期的改变或发展。这是发展心理学研究的最高目标。" },
  { q: "发展心理学研究的特殊性有哪些？", a: "（1）年龄是一个特殊的自变量；\n（2）研究对象的年龄跨度大。" },
  { q: "发展心理学研究的原则有哪些？", a: "1. 客观性原则：在人的心理发生发展的研究中，我们必须坚持客观的标准，对每个被试的心理与行为表现，每个数据和个案，都要做出实事求是的具体分析，决不从“预期”出发。\n2. 特殊性原则：在研究人的心理发展的一般事实和规律的同时，我们也应当考虑到心理发展的特殊事实和个别差异，而不应当把一般和个别绝对对立起来。此外，我们在研究个体心理发展时，应考虑到心理发展的不平衡性，克服研究中的片面性和表面性，注意全面地分析心理发展的问题。\n3. 教育性原则：发展心理学的任何研究，都必须从伦理学的角度，认真考虑是否有利于被试的身心健康，有利于促进被试的心理发展。\n4. 生态化原则：在心理发展研究中，我们应该将被试放到现实的社会环境中加以考察，从他们和社会的相互作用中，从社会环境中各因素的相互作用中，揭示他们心理变化的规律。" },
  { q: "什么是横断研究设计？其优缺点是什么？", a: "横断研究设计是在某一特定的时间，同时对不同年龄的被试进行比较的研究设计。研究者可以通过选取生理成熟度不同的群体或不同年龄阶段的群体，来研究某一个特定发展领域在不同年龄的发展状况。\n1. 优点：\n（1）能够在短时间内发现同一年龄或不同年龄群体发展的相似性和差异性，确定发展的年龄特征。\n（2）由于能够同时对几个年龄群体进行调查测量，获得的信息量大，经济且费时短。\n2. 缺点：\n（1）横断研究设计所关注的年龄效应可能会与代替效应（同辈效应）相混淆。代替效应（同辈效应）是指由于个体出生在特定时期并成长在特定历史情境中所带来的对个体发展研究的干扰效应。\n（2）由于在横断研究设计中每个人只在某个时间点上接受测查，因而无法获得个体发展趋势或发展变化的数据资料。" },
  { q: "什么是纵向研究设计？其优缺点是什么？", a: "纵向研究设计也叫追踪研究设计，是对同一研究对象在不同的年龄或阶段进行长期反复观测的研究设计。\n1. 优点：能系统地、详尽地了解心理发展的连续过程和从量变到质变的规律。\n2. 缺点：\n（1）随着研究时间的延续，部分被试可能会因各种原因退出研究，从而造成样本的流失。\n（2）反复测查可能影响被试的发展，影响被试的情绪，从而影响到某些数据的可靠性。\n（3）花费大而且耗时，长期追踪要经历时代、社会、环境的变化，这通常会造成变量的增多。" },
  { q: "什么是聚合交叉设计？其优缺点是什么？", a: "聚合交叉设计是将横断研究设计和纵向研究设计融合在一起的研究设计。研究者选择不同年龄的群体为研究对象，在短时期内重复观察这些对象。与横断研究设计和纵向研究设计相比，聚合交叉设计具有这两种方法单独实施无法取得的效果。\n1. 优点：\n（1）既具有纵向研究设计系统、详尽的特点，又具有横断研究设计能够进行大面积测查的特点。\n（2）采用了动态和静态相结合的原则，缩短了长期追踪的研究时间。\n2. 缺点：存在理论是否可推广到其他群体的问题。" },
  { q: "什么是微观发生学设计？其优缺点是什么？", a: "微观发生学设计是通过在短时间内重复给被试呈现一个诱发变化的刺激或提供学习的机会，观测个体发生变化的过程的研究设计。微观发生学从微观的角度关注发展的发生，即在某个短时间内观测发展的实时变化。观测时间通常是一个非常短的（数周、数月）、快速变化的发展期。\n1. 优点：\n（1）它关注研究对象一系列行为发生的细节，观测一段时间内的快速变化，使得研究者能够直接观测发展变化的过程，能够描述变化如何发生，以及变化的数量和性质。\n（2）由于进行密集的观测，微观发生学设计使得研究者能够在研究的年龄范围内追踪特定行为的个体发展轨迹，这有助于确定从一种行为模式到另一种行为模式的转折点。\n（3）它使得研究者能够观察到个体的内部差异，即能够找到不同时间和不同条件下个体行为的稳定性和不稳定性。\n（4）能够确定变化最有可能发生的条件，有助于探索发展变化的原因。\n2. 缺点：\n（1）需要对被试进行逐个观察、逐点记录，耗时费力，因此被试的数量有限。\n（2）它只适用于动机强的被试。\n（3）尽管观察频率高，数据丰富，但某些情况下，研究者仍旧难以分清被试已具备的能力和变化后的能力。" },
  { q: "双生子研究的优缺点是什么？", a: "双生子研究是通过比较同卵双生子和异卵双生子之间在某种行为特征上的相似性，探索遗传和环境对这种行为特征的影响程度。此方法多用于智力、人格的研究。\n1. 优点：\n（1）同卵双生子具有相同的基因，他们之间的任何差异都可以归结为环境因素的作用。\n（2）异卵双生子基因不同，但在环境上有许多相似性，因此也提供了环境控制的可能性。\n2. 缺点：\n（1）只孤立地考虑遗传和环境因素的影响，未考虑到两者动态的交互作用。\n（2）不能人为制造在不同生长环境下的双生子，因此较难寻找到合适的被试。" },
  { q: "基因研究设计的主要趋势是什么？", a: "（1）采用大样本和多个独立样本，保证行为特质全基因组关联研究的可重复性和稳固性。\n（2）通过整合基因—环境—脑—行为研究，深入揭示先天与后天对心理发展与脑发育的影响。" },
  { q: "发展心理学研究方法的新趋势有哪些？", a: "1. 多层面和多学科研究相互整合：\n（1）多层面研究的整合：通过使用多种研究方法和技术，将社会环境层面、遗传和基因分子层面、神经机制层面以及个体人格、心理、行为层面的研究结合起来，开展环境—基因—脑—行为多层面研究，加深人们对于发展现象和问题的理解。\n（2）多学科研究的整合：①发展心理学与心理学领域内其他分支学科的结合，主要涉及发展心理学与认知心理学、生理心理学、社会心理学等不同分支学科的结合；②发展心理学与心理学领域以外各有关学科的结合，主要涉及发展心理学与认知神经科学、分子遗传学、分子影像学等多门学科的相互整合。\n2. 多变量统计方法大量使用：除了传统的多变量统计方法，如回归分析、复方差分析、因子分析、判别分析、聚类分析等大量出现在心理学研究报告中，新的多变量统计技术和方法，如结构方程模型、多水平线性模型、成长曲线模型等也被越来越多地应用于发展心理学的研究中。\n3. 新的数据收集手段广泛使用：互联网和信息科学技术的快速发展，不仅改变了人们的生活方式，同时也丰富了发展心理学学术研究的数据来源。此外，随着智能手机设备的普及，一些研究者开始利用手机等便携式移动终端进行数据的收集，并通过互联网来进行管理。\n4. 训练研究和教育实验越来越受重视：通过训练研究和教育实验，可以获得有关个体真实发展的资料，并且可以通过操作某些变量来观察个体的发展变化，把握促进个体心理发展的环境和教育条件，从而可通过预先的设置和干预促进个体朝着预期的方向发展。" },
  { q: "胎儿宫内发育分为哪几个阶段？", a: "胎儿是指从受孕到从子宫娩出之前的小儿。斯滕伯格将个体出生前的发育期划分为胚芽期（0~2周）、胚胎期（3~8周）和胎儿期（8~40周）。" },
  { q: "胎儿心理活动主要物质基础的形成和发育有哪些？", a: "1. 神经元：在胚胎发育期，神经元的生长主要是数量增多。在胚胎期的后期，神经元的生长则主要是细胞的增大和轴突的分支以及髓鞘的形成。\n2. 神经系统：中枢神经和周围神经在孕三周时即开始形成，胎儿初期神经系统的发育是快速进行的神经纤维的形成。到妊娠8周末，神经系统的大体结构已基本形成。\n3. 反射机能：在胎儿8周左右，反射活动所必需的解剖结构已经形成。3个月的胎儿已经出现巴宾斯基反射、吸吮反射、抓握反射。" },
  { q: "胎儿生理和心理发展的影响因素有哪些？", a: "1. 遗传因素：遗传是指生物体的各种性状特征通过生殖过程一代代传递下去的现象。遗传通过染色体和基因的传递实现。\n2. 表观遗传：表观遗传是指由非DNA序列改变引起的、可遗传的基因表达水平的改变。表观遗传是遗传信息和环境因素之间的桥梁，胎儿发育的过程就是表观遗传不断修饰，产生特意表型编码的过程。\n3. 环境因素：环境因素主要包括物理因素、化学因素、生物因素和地理因素几个方面。\n4. 母体因素：母体因素主要包括情绪、应激、营养和患病等。\n5. 父源因素：父源因素主要包括年龄、疾病及药物、肥胖、生活方式、环境暴露因素等。" },
  { q: "胎儿期心理卫生的机理是什么？", a: "正常孕妇在保证充足的营养和适当休息的条件下，从胎龄满6个月后开始对胎儿实施每天定时的声、光、触摸刺激，使胎儿的听觉神经通路、视觉神经通路、触觉神经通路所产生的神经冲动在大脑细胞间传递，这些通路上的细胞得以伸展出更多的树突，以促进它们和周围的锥体细胞建立传递信息的突触联系。胎教的实质是在产前对胎儿大脑生长发育的一种来自于环境的干预，目的是促进胎儿大脑神经网络的丰富化。" },
  { q: "胎儿期心理卫生的种类有哪些？", a: "主要有音乐胎教、抚摸胎教、言语胎教、光照胎教。" },
  { q: "婴儿大脑形态的发展表现在哪些方面？", a: "1. 脑重与头围：婴儿大脑从胚胎时期开始发育，出生时已重达350~400克，是成人脑重的25%；在36个月时，婴儿的脑重接近于成人脑重范围。婴儿刚出生时头围已达到34厘米左右，大约是成人头围的60%，12个月时达到46~47厘米，24个月时达到48~49厘米。此后增长速度变慢，10岁时才达52厘米。\n2. 大脑皮质：胎儿6或7个月时，脑的基本结构已经具备。到2岁时，脑及其各部分的相对大小和比例已基本上类似于成人大脑。" },
  { q: "婴儿大脑的功能发展表现在哪些方面？", a: "1. 脑电：5个月胎儿已显示出脑电活动，8个月以后则呈现出与新生儿相同的脑电图，脑电活动开始具有连续性和初步的节律性，形成睡眠和觉醒的脑电图。其中，同步节律波α波常作为婴儿脑成熟的标志。\n2. 皮质中枢：婴儿大脑是按照其基因结构的顺序而发展的，遵循着头尾原则和近远原则。在婴儿脑的发育过程中，脑干是发展速度最快的区域。\n3. 大脑单侧化：在新生儿阶段就能观察到某种大脑单侧化的倾向，但这种倾向只表明两半球在功能上存在着量的差异，而非质的区别。" },
  { q: "后天环境影响与婴儿脑的发展是什么？", a: "婴儿大脑发展在很大程度上受后天环境的影响和制约，婴儿后天受到的对其身体及神经系统的刺激影响其大脑相应区域的生长。\n1. 婴儿脑的可塑性：在生命早期，大脑的发展并不单纯是成熟程序的展开，而是生物因素和早期经验两者结合的产物。婴儿脑的大小和功能都受其后天经验的影响和制约。在突触形成处于高峰的时期，婴儿大脑所受到的恰如其分的刺激对这一过程的进行是至关重要的。\n2. 婴儿脑的修复性：在婴儿早期，大脑具有良好的修复性。一般来说，脑损伤是难以弥补的，其原因之一就是脑细胞的生长不同于身体其他细胞的生长，一旦完成就不会再增殖。但是，婴儿大脑可以通过某种类似学习的过程而获得一定程度的修复。一侧半球受损后，另一侧半球可能会产生替代性功能。" },
  { q: "婴儿动作发展的规律有哪些？", a: "婴儿各种运动、动作的发展是其活动发展的直接前提，也是其心理发展的外在表现。婴儿的动作发展遵循以下规律：\n（1）整分原则，从整体性动作到分化性动作；\n（2）头尾原则，从上身到下身（先会爬，然后才会走）；\n（3）大小原则，从大肌肉到小肌肉（先会抓，然后才会捏）；\n（4）近远原则，从躯干到四肢。\n婴儿的主要动作是手的抓握和独立行走。手的抓握机能发展的要点是五指分化和手眼协调。独立行走是婴儿发展的一个重要的里程碑。到婴儿末期，独立行走变得熟练和自如，这使婴儿的行动由被动转变为主动，使行动具有了相当的主动性，明显地扩大了认知范围，增加了与人交往的主动性。" },
  { q: "影响动作发展的因素有哪些？", a: "1. 成熟：格塞尔认为支配儿童心理发展的是成熟和学习，其中成熟是由遗传决定的，学习是后天经验的获得和行为的变化。儿童生理上由不成熟变为成熟的过程，是为学习做准备的过程。在生理成熟之前训练儿童去学习和掌握某种技能，效果欠佳甚至无效，一旦准备好，学习就会生效，即学习依赖于成熟所提供的准备状态。\n2. 学习与教育：学习为个体提供必要的刺激与经验，对个体的动作发展有一定的促进或阻碍作用。\n3. 营养与健康：营养不良或营养过剩对儿童生理上的影响，会直接表现在动作发展上。\n4. 环境因素：环境对个体动作发展的影响表现在形成和发展出与特定气候、文化背景等相适应的行为动作。" },
  { q: "动作发展的重要意义是什么？", a: "1. 个体心理的起源与动作密切相关。\n2. 从个体心理的发展历程上看，个体的心理发展是由外逐步内化的，而动作在心理的内化过程中起着关键性的作用，即动作是个体心理不断内化的基础。\n3. 从个体心理发展的生理基础以及心理各个具体方面的早期发展来看，动作作为主体能动性的基本表现形式，在个体早期心理发展中起着重要的建构作用，它使个体能够积极地构建和参与自身的发展。具体表现在以下方面：\n①动作对大脑的发育具有促进作用；\n②动作使个体对外部世界各种刺激及其变化更加警觉，并使感知觉精确化；\n③动作使婴儿的认知结构不断地改组和重建；\n④动作改变着个体与物理环境、社会环境的互动模式，使个体从被动接受环境信息变为主动获取各种经验，这既促进了个体自主性、独立性的发展，同时也深刻地影响着个体的社会交往特点，进而对个体的情绪、社会知觉、自我意识等也产生了重要的影响。" },
  { q: "什么是视崖实验？", a: "视崖实验是吉布森和沃克用来证明婴儿深度知觉的一个著名的心理学实验。“视崖”是研究深度知觉的装置，这种装置是一张由隔板分为两半且上表面为透明玻璃的大桌子，隔板一侧，图案就在玻璃底下，类似于“浅滩”；另一侧则为具有一定深度的“悬崖”，即图案与上面的玻璃之间相隔一定的距离。将能够爬行的婴儿置于视崖上，多数婴儿表现出逃避“悬崖”的倾向。视崖实验证明6个月的婴儿已经具备了深度知觉，对于“悬崖”感到害怕，而小于6个月的婴儿已经开始注意到深和浅的差别，但并不害怕，例如2个月的婴儿置于视崖深侧时，其心率降低的程度大于他们处于浅侧时的程度。" },
  { q: "什么是习惯化与去习惯化？", a: "习惯化与去习惯化是一种广泛使用于婴儿认知研究的实验范式。\n1. 习惯化：即婴儿对一个重复出现的刺激逐渐熟悉，兴趣下降。\n2. 去习惯化：当刺激发生变化时，婴儿再次对刺激感兴趣，该程序既说明差异辨别的存在，也表明偏好的存在（对新异刺激的偏好）。" },
  { q: "婴儿注意的发展表现在哪些方面？", a: "婴儿期注意的发展，主要表现为注意选择性的发展。3到6个月的婴儿的视觉注意能力在原有基础上进一步发展，平均注意时间缩短，探索活动更加主动积极，而且偏爱更加复杂和有意义的视觉对象。6个月以后婴儿的睡眠时间减少，白天经常处于警觉和兴奋状态，这时注意以更广泛和更复杂的形式表现在日常感知活动中。\n婴儿的共同注意随着年龄的增长而逐步提高，在9个月左右有了显著的变化，但在1岁以前，该能力的发展水平都较低。共同注意是一种较复杂的社会认知能力，它的发生包含一系列分化与协调的过程。" },
  { q: "言语发展的理论有哪些？", a: "言语发展理论是解释年幼儿童如何在短短几年内就掌握非常复杂的语法规则的理论。\n1. 先天论：乔姆斯基的转换生成说。\n（1）语言是利用规则去理解和创造的，而不是通过模仿和强化得来的。\n（2）语法是生成的。婴儿先天具有一种普通语法，言语获得过程就是由普通语法向个别语法转化的过程。这一转化是由先天的语言获得装置（LAD）实现的。\n（3）每一个句子都有其深层和表层结构。句子的深层结构（语义）通过转换规则变为表层结构（语音等），从而被感知和传达。\n该理论过于强调天赋和先天性，低估了环境和后天教育的作用，忽视了语言的社会性。\n2. 后元论：\n（1）强化说：巴甫洛夫和斯金纳都认为，言语的获得就是条件反射（无论是操作性还是经典性）的建立，而强化在这一过程中起着非常重要的作用。\n（2）模仿说：奥尔波特认为，婴儿语言只是对成人语言的模仿，是成人语言的简单翻版。班杜拉认为，婴儿主要是通过对各种社会言语模式的观察学习（即模仿学习）而获得言语能力的，其中大部分是在没有强化的条件下进行的。怀特赫斯特进一步提出“选择性模仿”，认为婴儿对成人言语的模仿是有所创造和选择的。\n3. 认知学说：皮亚杰认为语言是儿童的一种符号功能，源于智力并随认知结构的发展而发展。认知起源于主客体之间的相互作用，在这种相互作用的过程中，动作的发展与协调导致逻辑的产生，由此才导致了语言的产生。也就是说，语言并非构成逻辑的根源，恰恰相反，语言乃是由逻辑所构成。\n4. 相互作用论：相互作用论强调内部经验和环境输入之间的相互作用，强调语言学习的社会语境。该理论认为，言语的发展是生理成熟、认知发展与不断变化的语言环境之间复杂的相互作用的结果。" },
  { q: "婴儿言语发展阶段有哪些？", a: "1. 前言语阶段（0~12个月）：从婴儿出生到第一个具有真正意义的词产生之前的这段时期。在此期间，婴儿出现咿呀学语、非语言性声音与姿态交流等现象，统称为前言语现象或前言语行为。\n2. 言语的发生（大约1岁）：说出第一个具有真正意义的词，具有很强的场合约定性，但存在较大的个体差异。\n3. 单词句时期（1~1.5岁）：主要发展对言语的理解，儿童往往用一个词代表一个句子。\n4. 简单句时期（1.5~2岁）：词汇量迅速增加，能说出不完整的双词句或多词句。\n5. 复合句时期（2~3岁）：20~30个月是掌握语法的关键时期，简单句日益完整，复合句开始发展，36个月已经基本掌握了母语的语法规则。" },
  { q: "什么是气质？", a: "气质是婴儿出生后最早表现出来的一种较为明显而稳定的个人特征，是在任何社会文化背景中父母最先能观察到的婴儿的个人特点。气质类型是指表现在人身上的一类共同的或相似的心理活动特性的典型结合。" },
  { q: "气质的类型有哪些？", a: "1. 传统的四类型说：\n（1）多血质：感受性较弱，反应性、兴奋性、平衡性很强；可塑性大，外倾，爱交际；灵活性高，反应速度快。\n（2）胆汁质：感受性很弱，反应性和主动性很强，兴奋比抑制占优势；刻板，外倾；情绪兴奋性强，反应速度很快，不灵活。\n（3）黏液质：感受性很弱，反应性很弱，主动性很弱，不灵活，内倾；情绪兴奋性弱，反应速度缓慢。\n（4）抑郁质：感受性很强，反应性和主动性弱；刻板，内倾；兴奋性强；情绪抑郁，反应速度缓慢，不灵活。\n2. 巴甫洛夫的高级神经活动类型说：巴甫洛夫认为，高级神经活动三种基本特性的不同结合，可以形成四种高级神经活动类型，它们分别是：弱型——抑郁质；强而不平衡型——胆汁质；强而不灵活型——黏液质；强而灵活型——多血质。\n3. 托马斯、切斯的三类型说（最有代表性）：\n（1）容易型：生理机能有规律；容易适应新环境，接受新事物；一般有愉快的情绪，爱玩，对成人的交往反应积极。\n（2）困难型：生理机能缺乏规律；接受新刺激、新事物比较慢；情绪不好，难以接受成人的爱抚，亲子关系疏远。\n（3）迟缓型：活动水平低，反应弱；逃避新事物、新环境，适应变化慢；情绪总是消极，不甚愉悦。\n4. 巴斯的活动特性说：\n（1）情绪性婴儿：通过行为或心理生理变化而表现出悲伤、恐惧或愤怒的反应。\n（2）活动性婴儿：总是忙于探索外在世界和做一些大肌肉运动，乐于并经常从事一些运动性游戏。\n（3）社交性婴儿：愿意与不同的人接触，不愿独处，在社交交往中反应积极。\n（4）冲动性婴儿：活动、情绪都不稳定而多变化，冲动性强。\n5. 卡根的抑制—非抑制说：\n（1）抑制型：拘束克制、谨慎小心和温和谦让。\n（2）非抑制型：无拘无束、自由自在、精力旺盛。\n6. 布雷泽尔顿的气质三类型说：\n（1）活泼型：这种类型的婴儿是“连哭带斗”地来到人世的，等不及任何外界刺激就开始呼吸和哭喊。\n（2）安静型：这类婴儿从出生时起就不活跃。他们安静，动作柔和、缓慢，很少哭。\n（3）一般型：这类婴儿介于前两者之间，大多数婴儿属于这一类。" },
  { q: "气质的稳定性与可变性是什么？", a: "气质的最主要特征之一是具有相对稳定性，气质是一定时期和条件下变化最为缓慢的个性心理特征。但气质并不是一成不变的，这是因为婴儿的神经系统和心理活动都处在发展变化过程中，后天环境和教育的影响也是至关重要的，这种先天和后天因素相互作用的结果导致婴儿气质的稳定性和可变性，也表现为气质发展的连续性和不连续性。" },
  { q: "不同气质类型婴儿对应的教养要求是什么？", a: "气质一方面对儿童生理发展有重要影响，另一方面对儿童认知发展、情绪控制和行为调节等方面的发展均具有有效的预测作用。婴儿气质对早期教养的影响主要体现在不同气质类型的婴儿对早期教养的适应性和要求不尽相同。\n（1）容易型婴儿对各种教养方式都容易适应。但这种容易适应性也会导致一些行为问题的发生。\n（2）困难型婴儿的父母从一开始就面临着早期教养和亲子关系的问题，只有特别热情耐心、有爱心地对待这些孩子，全面考虑他们的气质特点，积极采取适合其特点的针对性措施，才能使他们健康、良好地适应、发展。\n（3）迟缓型婴儿教养的关键，在于让他们按照自己的速度和特点去适应环境，顺其自然。" },
  { q: "什么是拟合优度模型？", a: "研究发现，婴儿的气质会随着年龄的增长而变化，这说明环境并非总是支持某种气质类型。托马斯和切斯提出了拟合优度模型来描述气质与环境因素是怎样共同作用，对儿童发展产生良好结果的。他们认为，气质类型形成，关键在于父母的教养方式是否与儿童的气质特点相符合。父母养育和孩子的气质不一致，称为拟合劣化，它会助长孩子的抵抗性和充满冲突的人格。\n气质与父母教养方式的拟合优度模型提示我们：每个婴儿都是带着独一无二的气质来到这个世界上的，气质无好坏之分。父母所要做的就是提供适合儿童发展的成长环境，给他们以成长的力量，帮助他们迎接成长的挑战。" },
  { q: "最初的情绪反应是什么？", a: "儿童出生后即有情绪表现，如新生儿或哭，或静，或四肢蹬动。同时，初生婴儿的情绪反应就已是初步分化的。但是，儿童最初的这种情绪反应大多是先天性的，是遗传本能，且与儿童生理需要是否满足直接相关。因此，它们是最原始的情绪反应。" },
  { q: "自我意识情绪主要包括哪几种？", a: "自我意识情绪也叫自我意识评价情绪，是比基本情绪更加复杂的一类情绪，是对自我逐渐产生认知，形成自我表征，并通过自我评价或他人评价而产生的一类情绪。自我意识情绪在激发人类思想、情感和调节行为等方面都有重要的作用。\n自我意识情绪主要包括以下几种：\n（1）尴尬：是当个体觉察到自己违反了社会规则或出乎意料地被迫成为他人关注的焦点时，所产生的一种暂时性的慌乱、窘迫的情绪。婴儿的尴尬在19~23个月发生。\n（2）自豪：是当积极事件或成功事件发生时，个体将注意指向自我，对事件的结果进行积极的自我表征，从而体验到的一种愉悦情绪。婴儿的自豪在27个月发生。\n（3）羞耻：是个体在行为与社会标准或自我期望不一致时，所产生的一种沮丧、痛苦的情绪。婴儿的羞耻在29~35个月发生。\n（4）内疚：是当个体觉察到自己做错了事情或伤害了别人，感到局促不安，同时倾向于向受害者道歉或采取某些措施来弥补自己犯下的错误时所产生的情绪。婴儿的内疚一般从27个月开始出现。" },
  { q: "婴儿情绪社会化表现在哪些方面？", a: "1. 社会性微笑：社会性微笑是婴儿情绪社会化的开端，约5周开始，婴儿能区分人和其他非社会性的刺激，对人的声音、面孔开始有特别的反应，大人的声音、面孔特别容易引起婴儿的微笑。婴儿社会性微笑的发展阶段：\n（1）0~5周：反射性微笑，不是社会性微笑。\n（2）5周~3.5月：无差别的社会性微笑。\n（3）3.5月左右：出现有差别、有选择的社会性微笑。\n（4）4个月之后：婴儿对主要抚养者母亲笑得最多、最频繁，其次是对家庭其他成员和熟人，最后是对陌生人，对陌生人笑得最少。\n2. 陌生人焦虑：陌生人焦虑是指婴儿能很好地把主要抚养者母亲和陌生人区分开来，陌生人的出现便会引起婴儿的恐惧、焦虑。一般在婴儿6~8个月时发生。\n3. 分离焦虑：分离焦虑即婴儿与某个人产生了亲密的情感联结后，又要与之分离，就会伤心、痛苦，拒绝与之分离。一般在婴儿6~7个月时发生，随着母婴依恋的建立而同时发生。分离焦虑的产生与以下因素有关：\n（1）与提取记忆的能力、比较过去和现在的能力、预期可能在最近发生的事件的能力有关。\n（2）与婴儿应付情境的能力有关。当母亲离开时，婴儿认识到自己正处于一个不同寻常的情境，但自身没有好的应对方法，不知如何做出积极、有控制性的反应以改变情境。\n（3）与婴儿和母亲分离时的即时情境有关。当母亲离开时，婴儿处于一个陌生而不熟悉的环境，或与一个陌生人而不是熟悉的人在一起，更容易产生焦虑。\n4. 情绪的社会性参照：情绪的社会性参照是指当婴儿处在陌生的、不能肯定的情境时，他们往往从成人的面孔上搜寻表情信息，然后再采取相应的行为或做出相应的反应。情绪的社会性参照是婴儿情绪社会化的一种重要现象和过程，充分显示了情绪的信号作用和人际通信交往功能，是情绪社会化的重要方面。" },
  { q: "什么是依恋？其发展阶段有哪些？", a: "依恋是指婴儿与主要抚养者（通常是母亲）之间最初的社会性联结，也是情感社会化的重要标志。心理学家鲍尔比、安斯沃斯等人将其发展过程分为以下四个阶段：\n1. 无差别的社会反应阶段（从出生到3个月）：这个时期的婴儿对人的反应的最大特点是不加区分、无差别的反应。此时的婴儿还未有对任何人（包括母亲）的偏爱。\n2. 有差别的社会反应阶段（3~6个月）：这时婴儿对人的反应有了区别，对人的反应有所选择，对母亲和其他所熟悉的人及陌生人的反应是不同的，更为偏爱母亲。\n3. 特殊的情感联结阶段（6个月~2岁）：从6个月起，婴儿对母亲的存在更加关切，特别愿意与母亲在一起，当她离开时则哭喊不让离开，别人不能替代母亲。母亲回来时，婴儿马上显得十分高兴。这一切显示婴儿出现了明显的对母亲的依恋，形成了专门的对母亲的情感联结。\n4. 目标调整的伙伴关系阶段（2岁以后）：这时，婴儿把母亲作为一个交往的伙伴，并认识到她有自己的需要和愿望，交往时双方都应考虑对方的需要，并适当调整自己的目标。这时婴儿与母亲空间上的邻近性逐渐变得不那么重要。" },
  { q: "婴儿依恋的类型有哪些？", a: "安斯沃思等通过陌生情境研究法，根据婴儿在陌生情境中的不同反应，认为婴儿的依恋存在三种类型。\n1. 安全型依恋：这类婴儿与母亲在一起时，能安逸地操作玩具，并不总是依偎在母亲身旁，更多的是看着母亲、对母亲微笑或与母亲有距离地交谈。母亲在场使婴儿感到足够的安全，能在陌生的环境中进行积极的探索和操作，对陌生人的反应也比较积极。当母亲离开时，婴儿明显表现出苦恼、不安；当母亲回来时，婴儿会立即与母亲接触，并且很容易经母亲抚慰而平静下来。\n2. 回避型依恋：这类婴儿对母亲不在场都无所谓。母亲离开时，他们并不表示反抗，很少有紧张、不安的表现；当母亲回来时，也往往不予理会，自己玩自己的。\n3. 反抗型依恋：这类婴儿在母亲要离开前就显得很警惕，当母亲离开时表现得非常苦恼、极度反抗，任何一次短暂的分离都会引起大喊大叫。但是当母亲回来时，他们对母亲的态度又是矛盾的，既寻求母亲的接触，但同时又反抗与母亲的接触。\n安全型依恋为良好、积极的依恋；回避型和反抗型依恋又被称为不安全型的依恋，是消极、不良的依恋。\n后来，一些研究者发现了第四种类型的依恋——混乱型。这类婴儿是混乱而不定向的。在陌生情境中，这些婴儿可能表现出困惑、混乱和恐惧。被归为混乱型的婴儿，表现出明显的回避和抗拒，或其他一些特定的行为，如在养育者身边也感觉害怕等。" },
  { q: "影响依恋的因素主要有哪些？", a: "影响依恋的因素主要是：（1）依恋的机会；（2）抚育的质量；（3）婴儿的心理特点；（4）家庭环境和文化环境。" },
  { q: "婴儿早期同伴交往经历哪几个发展阶段？", a: "婴儿早期同伴交往经历以下三个发展阶段：\n1. 以客体为中心阶段：婴儿的交往更多集中在玩具或者物品上，通常互不理睬。\n2. 简单交往阶段：婴儿已经能对同伴的行为做出反应，经常企图去控制另一个婴儿的行为。\n3. 互补性交往阶段：婴儿同伴间的行为趋于互补，出现更多、更复杂的社交行为，且婴儿之间的相互影响持续时间更长，相互间模仿已经普遍。" },
  { q: "什么是社交指向行为？", a: "社交指向行为指婴儿意在指向同伴的各种具体行为，婴儿在发出这些行动时，总是伴随着对同伴的注意，也总能得到同伴的反应。\n缪勒、范德从社会技能发展的角度，把婴儿的早期同伴交往划分为四个阶段：简单社交行为；社会性相互影响；同伴游戏；早期友谊。" },
  { q: "婴儿自我认知发展分为哪几个阶段？", a: "詹姆斯认为自我由“主体我”和“客体我”组成。主体我是作为认知者的自我，是在主体内、在主观上构成的自我。客体我是把主体作为客体存在的个体来认识的自我，是主体通过客观反映、客观评价而认识的自我。婴儿先产生“主体我”，然后慢慢发展出“客体我”。\n现代对婴儿自我发展的研究大都以婴儿在镜子前面时是否产生自我指向行为，或者自我指向行为是否增加为标志来确定婴儿自我意识的发展。阿姆斯特丹利用研究黑猩猩自我再认的“红点子”方法，来确认婴儿是否拥有将自己当作客体来认识的能力。哈特在前人研究的基础之上，提出了主体我和客体我的发展模式，将婴儿自我认知发展分为5个阶段：\n1. 主体我的发展：\n（1）5~8个月：婴儿显示对镜像的兴趣，但未意识到自己的镜像与他人形象的区别，说明还未萌生自我认知。\n（2）9~12个月：婴儿表现出对自己作为活动主体的认识。这个阶段初步产生了主体我。\n（3）12~15个月：婴儿能区分自己和他人的动作，对自己的镜像与动作之间的关系有了清楚的觉知，主体我得到明确的发展。\n2. 客体我的发展：\n（4）15~18个月：婴儿开始将自己作为客体来认识，认识到客体特征来自主体特征。\n（5）18~24个月：婴儿已具有了用语言标示自我的能力，如使用代词标示自我与他人。婴儿在此年龄已经能意识到自己的独特特征，能从客体中认识自己，用语言标示自己，表明婴儿已经具有明确的客体我。" },
  { q: "早期的游戏理论有哪些？", a: "1. 霍尔的复演说：游戏是远古时代人类祖先的生活特征在儿童身上的重演。\n2. 席勒和斯宾塞的精力过剩说：游戏是儿童借以发泄体内过剩精力的一种方式。\n3. 彪勒夫妇的机能快乐说：游戏是儿童从行动中获得机体愉快的手段。\n4. 格罗斯的生活准备说：游戏是儿童对未来生活的无意识准备，是一种本能的练习活动。\n5. 拉扎勒斯和帕特里克的笑乐放松说：游戏不是源于精力过剩，而是来自放松的需要。\n6. 博伊千介克的成熟说：游戏不是本能，而是一般欲望的表现。\n7. 帕特里克的能量匮乏论：游戏的作用是在儿童完成新任务而消耗能量的情况下为儿童补充能量。\n8. 巴特森的游戏元交际理论：游戏是信息的交流和操作的过程，其特征就是元交际。" },
  { q: "当代游戏理论有哪些？", a: "1. 精神分析理论：弗洛伊德认为游戏也有潜意识（无意识）成分，游戏是补偿现实生活中不能满足的愿望和克服创伤性事件的手段。埃里克森从新精神分析的角度解释游戏，认为游戏是情感和思想的一种健康的发泄方式。\n【游戏疗法】是一种利用游戏的手段来矫正儿童心理与行为异常的方法，目前已在特殊教育领域和帮助儿童克服情绪障碍方面发挥了重要作用。\n2. 认知动力说：皮亚杰认为游戏是儿童认识新的复杂客体和事件的方法，是巩固和扩大概念、技能的方法，是使思维和行动结合起来的方法。儿童在游戏时并不发展新的认知结构，而是努力使自己的经验适合于之前存在的结构，即同化。儿童认知发展的阶段性决定了儿童特定时期的游戏方式。\n3. 学习理论：桑代克认为游戏也是一种学习行为，遵循效果律和练习律，受社会文化和教育要求的影响。各种文化和亚文化对不同类型行为的重视和奖励，其差别将反映在生活于不同文化社会的儿童游戏中。" },
  { q: "游戏的特点有哪些？", a: "1. 游戏具有社会性，是人的社会活动的一种初级模拟形式，反映了儿童周围的社会生活。\n2. 游戏是想象与现实生活的一种独特结合，不是社会生活的简单翻版。\n3. 游戏是儿童主动参与的、伴有愉悦体验的活动。" },
  { q: "游戏的作用有哪些？", a: "1. 在游戏过程中，儿童既可以体验到开放、自由、宽松的心理环境，又可以发展适应生活和解决问题的能力。\n2. 游戏可以使儿童运动器官得到很好的发展。\n3. 游戏使得儿童认知和社会交往能力能够更快、更好地发展。\n4. 游戏可帮助儿童学会表达和控制情绪，学会处理焦虑和内心冲突。\n5. 游戏对培养良好的个性品质同样有重要作用。\n6. 游戏是幼儿教育的重要手段。" },
  { q: "游戏的种类有哪些？", a: "按照游戏的目的性分类，幼儿的游戏主要有创造性游戏、教学游戏和活动性游戏。\n1. 创造性游戏：是由儿童独自想出来的游戏，有利于发展儿童的主动性和创造性，包括角色游戏、建筑性游戏、表演游戏等。创造性游戏通过多种形式，为幼儿提供了激发创造性思维的适宜氛围，有利于培养幼儿创造性的人格特征。\n2. 教学游戏：是结合一定的教育目的而编制的游戏。长远来看，教学游戏是儿童对于未来生活所做的准备和适应现实的一种手段。\n3. 活动性游戏：是发展儿童体力的一种游戏。这种游戏是发展小肌肉动作、手眼协调能力的适宜形式。由此可以提高儿童的身体素质并培养勇敢、坚毅、合作、关心集体等个性品质。\n此外，皮亚杰根据儿童认知发展阶段把游戏分为练习游戏、象征性游戏及有规则的游戏。\n帕滕则按照儿童社会性发展把游戏分为六种：无所用心的行为、旁观者行为、单独游戏、平行游戏、联合游戏和合作游戏。" },
  { q: "幼儿词汇的发展表现有哪些？", a: "儿童词汇的发展有先后顺序，对情境的依赖性较强，且发展不均衡，呈阶段性。幼儿词汇的发展主要表现为：\n1. 词汇数量的增加：幼儿期是一生中词汇数量增加最快的时期，幼儿的词汇量呈直线上升的趋势。在3~4岁时增长最快。\n2. 词汇内容的丰富和深化：随着年龄增长，幼儿词汇的概括性和抽象性在增加，对掌握的每个词的外延和内涵的理解也不断丰富和深刻。\n3. 词类范围的扩大：幼儿先后掌握的是名词、动词、形容词等实词，对虚词掌握较晚，掌握的数量也较少且没有明显增加。\n4. 积极词汇的增长：积极词汇是指儿童既能理解，又能正确使用的词汇。消极词汇是指儿童不能理解或者有些理解却不能正确使用的词汇。随着年龄的增长，幼儿对词义的理解逐渐准确和加深，其积极词汇比婴儿期显著增长。" },
  { q: "幼儿语法的掌握和口语表达能力的发展是怎样的？", a: "1. 语法的掌握：儿童语法的发展通常从两个方面表现出来，即句子的长短和句子结构的完整性、复杂性。研究表明，幼儿所使用句子的结构发展有如下趋势：\n（1）从简单句（单句）到复合句（复句）；\n（2）从陈述句到多种形式的句子；\n（3）从无修饰句到修饰句；\n（4）从不完整句到完整句。\n2. 口语表达能力的发展：儿童口语表达能力发展的快速期是3~5岁，连贯言语和独白言语的发展是儿童口语表达能力发展的重要标志。\n（1）独白言语：3岁前儿童的口语表达主要是对话言语。到了幼儿期，随着儿童活动的发展，儿童的独立性大大增加，他们渴望把自己的各种体验、印象等告诉成人，这样就促进了幼儿独白言语的发展。在正确教育下，一般到幼儿晚期，儿童就能较清楚、系统、绘声绘色地讲述看过或听过的事件或故事了。\n（2）连贯言语：幼儿初期，儿童言语表达具有情境性特点，往往想到什么说什么，缺乏条理性、连贯性，听话人要边听边猜才明白。随着年龄的增长，幼儿情境言语的比重逐渐下降，连贯言语的比重逐渐上升。" },
  { q: "幼儿记忆的发展特点有哪些？", a: "1. 记忆容量的增加：成人短时记忆容量为7±2个信息单位（组块），而7岁前儿童尚未达到这一标准。一般认为，儿童的记忆容量随年龄增长而增加。\n2. 无意识记和有意识记的发展：幼儿初期的儿童无意识记占优势，凡是儿童感兴趣的、印象鲜明和强烈的事物就容易记住，但让记忆服从于一定目的还有困难。在教育的影响下，幼儿晚期的儿童有意识记和追忆的能力逐步发展起来。有意识记的出现标志着儿童记忆发展上的一个质变。\n3. 形象记忆和语词记忆的发展：整个幼儿期，形象记忆占主要地位。研究表明，儿童两种记忆效果都随年龄增长而提高，而语词记忆效果的发展速率要高于形象记忆；无论哪个年龄阶段，形象记忆效果都优于语词记忆效果。\n4. 自传式记忆的发展：自传式记忆是指对个人特别重要的经历的回忆。儿童的自传式记忆在3岁以后才有一定的准确性，而其准确性在随后的整个幼儿期逐步缓慢地提高。但婴幼儿对于事件的记忆非常容易被误导，他们会以为一些虚构的事件或强加在自己身上的事情真的发生在自己身上了。\n5. 记忆策略的形成：记忆策略是人们为有效地完成记忆任务而采用的方法或手段。个体的记忆策略是不断发展的。年幼儿童自发运用记忆策略还有困难，但训练可以有效地改善儿童运用记忆策略的能力。两种记忆策略的形成：\n（1）复述：是一种非常重要的储存策略。相对来说，7~10岁儿童能更有效地使用复述策略，而且复述得越多，记忆成绩越好。并且，年长儿童和年幼儿童的复述方式是不同的。\n（2）组织（系统化）：指个体找出要识记材料所包含项目间的意义联系，依据这些联系进行记忆的过程，包括对信息储存和提取两方面的系统化。\n6. 元记忆的形成：元记忆就是关于记忆过程的知识或认知活动。关于记忆的元认知知识包括有关记忆主体、任务和策略三方面的内容。关于元记忆，幼儿并不是一无所知，即使是3~4岁的儿童也知道人的思维是有限的，而且有些信息更容易学习和保存。4~12岁儿童关于记忆的知识显著增长，他们逐渐把大脑看作一个主动的、建构性的单位，它储存的不仅仅是对现实的复制，还有对现实的解释。" },
  { q: "幼儿思维的特点有哪些？", a: "1. 思维的具体形象性：幼儿思维的主要特点是它的具体形象性。具体形象性思维是指儿童的思维主要凭借事物的具体形象或表象，即凭借具体形象的联想进行，而主要不是凭借对事物的内在本质和关系的理解，即凭借概念、判断和推理进行的。\n2. 思维的抽象逻辑性开始萌芽：在整个幼儿期，儿童的思维水平不断提高。幼儿初期的儿童更多运用直觉行动思维，幼儿中期以后开始出现抽象逻辑思维的萌芽。对于在经验范围内，而且又是熟悉的事物，幼儿能够进行简单的逻辑思维。\n3. 言语在幼儿思维发展中的作用日益增强：言语在幼儿思维中的作用，最初只是行动的总结，然后能够伴随着行动进行，最后才成为行动的计划。与此同时，思维活动起初主要依靠行动进行，后来才主要依靠言语来进行，并开始带有逻辑的性质。" },
  { q: "皮亚杰关于幼儿思维的研究有哪些？", a: "皮亚杰认为2~7岁儿童的思维属于前运算阶段，这一阶段儿童主要是表象性思维，思维的基本特点是相对具体性、不可逆性、自我中心性和刻板性。\n1. 三座山测验：前运算思维的基本特征是自我中心，即从自我的角度去解释世界，很难想象从别人的观点看事物是怎样的。\n实验是这样的，三座山以不同的颜色来区别，一座山上有一间房屋，另一座山顶上有一个红的十字架，还有一座山上覆盖着白雪。让儿童坐在桌子的一边，桌上放着这个模型。实验一中，实验者把一个娃娃放在桌子周围的不同位置，问儿童“娃娃看到了什么”。实验二中，实验者向儿童出示了不同角度拍摄的三座山的照片，让儿童挑出娃娃所看到的那张。实验三中，实验者给儿童三张硬纸板，要儿童按娃娃所见把三座山排好。\n结果显示，8岁以下儿童一般不能成功，大多数6岁以下儿童是从自己的观察角度而不是娃娃的观察角度来选择照片或搭建模型。因此，皮亚杰认为幼儿在对事物进行判断时是以自我为中心的，不能采纳别人的观点。\n博克设计了农场景观模型，测验结果比皮亚杰的要好，说明当场景是儿童熟悉的，问题也容易让儿童理解时，幼儿是能够考虑到别人的观点的。\n2. 守恒：守恒是皮亚杰的术语，指物质从一种形态转变为另一种形态时，有关物质含量保持不变的认识。前运算阶段的儿童的思维只能集中于问题的一个维度，注意的是事物表面的、明显的特征，具有中心化的特点。\n在液体守恒实验中，向儿童呈现两只相同的玻璃杯，杯中装有等量的液体。在儿童确知两只杯中的液体是等量的之后，实验者把其中一杯液体倒入旁边一只较高、较细的杯子中，液面自然升高。然后问儿童，新杯子中的液体比原先杯子中的多一些或少一些，还是一样多？大多数3~4岁的幼儿会回答“多一些”，因为他们只注意到了新杯子的高度。5~6岁儿童处于守恒的转折阶段，他们似乎意识到必须同时考虑杯子的高度和粗细，但在比较时，同时考虑两个维度还有困难。皮亚杰认为儿童一般在8岁左右达到守恒。\n3. 类包含：类包含指一类物体与其子类的关系。原则上，总类中物体的数量必然大于任一子类中物体的数量。皮亚杰认为前运算阶段的儿童缺乏这种推理能力，不能同时想到一个子类和整个一类。如给他儿童呈现一束由4朵红花和2朵白花组成的花束，问儿童“红花多还是花多”，前运算阶段的儿童通常回答“红花多”。\n此外，皮亚杰还认为幼儿不能区分一个物体表面看来像什么和真的是什么，不能进行因果推理。\n【元认知】实质上是个体以自身认知活动为对象的认知，是对自己认知活动的自我意识、自我体验、自我调节和控制。" },
  { q: "什么是心理理论？", a: "心理理论是指个体凭借一定的知识系统对自身或他人的心理状态进行推测，并据此对行为做出因果性解释与预测的能力。儿童拥有心理理论的主要标志是通过“错误信念”任务的测试。" },
  { q: "错误信念任务包括哪两种经典范式？", a: "错误信念任务测试的是儿童能否站在自己的立场来理解他人所持有的错误的想法。错误信念任务包括两种经典范式：\n1. 意外地点任务（意外转移任务）：在这类任务中，主试让被试掌握有关某物地点改变的信息，而第三者缺乏这种信息，然后让儿童预测第三者会在改变前还是改变后的地点寻找该物。\n2. 意外内容任务（表征变化任务）：在这类任务中，向儿童展示一个从外表看明显有某种特定内容物的物件（比如糖盒），随后向儿童揭示其真正内容物（比如铅笔），再让儿童回答有关自己最初对内容物的信念问题，以及猜测别的儿童对真正内容物的信念问题。\n关于错误信念任务的研究表明，3岁儿童在进行错误信念推理方面的能力是有限的，并且可能无法利用最显然的外表线索。相反，5岁儿童克服了实验任务中几乎所有困难，他们能够更好地理解所提的问题。" },
  { q: "心理理论发展的理论解释有哪些？", a: "1. 理论论：理论论侧重于人们对日常生活中心理知识的归纳、总结，其核心观点是儿童对心理认识或理解本质上如同理论，具有一般科学理论的基本特征。理论论强调经验在心理理论发展中的作用，认为经验能为儿童提供其不能理解的心理状态的信息，这些信息最终使儿童理解这种心理状态并修正和改进他们已有的心理理论。\n2. 模拟论：模拟论侧重于儿童运用心理理论时所采用的方法。模拟论认为，儿童可以利用他们关于自己的心理状态的认识，通过模拟获得对心理状态及其与行为间因果关系的认识。模拟论更强调儿童通过假装游戏或角色来择练习，以提高他们的模拟技能从而帮助他们形成越来越高级的心理理论。\n3. 模块论：模块论强调的是先天基础。模块论认为儿童先天存在的模块化机制在神经生理上达到成熟时，便获得对心理状态的认识。影响儿童“心理理论”发展的是神经成熟，而不是理论的修正，经验只不过在身体成熟期间对心理理论起着某种触发作用。" },
  { q: "心理理论发展的影响因素有哪些？", a: "1. 家庭因素：家庭是儿童最先接触的小社会，是儿童早期社会化的主要场所，而家庭中的父母作为儿童重要的抚养者，对于儿童各个方面的发展起着不可替代的作用。影响心理理论发展的家庭因素包括家庭规模、家庭假装游戏、家庭言语交流、父母教养态度和家庭背景等。\n2. 同伴关系：良好的同伴关系有助于儿童各种知识技能的获得，尤其是社会认知能力的发展。同伴关系本身不直接影响儿童的发展，而是通过在这种关系形成过程中所进行的同伴交往活动而产生作用。" },
  { q: "幼儿自我评价的发展特点有哪些？", a: "1. 从轻信成人的评价到自己独立评价；\n2. 从对外部行为的评价到对内心品质的评价；\n3. 从比较笼统的评价到比较细致的评价；\n4. 从带有主观情绪性的评价到初步客观的评价；\n5. 开始以道德行为的准则进行评价。\n总的来说，幼儿的自我评价能力还很差，成人对幼儿的评价在幼儿个性发展中起着重要作用。" },
  { q: "皮亚杰的儿童道德认知发展分为哪三个阶段？", a: "皮亚杰认为儿童的道德认知是从他律道德向自律道德转化的过程。他将儿童道德认知发展分为三个阶段，并认为幼儿的道德认知发展正处于第二阶段。幼儿道德的他律性实际是幼儿认知的自我中心和实在论的反映。\n1. 前道德阶段（0~4、5岁）：年幼的儿童对引起事情的原因只有模糊的了解，行为受其结果所支配。因此这一阶段的儿童既不是道德的，也不是非道德的。\n2. 他律道德阶段（5~10岁）：他律道德阶段又称道德实在论阶段，儿童认为规则是固定不变的、由权威给予的。按是否遵从权威来判断是非，判断行为的好坏完全根据行为结果，而不是根据主观动机。\n3. 自律道德阶段（10岁以后）：自律道德阶段又称道德相对论阶段，儿童更多根据动机而不是结果判断行为好坏，认识到规则可通过协商讨论而调整和改变，形成自己的内化了的道德标准。" },
  { q: "科尔伯格的儿童道德认知发展分为哪三个水平、六个阶段？", a: "科尔伯格采用道德两难故事法进行研究，提出了道德发展的三个水平、六个阶段。他认为幼儿的道德发展处于前习俗水平，此时幼儿尊重权威，目的是逃避来自严厉权威者的惩罚，同时出于自己的利益并考虑别人会如何回报他们的行动而服从、遵守规则，从而形成他律的道德判断。\n1. 前习俗水平（4~10岁）：由外在要求判断道德价值，主要着眼于自身的具体结果。\n①第一阶段：服从与惩罚定向。这一时期儿童专注于行为结果，服从规则以及避免惩罚。\n②第二阶段：天真的利己主义。这一时期儿童基于自己的利益和他人给予的回报来考虑服从原则，遵从习惯以获得奖赏。\n2. 习俗水平（10~13岁）：以他人期待和维持传统秩序判断道德价值，主要满足社会期望。\n③第三阶段：“好孩子”的定向。遵从陈规，避免他人不赞成、不喜欢。\n④第四阶段：维护权威和秩序的道德观。遵从权威，避免受到谴责。判断是非时，初具法治观念。\n3. 后习俗水平（13岁以后）：以自觉守约、行使权利、履行义务判断道德价值，主要履行自己选择的道德准则。\n⑤第五阶段：社会契约定向。遵从社会契约，维护公共利益。\n⑥第六阶段：普遍的伦理原则。相信道德法则的普遍价值，认识人性的尊严，遵从良心原则，避免自我责备。" },
  { q: "什么是攻击行为？", a: "攻击行为又称侵犯行为，是指任何有目的地侮辱或伤害他人（或其他生物）而受害者试图回避的行为。攻击可以是身体的攻击、言语的攻击，也可以是对别人权利的侵犯。攻击行为有两个基本特点：受害者知觉为不友好的、消极的行为；攻击者有意实施生理或心理的伤害。\n【工具性攻击】指向渴望得到的东西（如财物或权利），以伤害他人作为达到非攻击性目的的手段。\n【敌意性攻击】以人为定向，旨在伤害他人（身体、感情和自尊等），如报复、支配等。" },
  { q: "攻击行为的理论有哪些？", a: "1. 精神分析理论：人生来具有的死亡本能追求生命的终止，从事各种暴力和破坏性活动，是敌意的、攻击性冲动产生的根源。这种死亡本能有时也指向内部，如自我惩罚、自残甚至自杀。\n2. 生态学理论：人有基本的攻击本能。按照洛伦茨的观点，所有本能都是进化的产物，它保证了物种的生存和繁衍。攻击本能是进化的结果。\n3. 新行为主义：新行为主义者把攻击行为作为挫折的结果，认为挫折会导致攻击行为。攻击可以减轻挫折的痛苦，被攻击者发出的痛苦信号成为二级强化物。\n4. 社会学习理论：班杜拉把攻击行为看成是通过直接强化或观察学习习得的。他认为内部状态也许促发了攻击行为，但不是必需条件。攻击行为既然是习得的，那么也可以矫正。\n5. 社会信息加工理论：社会信息加工理论强调认知在攻击行为中的作用，认为一个人对挫折或明显的挑衅的反应并不过多依赖于实际呈现的社会线索，而是取决于他怎样加工和解释这一信息。" },
  { q: "攻击行为的控制方法有哪些？", a: "（1）消除对攻击行为的奖赏和关注；\n（2）榜样和认知训练策略；\n（3）移情训练；\n（4）创造减少冲突的环境。" },
  { q: "什么是亲社会行为？", a: "亲社会行为又称向社会行为、利他行为，是指任何符合社会期望而对他人、群体或社会有益的行为及趋向，如帮助、捐助、分享、赞扬等。" },
  { q: "亲社会行为的理论有哪些？", a: "1. 社会生物学观点：该理论用“族内适宜性”解释了利他行为的进化。\n2. 精神分析观点：弗洛伊德认为亲社会行为发展的必要条件是良好的亲子关系，认同起着重要作用。\n3. 社会学习理论：亲社会行为是社会学习和强化的结果，强化并不都是有形的奖励。\n4. 认知发展理论：随着儿童智力的发展，他们获得了重要的认知技能，这将影响到他们对亲社会问题的推理和行为的动机。\n5. 社会规范理论：社会规范是个体社会行为的价值标准，对人的亲社会行为有引导作用。" },
  { q: "亲社会行为的训练方法有哪些？", a: "（1）角色扮演训练；\n（2）行为强化训练；\n（3）自我概念训练；\n（4）榜样示范；\n（5）创造良好的社会氛围。" },
  { q: "性别角色的社会化过程包括哪些？", a: "性别角色是指属于特定性别的个体在一定的社会和群体中占有的适当位置，及其被该社会和群体规定了的行为模式。对性别角色的理解：\n（1）性别角色是以性别标准所划分的社会角色；\n性别角色的社会化过程包括：\n（1）理解性别（性别认同）：是指对一个人在基本生物学特性上属于男或女的认知和接受。\n（2）获得标准（性别角色标准）：是指社会成员公认的适合于男性或女性的动机、价值、行为方式和性格特征等，反映了文化或亚文化对不同性别成员行为适当性的期望。\n（3）取得认同（性别角色认同）：是指对一个人具有男子气或女子气的知觉和信念。\n（4）形成偏爱（性别角色偏爱）：是指对与性别角色相联系的活动和态度的个人偏爱。\n性别化是指儿童获得性别认同，获得其所属社会文化所认同的该性别成员应持有的动机、价值观以及行为方式的过程，也就是儿童获得性别角色行为和性别角色信念的过程。\n儿童的性别偏爱最早表现在对玩具的选择上。14~22个月的男孩就偏爱小汽车之类的玩具，而女孩则喜欢玩娃娃和毛绒玩具。18~24个月的婴儿即使在没有其他玩具的情况下，也通常拒绝玩异性孩子的玩具。在整个童年期，男孩更喜欢在同性别群体中活动，女孩则更关注个体，更乐意以同性别一对一的形式活动。" },
  { q: "什么是心理两性化？", a: "柏姆认为，男子气和女子气属于两个分离的独立维度，人可以具有两性化特质，糅合男女两性的优秀品质，不必只接受某一性别的特质而拒绝另一性别的特质。" },
  { q: "同伴关系的作用有哪些？", a: "同伴关系是儿童在交往过程中建立和发展起来的一种儿童之间特别是同龄人之间的人际关系。同伴关系在儿童生活中，尤其是在儿童个性和社会性发展中起着成人无法取代的独特作用，是不容忽视的环境因素之一。\n1. 同伴可以满足儿童归属和爱的需要以及尊重的需要：儿童在同伴集体中被同伴接纳并建立友谊，同时在集体中占有一定地位，受到赞许和尊重而产生一种心理上的满足，这有利于儿童的发展。\n2. 同伴交往为儿童提供了学习的机会：同伴榜样在改变儿童行为和态度中具有很大的作用。儿童常模仿同伴的行为并将其同化到自己的行为结构中去。\n3. 同伴是儿童特殊的信息渠道和参照框架：儿童常从同伴那里获得不能从成人那获得的知识和信息，并在将自己与同伴比较的过程中形成对自我的评价。\n4. 同伴是儿童得到情感支持的一个来源：当儿童面临陌生或恐怖情境时，好友在场可起到与父母同样的作用来消除紧张和压抑。" },
  { q: "同伴关系的发展特点是什么？", a: "在婴儿期，同伴关系只是最松散意义上的存在，儿童的社会交往非常有限。进入幼儿园，儿童与同伴的接触次数增加，他们不再把成人作为唯一的依靠对象。他们开始主动寻求同伴，喜欢和同伴共同参与活动，与同伴的交往比以前密切、频繁和持久。3~4岁儿童，依恋同伴的强度和与同伴建立起友谊的数量有显著增长，语言的发展也使同伴间的交往更加有效，儿童从事社会性程度较高的合作性游戏大大增多。\n儿童早期的友谊一般是脆弱、易变的，很快形成，又很快破裂。幼儿的友谊多半建立在地理位置接近（邻居）、有共同的兴趣和喜爱的活动以及拥有有趣的玩具的基础上。" },
  { q: "学习活动对心理发展的意义和作用是什么？", a: "1. 学校学习是在教师的指导下有目的、有系统地掌握知识、技能和行为规范的活动，是一种社会义务。儿童在这种特殊的学习过程中，产生责任感和义务感，意志力也得到了培养和锻炼，对个性发展具有重要意义。\n2. 儿童通过教学活动掌握读、写、算等基本的知识和技能，其心理活动的有意性和自觉性都明显地发展起来，其思维活动也逐渐从具体形象思维过渡到抽象逻辑思维。\n3. 在共同的学习活动中，儿童相互交流、相互帮助，不仅有助于儿童发展社会交往的技能，提高社会认知的水平，培养合作、互助的集体精神，还有助于儿童掌握各种基本的社会行为规范，形成并发展各种良好的品德。" },
  { q: "小学儿童思维发展的基本特点是什么？", a: "1. 逐步过渡到以抽象逻辑思维为主要形式，但仍带有很大的具体性。\n2. 由具体形象思维到抽象逻辑思维的过渡存在明显的关键期，大约在四年级（10~11岁）。\n3. 思维结构趋于完整，但有待完善。\n4. 思维发展过程的不平衡性。" },
  { q: "小学儿童思维基本过程的发展是怎样的？", a: "小学儿童思维的基本过程在逐渐发展，并日益完善。分析、综合及其派生的抽象、概括、比较、分类、具体化和系统化等思维过程最初只能在直接观察事物的条件下进行，而且也很简单，之后逐渐能在过去的知识经验和表象的基础上进行，最后向以概念为材料的理性过程较全面、深入且范围广泛地进行。言语在小学儿童的基本思维过程的发展中起着重要的作用，它使其思维的深刻性、广阔性、批判性、自我监控的水平获得迅速的发展。" },
  { q: "什么是角色采择？其发展阶段有哪些？", a: "角色采择能力也称观点采择能力，是指儿童采取他人的观点来理解他人的思想和情感的一种认知技能。塞尔曼运用两难故事法研究表明，观点采择能力的发展存在以下五个阶段：\n1. 阶段0：自我中心的或无差别的观点（3~6岁）：儿童不能认识到自己的观点与他人不同，因而往往根据自己的经验做出反应。\n2. 阶段1：社会—信息角色采择（6~8岁）：儿童开始意识到他人有不同的观点，但不能理解这种差异的原因。认为他人所做的即是其所想的，而不能了解他人行动前的思想。\n3. 阶段2：自我反省角色采择（8~10岁）：儿童逐渐认识到即使得到相同的信息，自己和他人的观点也可能会有冲突。他们已能考虑他人的观点，并预期他人的行为反应，但不能同时考虑自己和他人的观点。\n4. 阶段3：相互角色采择（10~12岁）：儿童能够同时考虑自己和他人的观点，并且认识到他人也可能这么做，能够以一个客观的旁观者的身份来解释和反应。\n5. 阶段4：社会和习俗系统的角色替换（12~15岁）：儿童开始运用社会系统和信息来分析、比较、评价自己和他人的观点。\n角色采样能力是随年龄增长而发展的，是与儿童社会经验有关的认知发展的技能。有些儿童的角色采样能力低于同龄人，这是其产生过失行为或不良行为的一个影响因素。训练在一定程度上可以提高儿童的角色采样能力。" },
  { q: "小学儿童亲子关系的变化表现在哪些方面？", a: "1. 父母与儿童的交往时间减少；\n2. 父母在儿童教养方面所处理的日常问题的类型发生了变化，出现许多新的更为复杂的问题；\n3. 儿童与父母的冲突数量减少了；\n4. 在纪律约束技术和控制过程方面，父母通常认为学龄儿童比学前儿童好控制一些；\n5. 父母对儿童的控制力量也在变化，随年龄的增长，儿童越来越多地自己做出决策。" },
  { q: "小学儿童同伴交往的特点是什么？", a: "同伴交往是儿童形成和发展个性特点、社会行为、价值观和态度的一个独特而主要的方式。\n1. 儿童与同伴交往的时间更多，交往形式更复杂；\n2. 儿童在同伴交往中传递信息的技能增强；\n3. 儿童更善于利用各种信息来决定自己对他人所采取的行动；\n4. 儿童更善于协调自己与其他儿童的活动；\n5. 儿童开始形成同伴团体。" },
  { q: "塞尔曼提出的儿童友谊发展阶段有哪些？", a: "友谊是和亲近的同伴、同学等建立起来的特殊亲密关系，对儿童的发展有重要影响，它提供了儿童相互学习社会技能、交往、合作和自我控制的机会，提供了儿童体验情绪和进行认识活动的源泉，为以后的人际关系提供了基础。塞尔曼提出儿童友谊发展有以下阶段：\n1. 第一阶段（3~7岁）：儿童还没有形成友谊的概念，朋友往往与实利和物质属性及邻近性相联系，这个时期的友谊不稳定。\n2. 第二阶段（4~9岁）：此时期为单向帮助阶段。若对方服从自己的愿望和要求就是朋友，否则就不是朋友。\n3. 第三阶段（6~12岁）：此时期为双向帮助，但不能共患难的合作阶段。儿童对友谊的交互性有一定了解，但仍具有明显的功利性特点。\n4. 第四阶段（9~15岁）：此时期为亲密的共享阶段。儿童认为朋友间可以相互分享，要相互保持信任和忠诚，同甘共苦。开始从品质方面来描述朋友，认为共同兴趣也是友谊的基础，出于共享和双方利益的目的而与他人建立友谊。但此时的友谊有着强烈的排他性和独占性。\n5. 第五阶段（12岁开始）：这是友谊发展的最高阶段。" },
  { q: "儿童同伴团体的特点和对儿童的影响有哪些？", a: "儿童同伴团体能满足儿童交往和归属的需要，在促进儿童社会化过程中有重要作用。\n1. 同伴团体的特点：（1）在一定规则基础上进行相互交往；（2）限制其成员的归属感；（3）具有明确或暗含的行为标准；（4）发展了使成员朝向完成共同目标而一起工作的组织。\n2. 同伴团体对儿童的影响：（1）提供了学习与同龄伙伴交往的机会；（2）提供了形成和评价自我概念的机会。" },
  { q: "小学儿童对教师的态度和教师的期望是怎样的？", a: "1. 小学儿童对教师的态度：小学儿童对教师的态度中情感成分比较重，教师努力保持与学生的良好关系有助于其教育思想的有效实施。\n2. 教师的期望：教师的期望会影响学生的学习，与小学高年级相比，低年级学生的改善更为明显。教师期望通过影响学生的心理特质和给学生提供不同的学习机会影响学生的学习。" },
  { q: "小学儿童品德发展的基本特点是什么？", a: "1. 小学儿童逐步形成自觉地运用道德认知来评价和调节道德行为的能力；\n2. 小学儿童的道德言行从比较协调到逐步分化；\n3. 自觉纪律的形成和发展在小学儿童品德发展中占有相当显著的地位。\n【自觉纪律】一种出自内心要求的纪律，是在儿童对于纪律认识和自觉要求的基础上形成的，而不是依靠外力强制的纪律。" },
  { q: "小学儿童道德动机发展的特点是什么？", a: "（1）由服从向独立发展；\n（2）由具体、近景向抽象、远景发展；\n（3）逐步产生道德动机的斗争，但激烈的冲突较少。" },
  { q: "小学儿童道德认识、道德情感、道德行为的特点是什么？", a: "1. 小学儿童道德认识的特点：道德认识主要指对社会道德规范、行为准则、是非观念的认知，包括对道德观念的掌握和道德判断能力的发展。\n（1）道德观念：小学儿童的道德观念迅速发展，尽管各种道德观念的发展速度和水平具有差异性，但在小学高年级儿童已形成各种基本道德观念。\n（2）道德判断：儿童的道德判断从受外部情境的制约逐步过渡到受内心的道德原则、道德信念的制约。但小学儿童在很多情况下，判断道德行为还不能以道德原则或道德信念为依据，而常常受到外部的、具体的情境所制约。\n2. 小学儿童道德情感的特点：道德情感是与人所具有的对于一定道德规范的需要直接相联系的一种体验，是一种高级情感。小学儿童的道德情感主要是在新的集体生活下发展起来的。在集体中，为了完成共同的任务和达到共同的目标，儿童逐渐意识到个人和集体、祖国的关系，并在学习等日常活动中产生了爱国主义情感、集体荣誉感、义务感、责任感、正义感等。\n3. 小学儿童道德行为的特点：道德行为是人在一定的道德意识的支配下表现出来的对他人和社会有道德意义的活动。道德行为是受多种因素影响的自觉行为，一般来说，儿童的道德意识水平越高，其道德行为的表现水平也越高。研究表明，社会强化、榜样、行为目标、行为结果以及短期训练都可能影响儿童的道德行为。" },
  { q: "青少年身体发展的一般特点有哪些？", a: "青春期是个体生长发育的第二个高峰期。在这一时期，青少年的身体和生理机能发生了急剧的变化，主要表现在身体外形的改变、体内机能的增强及性的发育和成熟三个方面。\n1. 身体外形的变化：青春期的个体外形变化最明显的特征就是身高的迅速增长，青春期是身高增长的第二个高峰期（第一个在1岁左右）。体重的增长也是身体发育的一个重要标志。第二性征是性发育的外部表现，随着它的出现，青少年开始从童年期的中性状态进入到两性分化的状态。个体的头面部特点也发生了变化，童年期的面部特征逐渐消失。\n2. 体内机能的增强：心血管系统出现了第二次生长加速；肺活量比青春期前增加1倍多；肌肉和骨骼发生了变化；随着神经系统的发育成熟，青少年的兴奋和抑制也逐渐趋于平衡。\n3. 性的发育与成熟：生殖系统是人体各系统中发育成熟最晚的，它的成熟标志着人体生理发育的完成。青春期个体的发育主要包括性激素的增多、性器官的发育、性机能的发育等。" },
  { q: "青少年心理发展的一般特点是什么？", a: "1. 生理变化对心理活动的冲击：\n（1）身体外形的变化使他们产生了成人感，因此在心理上他们也希望能尽快进入成人的世界，希望尽快摆脱童年时的一切，寻找到一种全新的行为准则，扮演一个全新的社会角色，获得一种全新的社会评价，重新体会人生的意义。就在这种种新的追求中，他们感到种种困惑。\n（2）由于性的成熟，青少年对异性产生了好奇和兴趣，萌发了与性相联系的一些新的情绪体验，滋生了对性的渴望，但又无法公开表现这种愿望和情绪，所以体会到一种强烈的冲击和压抑。\n2. 心理上成人感与幼稚感的矛盾：青春期个体的心理活动往往处于矛盾状态，其心理水平呈现半成熟半幼稚性。成熟性主要表现为他们产生了对成熟的强烈追求和感受，这来自身体的快速发育及性的成熟；幼稚性主要表现在认知能力、思想方法、人格特点及社会经验上。由于成人感和幼稚性并存，所以，青春期少年在心理上表现出种种冲突和矛盾，具有明显的不平衡性。\n（1）反抗性与依赖性：青春期个体产生了一种强烈的成人感，进而产生了强烈的独立意识，对一切都不愿意顺从，对人对事的看法常处于与成人相抵触的状态中。但是青少年的内心并没有完全摆脱对父母的依赖，只是依赖的方式较之过去有所变化。\n（2）闭锁性与开放性：青春期个体对外界的不信任和不满意使其更加封闭；同时因为孤独和寂寞而不断寻找朋友。\n（3）勇敢与怯懦：青春期个体在某些情况下能表现出很强的勇敢精神；有时候会在公共场合不够坦然和从容，表现得比较怯懦。\n（4）高傲与自卑：青春期的个体尚不能确切地评价和认识自己的智力潜能和性格特征，几次甚至一次偶然的成功，就可以使他们沾沾自喜；几次偶然的失利，就会让他们认为自己无能透顶而极度自卑。\n（5）否定童年与眷恋童年：随着身体的发育成熟，成人意识越发明显，以致他们力图从各个方面对自己的童年加以否定；但是他们又留恋无忧无虑的童年，留恋童年那种简单明了的行事方式及宣泄情绪的方法等等。" },
  { q: "青少年思维发展的特点是什么？", a: "青少年思维发展的基本模式是由形象思维、抽象思维过渡到辩证思维，主要特点是思维逐步符号化，具体表现为：\n1. 思维的概括能力增强；\n2. 能使用假设检验和更加一般的逻辑规则进行思考，不再借助于具体事物和事件；\n3. 思维活动中的自我意识成分增多，思维的反省性和监控性明显提高；\n4. 辩证思维能力增强，看问题不再那么绝对化；\n5. 思维的创造性也在迅速发展。\n【抽象逻辑思维】是一种通过假设进行的、形式的、反省的思维，其发展的初级形式是形式逻辑思维，高级形式是辩证逻辑思维。\n【思维监控】指为了保证达到预期的目的，在思维过程中将思维个体作为意识的对象，不断地对其进行积极主动的定向、控制、调节的能力。" },
  { q: "青少年创造性思维发展的特点是什么？", a: "创造性思维是指重新组织已有的知识经验，提出新的方案或程序，并创造出新的思维成果的思维活动。青少年期个体的创造性思维处于高度发展阶段。其发展特点表现为：\n1. 创造力整体呈阶段性发展，在同一阶段内呈连续性，小学六年级到初一为发展的关键期；\n2. 随着年龄的增长，高中生创造性思维的流畅性呈下降趋势，变通性平稳发展，独特性逐渐提高；\n3. 在性别方面，女生创造性水平明显高于男生；\n4. 创造性思维的组成成分存在不同的发展趋势，青少年的发散思维在小学五年级出现低谷后到初三一直处于上升阶段，初三为其发展的顶峰，其后到高三一直处于下降趋势。他们的创造性想象水平是随着年级升高而不断发展的，其在不同的发展阶段，发展速度不同。此外，在不同的年级，青少年对想象的表达方式不同。除创造性想象和发散思维外，青少年创造性思维的发展还表现在领悟、类比迁移及假设检验等方面。" },
  { q: "初中生自我中心思维与幼儿自我中心思维的区别是什么？", a: "自我中心是皮亚杰用来描述一种独特的思维方式的术语，指主体在思考问题或进行判断时受到自己需要和情感强烈影响的倾向。\n幼儿阶段的自我中心倾向表现在幼儿从自我的角度去解释世界，很难想象从别人的观点看事物是怎样的。这种自我中心是儿童还不能将自我与外界很好地区分开来。\n少年期出现的自我中心倾向则表现在少年虽能正确地认识客观世界，分清现实和想象的区别，了解和考虑别人的思想，但是却不能明确地区分自己关心的焦点与他人关心的焦点的不同。\n二者都表现出行为的自我为主倾向，但幼儿是由于生理上的不成熟以及各种认知能力的发展相对不足造成的，而少年则是思维品质的矛盾性所造成的，二者存在质的差异。" },
  { q: "初中生自我中心思维的表现有哪些？", a: "初中生思维中自我中心主要表现为，虽然他们能区别自己与他人的想法，但却不能明确区分他们关心的焦点与他人关心的焦点的不同所在。\n1. 假想的观众：他们感觉每天就像生活在舞台上一样，受到别人的欣赏和评判。他们非常重视别人对自己的评价，所以要花很多时间和心力来应付这些假想的观众。\n2. 独特的自我：初中生将别人如此关注他们的原因解释为自身的“与众不同”，即他们具有一个独特的自我。因此他们会将思想集中在自己的情感上，夸大自己的情绪感受，认为他的情绪体验是独一无二的，只有他才能感受到那种极度的痛苦与极度的狂喜。\n3. 个人神话：由假想观众而产生的个人神话，使得十几岁的青少年如此地确信人们都在观察他们，关注他们的一切细微的想法，以至于他们对自我的重要性不断夸大，进而感到自己是唯一的、与众不同的，他们经常感到自己到达了荣誉的顶峰，而很快又会落入失望的深渊。" },
  { q: "“独特的自我”与“个人神话”的异同是什么？", a: "1. 相同点：夸大自我的重要性，感到自己是唯一的、与众不同的；夸大自己的情绪体验，认为其情绪体验是独一无二的，经常感到极度的狂喜与极度的痛苦。\n2. 区别：“独特的自我”是青少年对于他人为何如此关注自己的解释，是产生“假想观众”的原因；“个人神话”是由“假想观众”而产生的，进一步使青少年确信他人在观察自己。" },
  { q: "青少年自我意识的基本特点有哪些？", a: "青春期是自我意识发展的第二个飞跃期。青春期自我意识高涨的表现是青少年内心世界的丰富性与个性上的主观偏执性。青年早期（即青少年的第二个阶段）自我意识的特点如下：\n1. 自我意识中独立意向的发展：青少年已经完全意识到自己是一个独立的个体，因此要求独立的愿望日趋强烈。\n2. 自我意识成分的分化：青少年在心理上把自我分成了“理想自我”和“现实自我”两个部分。\n3. 强烈地关心自己的个性成长：青少年十分关心自己个性特点方面的优缺点，在对人、对己进行评价时，也将个性是否完善放在首要位置。\n4. 自我评价的成熟：青少年能独立地评价自己的内心品质，其自我评价在一定程度上达到了主客观的辩证统一。\n5. 有较强的自尊心：青少年在其言行受到肯定和赞赏时，会产生强烈的满足感；反之，易产生强烈的挫折感。\n6. 道德意识的高度发展。\n总之，到了青少年中晚期，个体在自我观察、自我评价、自我体验、自我监督、自我控制等自我意识的诸成分上都获得了高度发展，并趋于成熟。" },
  { q: "影响青少年自我概念的因素有哪些？", a: "自我概念是指个体对自身的连续性、同一性的认识。影响青少年自我概念的因素有：\n1. 生理因素：主要是身体外观形态上的特点，这种特点会影响青少年自我概念的积极或消极程度。\n2. 认知水平：具有较高认知水平及成熟的形式逻辑和辩证逻辑思维特点的青少年往往具有更适当、更稳定的自我概念。\n3. 父母的自我概念倾向：这方面对青少年自我概念的影响是同方向的。\n4. 成功及失败经验的积累。" },
  { q: "什么是自我同一性？", a: "埃里克森将青少年期定义为一个人形成同一性的关键期，并且认为青少年经历了同一性对角色混乱这一心理冲突。自我同一性是指个体在特定环境中的自我整合与适应感，是个体寻求内在一致性和连续性的能力，是对“我是谁”“我将来的发展方向”以及“我如何适应社会”等问题的主观感受和意识。为了获得自我同一性，青少年必须在某种程度上整合自我知觉的许多不同方面，使其成为一致的自我感。" },
  { q: "马西娅的自我同一性理论包括哪四种重要方式？", a: "按照探索（危机）和自我投入两个维度，将自我同一性探索分为四种重要方式：\n1. 同一性扩散（探索、投入均无）：这类青少年既没有经历过同一性危机，也没有各种生活上的尝试和选择，他们既不行动，也不积极探索，或认为这样做太危险、太困难。\n2. 同一性早闭（有投入，无探索）：此类青少年还没有反复探索就对自己的生活做出了个人选择，但他们的人生选择往往由权威的父母、教师等做出，而不是自己探索得出的。\n3. 同一性延缓（无投入，有探索）：此类青少年正处于同一性危机之中，尚未做出选择，也未做出行动。他们仍在探索和积累知识，参加各类活动，希望能找出引导其生活的价值观和目标。\n4. 同一性完成（有投入，有探索）：此类青少年在经历同一性危机后，经过探索性选择后，把已经明确的价值观和目标付诸行动，他们心理健康，知道自己前进的方向。" },
  { q: "青少年同一性形成过程的影响因素有哪些？", a: "（1）认知发展水平；\n（2）与父母关系的远近以及父母的教养方式；\n（3）和同伴群体的相处以及友谊的建立；\n（4）学校、社会以及更广泛的文化背景。" },
  { q: "青少年情绪表现的两极性有哪些？", a: "1. 情绪表现的两极性：\n（1）强烈、狂暴性和温和、细腻性共存；\n（2）情绪的可变性和固执性共存；\n（3）内向性和表现性共存。\n2. 心境的变化：\n（1）烦恼突然增多：①不知道应该以何种姿态出现于公众面前；②与父母的关系出现裂痕；③不知如何保持或确立自己在同伴之中应有的地位。\n（2）孤独：霍林沃斯将青春期到青年早期这一年龄段称为“心理上的断乳”时期，他们在主观上有独立的要求和愿望，实际上却很难在短时间内适应独立生活。另外，此时青少年产生了对亲密感的需求，但与之相关的社会关系还没有建立起来，因此当陷入孤独状态时，常常难以自拔。\n（3）压抑：压抑是当需求、愿望等不能得到满足和实现时，产生的一种心理体验。随着年龄的增长，青少年产生了生理和心理等多方面的需求，但由于种种原因许多需求得不到满足。青少年的自尊心易受到打击，但又有争强好胜的冲动。在这种矛盾的情形下，他们常常处于压抑的心境。" },
  { q: "初中生反抗心理产生的原因有哪些？", a: "反抗心理是青少年普遍存在的一种个性心理特征。这种特征主要表现为对一切外在力量予以排斥的意识和行为倾向。初中生反抗心理产生的原因：\n1. 自我意识的突然高涨：这使他们更倾向于维护好自我形象，追求独立和自尊，但他们的某些想法及行为不能被现实接受，于是就产生过激想法，认为其行动的障碍来自成人，便产生了反抗心理。\n2. 中枢神经系统的兴奋性过强：在青春期的初期，个体有关性的中枢神经系统的活动性明显增强，个体的中枢神经系统处于过分活跃状态，使青少年对于周围的各种刺激，包括别人对他们的态度等表现得过于敏感，反应过于强烈。\n3. 独立意识：为了获得心理上独立的感受，他们对任何一种外在力量都有不同程度的排斥倾向。青少年的反抗心理很大程度上是为了否认自己是儿童，而确认自己已经是成熟的个体。" },
  { q: "初中生反抗心理的产生情境有哪些？", a: "（1）独立意识受到阻碍。青少年内心的独立要求很强烈，但父母没有适应这种情况，仍以过去那种关怀的态度对待他们，结果导致反抗行为。\n（2）自主性被忽视或受到阻碍。如父母不听取青少年的意见，将他们一味地置于支配、从属地位。\n（3）当个性伸展受到阻碍时，将引起青少年的反感。\n（4）当成人强迫青少年接受某种观点时，后者拒绝盲目接受，表现出对抗的倾向。" },
  { q: "初中生反抗心理的具体表现有哪些？", a: "1. 态度强硬，举止粗暴：反抗行为发生得十分迅速，常使对方措手不及。当时的任何劝导都无济于事，但事态平息后，这种强烈的反抗情绪也将较快地随之消失。\n2. 漠不关心，冷淡对待：这种情况常出现在性格内向的青少年身上。这种反抗态度和情绪不易随实际情景的变化而转移，具有固执性。\n3. 反抗的迁移性：青少年反抗行为的迁移性是指当某个人的某一方面的言行引起他们的反感时，他们就倾向于将这种反感及排斥迁移到这个人的方方面面，甚至将这个人全部否定。同样，当某一成人团体中的一个成员不能令他们满意时，他们就倾向于对该团体的所有成员均予以排斥。" },
  { q: "初中生反抗心理的应对方法有哪些？", a: "1. 父母需要正视初中生的反抗心理，正确处理亲子关系。\n2. 父母帮助初中生顺利度过反抗心理：\n（1）在逆反期到来之前父母就要做好思想准备。注意调整与孩子的关系和改善对待孩子的态度，为正确对待反抗心理做好准备。\n（2）尊重初中生的独立自主要求。尊重他们所需要的隐私权，遇事多与他们商量，倾听他们的意见。\n（3）以友相待。父母与少年相处中，要和他们建立朋友式的友谊关系，能够交流思想，吐露心声，能够进行良好的沟通，以朋友的关系对他们进行帮助和引导。\n（4）引导子女正确地接纳自己的变化，正确对待自己成长、发展中所遇到的困难和挫折。" },
  { q: "初中生人际交往发展的特点有哪些？", a: "1. 逐渐克服了团伙的交往方式：择友标准更加注重共同志向与相互理解，友谊关系稳定而持久。从过去集体性交友转移到注重个人内在素质特征，交往内容逐渐从活动外部层面向内在认识和体验方面发展。\n2. 朋友关系在生活中日益重要：这个时期是结交知心朋友的高峰期。他们认为朋友之间应该同甘共苦，能够从对方那里得到支持和帮助。他们重新认识朋友关系，感情重心转向知心朋友：心理接近（忠心）；朋友的多元化（满足多种需要与兴趣）；友谊呈现出性别差异。\n3. 与异性朋友之间的关系：双方开始意识到了性别的问题，并彼此对对方逐渐产生了兴趣。但是，在最初阶段他们对于异性的兴趣是以一种相反的方式予以表达，或者在异性面前表现出一种漠不关心的态度，或者以一种不友好的方式攻击对方。\n4. 与父母关系的变化：试图摆脱依赖，一方面转移感情重新寄托，另一方面开始反抗父母的干涉控制。与父母关系的变化表现在：情感上的脱离、行为上的脱离、观点上的脱离和父母的榜样作用削弱。\n5. 与教师的关系：青春期的少年不再盲目接受任何一位老师。他们开始品评老师，开始用批判的眼光分析不同类型的老师。" },
  { q: "青少年面临的心理社会问题有哪些？", a: "1. 成瘾行为：\n（1）吸烟成瘾：吸烟行为在青少年中非常普遍，研究发现青少年初次吸烟的年龄也有逐年降低的趋势。\n（2）游戏成瘾：青少年由于自制能力差，社会技能和自我保护意识较弱，更容易沉溺于游戏中，沉迷于电子游戏的青少年会表现出较高的抑郁和焦虑，容易产生一系列社交问题、行为问题以及家庭矛盾等。暴力游戏还可能引发青少年的攻击性行为。\n（3）网络成瘾：由于网络本身具有匿名性，且不受现实生活交流方式的限制，再加上家庭和学校的压力导致青少年产生情绪、认知和人际关系上的失调，青少年网络成瘾现象越来越普遍。\n2. 内部失调：青春期会引起一系列生理和心理上的变化以及对社会生活的不适应，青少年会产生困扰、绝望、悲观等消极的情绪，因此极易产生内部心理问题，如抑郁、焦虑、青春期精神分裂和自杀倾向等。\n3. 外部失调：外部失调包括反社会行为和青少年犯罪，研究者认为青少年的违法行为比其他年龄阶段更普遍。" },
  { q: "成年早期的一般特征有哪些？", a: "1. 从成长期到稳定的变化：具体表现为生理发展趋于稳定；心理发展，尤其是情感过程趋于成熟，性格特点基本定型；生活方式趋于固定化和习惯化；建立了较为稳定的家庭；社会职业稳定，且能忠于职守。\n2. 智力发展到达全盛时期：思维方式由形式逻辑思维为主转为以辩证逻辑思维为主，思维更具有相对性、变通性、灵活性、整合性和实用性。在成年早期最后阶段，个体的创造性思维发展也达到高峰，开始在不同领域内表现出不同程度的创造力。\n3. 恋爱、结婚到为人父母：一般来说，个体在18岁以后开始考虑婚姻问题。18~35岁是恋爱、结婚、养儿育女的年龄段。\n4. 创立事业到紧张工作：18岁后，个体开始选择职业，并在一定领域内实现自己的愿望。个体所选择的职业一般是和兴趣、能力、价值观联系在一起的，于是职业必然成为个体的一个立足点，并成为实现自我价值的重要手段。\n5. 困难重重到适应生活：成年早期个体将面临很多从未遇到的困难。在此之前，有父母的照顾、教师的指导、同学的协助，到了成年早期，个体需要处理各种社会关系，解决各种问题，承担社会责任与义务等，这些都需要自行解决，因此，良好的生活适应就成为了这个时期的主要发展课题。" },
  { q: "成年早期的思维优势有哪些？", a: "1. 成年早期的思维方式以辩证逻辑思维为主：辩证逻辑思维是对客观现实本质联系的对立统一的反映。佩里认为大学生的思维转变过程有三个阶段：二元论阶段、相对性阶段和约定性阶段。\n2. 成年早期的后期是表现创造性思维的重要时期：成年早期的前一个阶段是创造性思维充分准备的阶段，成年早期的后一个阶段是创造性思维较为成熟的阶段。因此成年早期是为人类积累文化财富的黄金时期。" },
  { q: "什么是双环模型？", a: "双环模型被用来解释自我同一性建立的内在过程。它认为自我同一性由彼此独立但又高度相关的五个维度构成，即广度探索、深度探索、沉浸探索、做出承诺和认同承诺。埃里克森认为自我同一性在15~18岁确立，后来研究表明，大约要到大学期间，个体才能达到同一性的确立。自我意识的发展和自我同一性的确立，决定着个体自我发展的方向和水平。因此，自我意识的发展和自我同一性的确立是成年早期的重要发展任务。" },
  { q: "成年中期的发育任务有哪些观点？", a: "1. 埃里克森的观点：埃里克森认为，人的一生可以分为既是连续的又是不同的八个阶段，每一阶段都有其特定的发展任务。成年中期处于第七阶段，发展的主要任务是获得繁衍感，避免停滞感，体验关怀的实现。\n2. 莱文森的观点：莱文森认为，成人发展是由一系列交替出现的稳定期和转折期构成的。他非常强调成年中期转折，并认为这个转折会发生在40岁出头的时候。在这一时期，个体要面临四个重要的问题，即依恋、分离、渴望亲密关系以及需要时间内省和认识自己。\n3. 古尔德的观点：古尔德认为成年人的发展，就是将自我从童年的种种限制中脱离出来，建立自己的同一性。成年期可分为五个阶段，在每个阶段个体都需要克服一个有关父母和童年角色的错误假定，以形成独特的自我。34~45岁，个体要克服的错误假定是“邪恶和死亡是不存在的”；45岁以后，个体要克服的错误假定是“个人内在的自我指导占据优势，我赢得了我自己”。\n4. 哈维格斯特的观点：哈维格斯特认为，成年中期的发育任务可归纳为七点：履行成年人的公民责任与社会责任；建立与维持生活的经济标准；开展成年期业余活动；帮助未成年的孩子成为有责任心的、幸福的成年人；同配偶保持和谐的关系；承受并适应中年人生理上的变化；与老年父母相适应。" },
  { q: "成年中期的智力发展模式是什么？", a: "智力发展模式是指智力水平随年龄变化的轨迹。中年人的智力发展模式如下：\n1. 晶体智力继续上升，流体智力缓慢下降。\n2. 机械型智力在成年早期达到顶峰后出现下降，实用型智力则不断增长。" },
  { q: "什么是双重过程模型？", a: "由巴尔特斯等人提出，认为智力主要由两种成分构成，即认知机械成分和认知实用成分，这两种成分在人的一生中呈现出非常不同的变化轨迹。认知机械成分可看作流体智力概念的引申，反映的是神经生理结构的认知操作水平，毕生发展轨迹呈先上升后下降的倒U字形；认知实用成分可看作晶体智力概念的引申，反映的是文化的作用，其毕生发展将随着知识经验的愈益丰富而不断增长。" },
  { q: "成年中期智力活动的性质是怎样的？", a: "1. 智力活动的性质：\n（1）智力是一种心理机能，具有适应意义。成年中期的个体需要承担重大的社会责任，因此，该阶段智力活动的主要任务是“应该怎样运用我所知道的东西”。\n（2）智力的主要成分。成年中期的智力活动任务，对应的智力构成成分是与学术、生活及社会有关的能力。\n（3）智力操作方式。智力操作方式即智力活动的内部特征，成年中期的个体智力特性具有辩证性、相对性、主观性、反省性、整合性以及接受不确定性等内涵。\n2. 智慧与专长：成年人智力发展的重心更多地落在与日常生活问题解决有关的智慧的增长以及与职业发展密切联系的专长的获得上。\n智慧是成年期智力发展的重要内容，也是成年人应对压力、处理问题、发展自我的重要资源。专长是主要受个体后天知识经验影响的人类智能成分，也可理解为胜任某一领域活动任务所必须具备的心理特征。" },
  { q: "成年期自我发展主要经历哪四种水平？", a: "自我是个性的重要组成部分。自我的发展实际上是个性发展的基础。成年期自我发展主要经历四种水平：\n（1）遵奉者水平，即按规则行事；\n（2）公正水平，也叫良心水平；\n（3）自主水平；\n（4）整合水平。其中整合水平是自我发展的最高水平。" },
  { q: "什么是控制理论？", a: "控制理论认为控制是人类发展的中心主题。其基本假设是人类总是努力想做好一些事情，使得自己在世界上留下生存的印迹，为了达到这个目的，个体就会对其所生存的环境进行控制，这种控制不是短暂的、暂时的，而是贯穿于一生当中。" },
  { q: "成年中期个性特点的稳定性与变化是什么？", a: "个性特点的稳定性，包括两层基本含义：个性结构的成分不变、各成分的平均水平不变。\n个性特点的变化：中年人的宜人性和谨慎性比年轻人更高；中年人的外向性、神经质和开放性比年轻人更低。" },
  { q: "什么是家庭生命周期？", a: "家庭生命周期，通常指的是从男女双方结为夫妻组成家庭开始，至夫妻双方死亡导致家庭解体而告终的家庭发展过程。根据家庭成员构成状况及发展任务的变化，家庭生命周期一般被划分为若干阶段，每一阶段都有相应的发展课题需要家庭成员去面对或解决。\n格里克将家庭生命周期分成八个阶段，即初始期、离家期、婚前期、生育前期、家有儿童期、家有青少年期、子女离家期和家庭后期。" },
  { q: "休珀的职业生涯发展理论分为哪五个阶段？", a: "根据个体自我概念的变化以及对职业角色的适应特征，休珀将人的一生分为五个阶段：\n1. 成长阶段（0~14岁）：在该阶段，儿童开始发展自我概念，同时逐步建立起有关职业角色的意识，并将这种意识与自我概念联系在一起。该阶段的主要任务是：发展自我形象与对工作的态度，了解工作的意义，并积累与未来工作相关的能力。\n2. 探索阶段（15~24岁）：在该阶段，个体通过打零工或参加学校和社会的活动，更多地认识自我，并尝试做出职业决策。该阶段的主要任务是：使职业偏好逐渐具体化、特定化，并将职业期望变成事实。\n3. 建立阶段（25~44岁）：该阶段个体已经进入特定的工作领域，努力掌握此领域中职业发展的信息，力图开辟自己在职业中的发展道路，把基本上适应的职业确定为自己的终生职业。该阶段的主要任务是：统整各种信息，保持稳定并追求上进。\n4. 维持阶段（45~59岁）：该阶段个体已经在工作领域取得了一定的地位，一般不寻求新的职业领域，而是朝着既定的目标前进。该阶段的主要任务是：维持既有成就与地位。\n5. 衰退与脱离阶段（60岁以上）：随着生理与心理机能日渐衰退，个体开始淡化职业角色，脱离工作岗位，考虑退休后的生活安排。该阶段的主要任务是：适应退休生活，发展新的角色或探寻合适的活动来补充退休后的空闲，同时维持自身的能力水平。" },
  { q: "成年中期职业发展的具体问题有哪些？", a: "1. 职业成熟度：是个体完成与其职业发展阶段相应的发展任务的程度，是职业发展理论中非常重要的概念。\n2. 工作满意感：是工作者在对其工作及工作相关因素评估基础上所产生的情感性反应。\n3. 职业倦怠：包括三个维度，即衰竭、工作怠慢及专业自我效能感降低。其中衰竭被定义为心理资源的损耗，工作怠慢被定义为对自己的工作不关心并有距离感，专业自我效能降低表现为对自己的职业成就做出消极评价。" },
  { q: "什么是老龄和老化？", a: "【老龄】指进入老年期的年龄。我国将60岁作为统一划分老年人口的界限。\n【老化】指个体在成熟期后的生命过程中所表现出来的一系列形态学以及生理、心理功能方面的退行性变化。" },
  { q: "传统发展观的主要理论依据是什么？", a: "传统发展观把老年期看作丧失期，把老年期心理活动的变化描写成只有衰退而没有发展。其主要的理论依据有三点：\n1. 将人主要看作是一个生物有机体，其心理活动将随着机体的发展而发展，随着机体的衰老而衰退；\n2. 心理的发展是单向前进的、不可逆转的；\n3. 年龄（时间）是心理发展或衰退的根据，并且是普遍适用的。" },
  { q: "毕生发展观的基本观点有哪些？", a: "以德国的巴尔特斯为代表的心理学家提出了毕生发展的基本观点：\n1. 个体的发展是贯穿一生的，发展中的心理和行为变化可以在人生中的任何一个时候发生，即从胚胎形成到衰亡的整个一生都在发展。\n2. 发展的形式具有多样性，发展的方向因心理与行为的种类不同而有差异。\n3. 任何一种心理或行为的发展过程都是复杂的，发展不是简单地朝着功能增长的方向运动，而是由获得（成长）和丧失（衰退）组成的。\n4. 个体的心理发展有很大的可塑性。\n5. 心理发展是由多重影响系统共同决定的，个体发展的任何一个过程是年龄阶段、历史阶段、非规范事件相互作用的产物。\n毕生发展观是一种积极的、乐观的老年心理变化观，认为衰老在一定程度上是可以延缓的，人们可以采取某些干预策略或措施来改善成年晚期的心理状态或延缓心理衰退。" },
  { q: "对传统发展观和毕生发展观的评价是什么？", a: "1. 传统发展观：传统发展观认为人的心理是随年龄的增长而发展、衰退的，这符合个体心理变化的总体趋势。但传统发展观将人主要看作生物有机体，过于看重生物机体的变化和年龄对心理变化的影响，把心理发展看作单向的、不可逆转的，以个体生物机体的成熟期作为心理发展或衰退的临界点，从而否定心理发展的连续性。这是不符合事实的，因而也是不可取的。\n2. 毕生发展观：毕生发展观提出的一系列心理发展的基本观点，是正确的、乐观的、应充分肯定的，其强调人到成年期以后，心理仍然继续发展。但这种理论在强调心理发展贯穿于个体整个一生，即强调心理发展的连续性的同时，对人到成年期尤其是成年晚期，其心理变化的总趋势是衰退或下降的这一事实，未能予以足够的重视。" },
  { q: "成年晚期认知活动的显著特点是什么？", a: "成年晚期认知活动的显著特点有三个：\n一是退行性变化，即总的趋势是减退或老化而不是增长或发展。\n二是持续性，即增长或发展并没有终止，而是在持续进行，如晶体智力等。\n三是差异性，表现在不同的心理机能老化的早晚和速率不同以及存在个体差异两个方面。" },
  { q: "成年晚期感知觉的变化表现在哪些方面？", a: "在成年晚期个体的各种认知活动中，感知觉的变化最明显。到了成年晚期感知觉显著减退，个体要产生和以前同样的主观感受就需要越来越强的刺激。\n1. 视觉减退：主要表现为视力下降、明适应和暗适应时间延长、对颜色的辨别力下降。\n2. 听觉减退：主要表现为听力下降、对声音的辨别力下降、对言语的理解力下降。\n3. 味觉、嗅觉和皮肤觉迟钝。" },
  { q: "成年晚期记忆老化的特点有哪些？", a: "成年晚期个体记忆既有减退，又仍有优势。记忆老化的特点包括：\n1. 再认成绩好于回忆成绩；\n2. 内容有关联的记忆和有意义的记忆成绩好于无意义的机械记忆成绩；\n3. 初级记忆成绩好于次级记忆成绩；\n4. 日常生活的记忆成绩好于实验室记忆成绩；\n5. 内隐记忆的年龄差异小于外显记忆；\n6. 语义记忆的年龄差异小于情境记忆。\n同时随着年龄的增长，记忆的个体差异也会增大。记忆随年龄增长而减退的原因非常复杂，概括起来主要受个体因素、特定环境因素、生物因素、加工速度减慢和工作记忆容量变小四个方面的影响。" },
  { q: "成年晚期思维和智力的变化是怎样的？", a: "1. 思维：老年人有强于青年人的概括能力、判断推理能力、综合分析能力，且这些能力不随年龄增长而减退，但在创造性思维和逻辑推理方面较青年人有所减退。\n2. 智力：根据不同的研究发现，老年人的智力有所减退，但并非全部减退。人的流体智力在成年早期达到最高峰以后逐渐减退，而晶体智力自成年以后不但不减退，反而有所增长，在七八十岁以后才略有减退。" },
  { q: "成年晚期情绪情感的一般特点是什么？", a: "1. 比较容易产生消极的情绪情感：人到老年期，由于生理、心理的退行性变化以及退休后角色地位、社会交往的变化，比较容易产生抑郁感、孤独感、衰老感和自卑感等消极情绪情感。\n2. 情感体验深刻而持久：老年人的情感体验深刻而持久，这主要表现在他们的道德感、美感方面。\n3. 情绪表达方式较为含蓄：老年人对自己的情绪表现和情感流露更倾向于控制。\n4. 各种“丧失”是情绪体验的最重要的激发事件：在影响老年期情绪体验的各种事件中，社会政治、经济地位、专业、健康、容貌、配偶等的丧失是最重要的激发事件。\n5. 我国老年人生活满意度较高：生活满意度是以个体生活愿望和需要为中介的、对生活持积极与肯定态度的内心体验。生活在具有尊老爱幼传统的社会主义制度下的我国老年人，情绪情感的基本特征就是生活满意度较高。\n【主观幸福感】指个体依据自己设定的标准对其生活质量所做的整体性评价，是衡量个人生活质量的重要综合性心理指标。" },
  { q: "成年期的社会性发展任务是什么？", a: "成年期是关注关系和成就的时期。亲密性可以在友谊和爱情中发生；在一生中，个体要在家庭和朋友的社会支持中保持平衡。成年期的另一个任务是再生：一种为他人幸福而做的努力。\n1. 亲密感：埃里克森认为亲密感是一种对他人坦诚相爱、情感及道德承诺的能力。亲密感可能出现在朋友关系和恋爱关系中。它要求坦率、勇气、伦理感，并且往往要牺牲掉一些个人偏好。社会亲密感是成年期心理健康的先决条件，重要的不是社会交往的数量，而是质量。当人们走入成年，会选择那些能够提供给自己情绪上的支持的个体，以保护自己对亲密感的需要。\n2. 再生力：那些建立适当亲密关系的人有能力将注意力转向再生力。这是超越自己对家庭、工作、社会或下一代的承诺，是30~40岁时一个至关重要的发展阶段。对于更好的定向使得成人建立起心理健康的感觉，以弥补对年轻的渴望。再生力的本质，就是努力成为一个“关注他人”的人——关注他人、富有同情心并拥有良好的社会关系。" },
  { q: "认知老化机制的代表性观点有哪些？", a: "认知老化是限制老年人工作活动能力和降低其生活独立性的重要原因之一，其表现为感知速度减慢，工作记忆下降，抑制无关刺激能力减弱，现场依赖性增强等。\n1. 加工速度理论：是认知老化研究领域内最为成熟和影响力最大的一种理论。该理论认为，加工速度减慢是认知功能年老减退的主要原因。\n2. 工作记忆理论：该理论认为，工作记忆容量随增龄而变小是导致认知功能年老减退的一个主要原因。\n3. 抑制功能理论：有效的加工不但需要激活与当前任务相关的信息，更重要的是要同时抑制与当前任务无关的信息。老年人认知功能的减退往往就是由于不能有效地抑制无关信息所致。\n4. 感觉功能理论：该理论把认知老化归于老年人的各种感觉功能衰退的结果。\n5. 执行功能减退假说：近年来神经生物学的研究表明：额叶，尤其前额叶是老化最敏感的一个脑区，并且发现认知功能的年老减退与额叶皮层功能或执行功能的减退关系密切。" },
  { q: "什么是SOC模型？", a: "巴尔特斯等人提出的SOC模型是成功解决成年晚期个体适应老化的理论模型。根据该理论模型，适应要整合以下三种过程：\n1. 选择：确认最有价值或最重要的机遇或活动领域；\n2. 最优化：有效地分配和提炼资源，以便在所选择的领域中发挥更大的作用；\n3. 补偿：在资源减少的情况下，确定一些可以弥补损失和将其对功能的消极影响减少到最小的策略。\n老年人要想对生活感到满意，必须根据自身的实际情况，选择某个具体目标作为发挥作用的重要领域，然后有效地投入内部资源，同时充分利用外部资源，以便发挥最大的作用。" },
  { q: "临终心理的阶段有哪些？", a: "屈布勒—罗斯及其同事通过临床观察，发现患晚期慢性病的老年人临终期长，意识一般比较清楚，在临终时的心理或精神状态一般要经过如下五个阶段：\n1. 否认：患者或者认为有关死亡的消息不是真实的，或者认为死亡不可能发生在自己身上。\n2. 愤怒：患者开始承认死亡，但充满愤怒而难以控制。\n3. 交易：也称讨价还价。患者往往表现得特别随和，通常与医生进行交易，取得同情、谅解和帮助。\n4. 抑郁：患者面对即将与亲人永诀，即将抛弃财产及自己所拥有的一切，因而表现出悲观、沮丧等抑郁情绪。\n5. 承受：患者听从或承受命运的摆布，不得不接受死亡的严峻现实。" }
];

/* ============ 逻辑 ============ */
const STORAGE_KEY = 'dev_quiz_v3';
let state = loadState();
let current = null;
let answerShown = false;
let history = [];
const $ = id => document.getElementById(id);

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.known) && Array.isArray(s.unknown)) return s; }
  } catch (e) {}
  return { known: [], unknown: [] };
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
function total() { return QUESTIONS.length; }
function updateProgress() {
  const known = state.known.length;
  $('knownCount').textContent = known;
  $('unknownCount').textContent = total() - known;
  $('progress').style.width = (known / total() * 100) + '%';
}
function pickQuestion() {
  let pool = state.unknown.slice();
  if (pool.length === 0) { pool = QUESTIONS.map((_, i) => i); state.unknown = pool.slice(); state.known = []; }
  if (pool.length > 1 && current !== null) pool = pool.filter(i => i !== current);
  return pool[Math.floor(Math.random() * pool.length)];
}
function renderQuestion() {
  current = pickQuestion(); answerShown = false; history.push(current);
  state.unknown = state.unknown.filter(i => i !== current); saveState();
  const item = QUESTIONS[current];
  $('tag').textContent = `第 ${current + 1} 题 / 共 ${total()} 题`;
  $('question').textContent = item.q;
  $('answer').textContent = item.a;
  $('answer').classList.remove('show');
  $('hint').style.display = 'block';
  $('actions').style.display = 'flex';
  $('actionsAfter').style.display = 'none';
  $('btnPrev').disabled = history.length <= 1;
  updateProgress();
}
function showAnswer() {
  if (answerShown) return; answerShown = true;
  $('answer').classList.add('show'); $('hint').style.display = 'none';
  $('actions').style.display = 'none'; $('actionsAfter').style.display = 'flex';
}
function markKnown() {
  if (!state.known.includes(current)) state.known.push(current);
  state.unknown = state.unknown.filter(i => i !== current);
  saveState(); renderQuestion();
}
function markUnknown() {
  if (!state.unknown.includes(current)) state.unknown.push(current);
  state.known = state.known.filter(i => i !== current);
  saveState(); renderQuestion();
}
function goPrev() {
  if (history.length <= 1) return;
  history.pop(); current = history[history.length - 1]; answerShown = false;
  const item = QUESTIONS[current];
  $('tag').textContent = `第 ${current + 1} 题 / 共 ${total()} 题`;
  $('question').textContent = item.q;
  $('answer').textContent = item.a;
  $('answer').classList.remove('show');
  $('hint').style.display = 'block';
  $('actions').style.display = 'flex';
  $('actionsAfter').style.display = 'none';
  $('btnPrev').disabled = history.length <= 1;
}
function resetProgress() {
  if (!confirm('确定要重置所有进度吗？')) return;
  state = { known: [], unknown: [] }; history = []; saveState(); renderQuestion();
}
function switchView(view) {
  $('quizView').style.display = view === 'quiz' ? 'block' : 'none';
  $('wrongView').classList.toggle('show', view === 'wrong');
  $('allView').classList.toggle('show', view === 'all');
  $('navQuiz').classList.toggle('active', view === 'quiz');
  $('navWrong').classList.toggle('active', view === 'wrong');
  $('navAll').classList.toggle('active', view === 'all');
  if (view === 'wrong') renderList('wrong');
  if (view === 'all') renderList('all');
}
function renderList(type) {
  const container = type === 'wrong' ? $('wrongList') : $('allList');
  let items = [];
  if (type === 'wrong') items = state.unknown.map(i => ({ index: i, item: QUESTIONS[i] }));
  else items = QUESTIONS.map((item, i) => ({ index: i, item }));
  if (items.length === 0) { container.innerHTML = '<div class="empty">暂时没有错题，继续加油！</div>'; return; }
  container.innerHTML = items.map(({ index, item }) => {
    const isKnown = state.known.includes(index);
    const tag = isKnown ? '<span class="li-tag ok">已掌握</span>' : '<span class="li-tag wrong">不熟</span>';
    return `<div class="list-item" data-i="${index}">${tag}<div class="li-q">${item.q}</div><div class="li-a">${item.a}</div></div>`;
  }).join('');
}
document.addEventListener('click', (e) => {
  const li = e.target.closest('.list-item');
  if (li) li.classList.toggle('open');
});
$('btnShow').addEventListener('click', showAnswer);
$('btnKnown').addEventListener('click', markKnown);
$('btnUnknown').addEventListener('click', markUnknown);
$('btnPrev').addEventListener('click', goPrev);
$('btnPrev2').addEventListener('click', goPrev);
$('btnReset').addEventListener('click', resetProgress);
$('navQuiz').addEventListener('click', () => switchView('quiz'));
$('navWrong').addEventListener('click', () => switchView('wrong'));
$('navAll').addEventListener('click', () => switchView('all'));
if (state.unknown.length === 0 && state.known.length === 0) {
  state.unknown = QUESTIONS.map((_, i) => i); saveState();
}
renderQuestion();

/* ============ 宠物 ============ */
(function(){
  const pet = document.getElementById('pet');
  const msg = document.getElementById('petMsg');
  const lines = ["加油，你可以的！","再记一遍就记住啦～","别急，慢慢来","你已经很棒了！","坚持就是胜利！","这道题快拿下了！"];
  let timer;
  let breath = 0, dir = 1;
  setInterval(() => {
    breath += dir * 0.15;
    if (breath > 1) { breath = 1; dir = -1; }
    if (breath < 0) { breath = 0; dir = 1; }
    pet.style.transform = `scale(${1 + breath * 0.03})`;
  }, 50);
  pet.addEventListener('click', () => {
    msg.textContent = lines[Math.floor(Math.random()*lines.length)];
    msg.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(() => msg.style.display = 'none', 1800);
  });
  function react(type) {
    if (type === 'yes') {
      pet.animate([{ transform: 'scale(1)' },{ transform: 'scale(1.15) rotate(-6deg)' },{ transform: 'scale(1) rotate(0)' }], { duration: 400 });
      msg.textContent = "真棒！✅"; msg.style.display = 'block';
      clearTimeout(timer); timer = setTimeout(() => msg.style.display = 'none', 1200);
    } else {
      pet.animate([{ transform: 'rotate(0)' },{ transform: 'rotate(8deg)' },{ transform: 'rotate(-8deg)' },{ transform: 'rotate(0)' }], { duration: 400 });
      msg.textContent = "没关系，再记一遍～"; msg.style.display = 'block';
      clearTimeout(timer); timer = setTimeout(() => msg.style.display = 'none', 1400);
    }
  }
  document.addEventListener('click', (e) => {
    if (e.target.id === 'btnKnown') react('yes');
    if (e.target.id === 'btnUnknown') react('no');
  });
})();
</script>
